# ============================================================================
# diff_score_config.schema.ini
#
# Schema describing the structure of diff_score_config.ini. The validator uses
# this at engine load time to catch typos and missing fields. The GUI uses
# it to render type-aware editing widgets.
#
# Documented dialect: ../docs/schema_format.md
# ============================================================================

[meta]
config_name = diff_score_config.ini
description = Multi-dimensional structural similarity scorer for evaluating
              candidate WatchGuard XML against a reference export.
version     = 1.0


# ============================================================================
# [meta] — header about the config itself
# ============================================================================
[section.meta]
description = Header info: name, version, description.
required    = true
fields      = name, version, description

[section.meta.field.name]
type     = string
required = true
help     = Human-readable name for this scorer config.

[section.meta.field.version]
type     = string
required = true
default  = 1.0.0
help     = Semantic version. Bump on breaking changes to the dimension shape.

[section.meta.field.description]
type     = multiline_string
help     = Free-text description of what this scorer config measures.


# ============================================================================
# [io] — input/output paths the scorer uses
# ============================================================================
[section.io]
description = File-system paths the scorer reads from and writes to.
required    = true
fields      = reference_xml, candidate_xml, output_report, output_summary

[section.io.field.reference_xml]
type      = path
path_kind = file
required  = true
help      = Reference WatchGuard XML — the truth oracle this scorer compares
            candidates against. Usually the user's hand-built T-30 export.

[section.io.field.candidate_xml]
type      = path
path_kind = file
required  = true
help      = Candidate XML to score (typically the Phase-2 emitter's dry_run
            output).

[section.io.field.output_report]
type      = path
path_kind = file
required  = true
help      = JSON report path. Detailed per-dimension breakdown.

[section.io.field.output_summary]
type      = path
path_kind = file
required  = true
help      = Human-readable summary path. One-screen aggregate view.


# ============================================================================
# [dimension.X] — one similarity dimension per section
# ============================================================================
[section_pattern.dimension]
match_pattern = ^dimension\.[\w_-]+$
description   = One scoring dimension. The aggregate score is a weighted
                average across all enabled dimensions. Each dimension declares
                its `kind` (the algorithm) and contributes a 0.0-1.0 score.
fields        = description, kind, weight, xpath_depth, ignore_xpath_prefixes,
                exclude_xpaths, sample_size, reference_rules, fields

[section_pattern.dimension.field.description]
type     = multiline_string
required = true
help     = What this dimension measures and what a low score indicates.

[section_pattern.dimension.field.kind]
type        = enum
required    = true
enum_values = xpath_set_jaccard, xpath_count_ratio, field_overlap,
              reference_resolution, value_histogram
help        = Algorithm. xpath_set_jaccard: presence-of-xpath set similarity.
              xpath_count_ratio: count-vector ratio similarity.
              field_overlap: per-element-type ratio of populated fields.
              reference_resolution: ratio of name-references that resolve.
              value_histogram: distribution-shape similarity over values.

[section_pattern.dimension.field.weight]
type     = string
required = true
default  = 1.0
help     = Weight (0.0-1.0 typical) in the aggregate score. Sum of weights
            need not equal 1; aggregate normalizes by the total.

[section_pattern.dimension.field.xpath_depth]
type     = int
min      = 1
help     = For xpath_set_jaccard / xpath_count_cosine: maximum XPath depth
            to consider. Limits noise from deeply-nested defaults.

[section_pattern.dimension.field.ignore_xpath_prefixes]
type     = csv
help     = XPath prefixes to skip entirely (e.g. WG-shipped lists like
           proxy-action-list/ that bias results toward 1.0 trivially).

[section_pattern.dimension.field.exclude_xpaths]
type     = csv
help     = Specific XPaths to exclude from this dimension.

[section_pattern.dimension.field.sample_size]
type     = int
min      = 1
help     = For value_distribution: number of values to sample per XPath.

[section_pattern.dimension.field.reference_rules]
type     = csv
help     = For cross_reference_integrity: names of [reference_rule.X]
           sections that declare which xpaths are name-refs and where their
           targets live.

[section_pattern.dimension.field.fields]
type     = csv
help     = For field_completeness / value_distribution: names of
           [value_field.X] sections this dimension scores against.


# ============================================================================
# [reference_rule.X] — declares one cross-reference relationship
# ============================================================================
[section_pattern.reference_rule]
match_pattern = ^reference_rule\.[\w_-]+$
description   = Declares one name-reference relationship: an XPath that
                contains a name, and the XPath where that name is defined.
                The cross_reference_integrity dimension uses these to verify
                no dangling references exist.
fields        = ref_xpath, target_xpath

[section_pattern.reference_rule.field.ref_xpath]
type     = xpath
required = true
help     = XPath of elements whose text is a NAME referencing some target.
           E.g. .//abs-policy/from-alias-list/alias

[section_pattern.reference_rule.field.target_xpath]
type     = xpath
required = true
help     = XPath of name elements that ref_xpath targets must resolve to.
           E.g. ./alias-list/alias/name


# ============================================================================
# [value_field.X] — one XPath whose values to score
# ============================================================================
[section_pattern.value_field]
match_pattern = ^value_field\.[\w_-]+$
description   = One XPath whose populated values feed the field_completeness
                or value_distribution dimensions. The X in [value_field.X]
                is the friendly name a dimension's `fields` list references.
fields        = xpath

[section_pattern.value_field.field.xpath]
type     = xpath
required = true
help     = The XPath whose text values get sampled / counted.


# ============================================================================
# [report] — output formatting controls
# ============================================================================
[section.report]
description = What to include in the output report and summary.
required    = false
fields      = include_xpath_details, include_per_field_breakdown,
              include_unresolved_refs_sample

[section.report.field.include_xpath_details]
type    = bool
default = true
help    = If true, the JSON report includes per-XPath presence/count details.

[section.report.field.include_per_field_breakdown]
type    = bool
default = true
help    = If true, field_completeness reports per-field present/missing counts.

[section.report.field.include_unresolved_refs_sample]
type    = int
min     = 0
default = 10
help    = Maximum number of unresolved-reference examples to include in
          the report. 0 disables sampling.
