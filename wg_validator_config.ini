# =========================================================================
# wg_validator_config.ini
#
# Engine settings for the WatchGuard XML validator.
# =========================================================================

[meta]
name        = wg_validator_config
version     = 1.0.0
description = Settings for wg_validator: which schema to use, which XML
              file to validate, and where to write the reports.

# -------------------------------------------------------------------------
# Input / output paths
# -------------------------------------------------------------------------
[io]

# The WG XML schema rules. Path relative to this config (or absolute).
schema_path     = wg_xml_schema.ini

# The XML file to validate. Default points at the toolkit's emitter
# output. Override at the command line with --candidate for one-off
# validation against any other XML file.
candidate_xml   = ../xml_emitter/dry_run/configuration.xml

# Directory for the report files (JSON + text summary).
output_dir      = output

output_json     = validation_report.json
output_summary  = validation_report.txt
references_path     = wg_xml_references.ini


# -------------------------------------------------------------------------
# Validator behavior
# -------------------------------------------------------------------------
[engine]

# How to flag elements that aren't declared in the schema.
# Options: error / warning / info
#
# warning is the safe default during early adoption — a reference-
# bootstrapped schema will always have gaps, and raising every unknown
# element to error overwhelms reports without helping the operator see
# real bugs.
#
# Move to "error" once the schema is mature and all known reference
# shapes are declared.
unknown_element_severity = warning
