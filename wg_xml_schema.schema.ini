# =========================================================================
# wg_xml_schema.schema.ini
#
# Validates wg_xml_schema.ini's shape: the schema-of-the-schema.
#
# Each [element.X] section in wg_xml_schema.ini must conform to one of
# three shapes (leaf, container, record). All three have a few common
# fields (kind, optional comments) and kind-specific ones.
# =========================================================================

[meta]
name        = wg_xml_schema_schema
version     = 1.0.0
description = Meta-schema for wg_xml_schema.ini. Validates that each
              element rule has a coherent kind and the kind-appropriate
              fields.


# -------------------------------------------------------------------------
[section.meta]
required = true

[section.meta.field.name]
type     = string
required = true

[section.meta.field.version]
type     = string
required = true

[section.meta.field.description]
type     = string
required = false


# -------------------------------------------------------------------------
# Pattern-matched section: any [element.X] section.
#
# We allow ALL three kinds' fields here; the validator engine
# itself enforces kind-specific consistency. The meta-schema only
# checks that the basic field types are right.
# -------------------------------------------------------------------------
[section_pattern.element\..+]
required = false

[section_pattern.element\..+.field.kind]
type        = enum
enum_values = leaf, container, record, ambiguous
required    = true
help        = One of: leaf (text content only), container (homogeneous
              child list), record (heterogeneous fields), ambiguous
              (tag observed with both leaf and record shapes — validator
              skips kind-shape checks for these; operator can split
              into context-keyed rules later).

[section_pattern.element\..+.field.item_element]
type     = string
required = false
help     = For kind=container, the tag name of the items.

[section_pattern.element\..+.field.required_fields]
type     = string
required = false
help     = Comma-separated list of fields that MUST appear in every
              instance (record kind only).

[section_pattern.element\..+.field.allowed_fields]
type     = string
required = false
help     = Comma-separated list of fields that MAY appear (record kind
              only). Fields outside this list are flagged.

[section_pattern.element\..+.field.repeating_fields]
type     = string
required = false
help     = Comma-separated list of fields that may legitimately repeat.
              Other fields are flagged if they appear more than once.

[section_pattern.element\..+.field.value_type]
type        = enum
enum_values = string, int
required    = false
help        = For kind=leaf, the expected value type. Default: string.

[section_pattern.element\..+.field.allowed_values]
type     = string
required = false
help     = For kind=leaf, comma-separated enum values.

[section_pattern.element\..+.field.value_pattern]
type     = string
required = false
help     = For kind=leaf, optional regex the text must match.

[section_pattern.element\..+.field.allow_empty]
type     = bool
required = false
help     = For kind=leaf, whether empty text content is acceptable.
