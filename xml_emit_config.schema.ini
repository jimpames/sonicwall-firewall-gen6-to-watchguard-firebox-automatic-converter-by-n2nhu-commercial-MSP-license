# ============================================================================
# xml_emit_config.schema.ini
#
# Schema describing the structure of xml_emit_config.ini. The validator uses
# this at engine load time to catch typos and missing fields. The GUI uses
# it to render type-aware editing widgets.
#
# Documented dialect: ../docs/schema_format.md
#
# Phase 2 takes canonical (and enriched) JSON and emits a WatchGuard
# configuration.xml. The engine is a generic tree-builder; THIS file's
# [emit.X] rules declare the tree structure, element names, attribute
# names, and value transformations.
#
# Algebraic-design model:
#       JSON Entry × Emit Rule = XML Element
# ============================================================================

[meta]
config_name = xml_emit_config.ini
description = Phase-2 JSON-to-WatchGuard-XML emit rules.
version     = 1.0


# ============================================================================
# [meta] — header
# ============================================================================
[section.meta]
description = Header info: name, version, description.
required    = true
fields      = name, version, description

[section.meta.field.name]
type     = string
required = true
help     = Human-readable name for this emit config.

[section.meta.field.version]
type     = string
required = true
default  = 1.0.0
help     = Semantic version. Bump on breaking changes.

[section.meta.field.description]
type     = multiline_string
help     = Free-text description of what this emit config produces.


# ============================================================================
# [io] — paths and root-element settings
# ============================================================================
[section.io]
description = File-system paths and root-element settings.
required    = true
fields      = enricher_output_dir, parser_output_dir, concept_map_path,
              output_dir, root_element, skeleton_path

[section.io.field.enricher_output_dir]
type      = path
path_kind = dir
required  = true
help      = Phase-1.5 enricher output directory. Primary input source.

[section.io.field.parser_output_dir]
type      = path
path_kind = dir
required  = true
help      = Phase-1 parser output directory. Used as fallback when an
            entry hasn't been touched by an enrichment pass.

[section.io.field.concept_map_path]
type      = path
path_kind = file
required  = true
help      = Path to concept_map.ini. Emit rules reference its
            value_map.X tables in their value_maps directive.

[section.io.field.output_dir]
type      = path
path_kind = dir
required  = true
help      = Where the configuration.xml, migration_notes.md, and emit
            manifest are written.

[section.io.field.root_element]
type     = string
required = true
default  = profile
help     = Top-level XML element name. WatchGuard uses 'profile'.

[section.io.field.skeleton_path]
type      = path
path_kind = file
help      = Optional master skeleton XML to start from. If set, the emitter
            walks INTO the skeleton's empty lists rather than building a
            tree from scratch. Required for import-shaped output.


# ============================================================================
# [emit.X] — one emit rule per section
# ============================================================================
[section_pattern.emit]
match_pattern = ^emit\.[\w_-]+$
description   = One emit rule. Each rule reads `input_file` (a JSON file in
                enricher_output_dir or parser_output_dir), filters with
                `input_filter`, and produces XML elements at
                `xml_parent_xpath`. Field-to-XML mapping is declared in
                child_map (and optional list_expand_* / nested_list_* /
                static_children directives).
fields        = description, status, input_file, input_filter,
                xml_parent_xpath, xml_element_name, name_attribute,
                name_template, child_map, static_children,
                conditional_children, value_maps, merge_implicit_addresses,
                list_expand_field, list_expand_subpath, list_expand_child_map,
                list_expand_static,
                nested_list_expand_field, nested_list_expand_subpath,
                nested_list_expand_child_map,
                nested_list_inner_field, nested_list_inner_subpath,
                nested_list_inner_child_map, nested_list_inner_static

[section_pattern.emit.field.description]
type     = multiline_string
required = true
help     = What this rule emits. Plain English; first line is shown in
           pipeline summaries.

[section_pattern.emit.field.status]
type        = enum
required    = true
enum_values = confirmed, partial, todo, advisory_only
help        = Maturity. confirmed = full schema known and emitting.
              partial = some fields confirmed, others stubbed.
              todo = stub only; emits a TODO XML comment marker.
              advisory_only = emits no XML; produces migration_notes entries.

[section_pattern.emit.field.input_file]
type     = string
required = true
help     = JSON file this rule reads (e.g. address_objects.json,
           vpn_policies.json). Searched in enricher_output_dir first,
           then parser_output_dir.

[section_pattern.emit.field.input_filter]
type = string
help = Optional Python-expression filter applied to each input entry.
       Entries for which the expression is falsy are skipped. Available
       names: each top-level field on the entry. E.g.
       vpn_type != "tunnel-interface".

[section_pattern.emit.field.xml_parent_xpath]
type = xpath
help = XPath of the parent element under which this rule's emitted
       children land. Required for status != advisory_only.

[section_pattern.emit.field.xml_element_name]
type = string
help = Tag name of each emitted element under xml_parent_xpath.

[section_pattern.emit.field.name_attribute]
type    = string
default = name
help    = Element name (or attribute) carrying the entry's identifier.
          Defaults to a child <name> element. The actual identifier value
          comes from name_template if set, else from the entry's first
          available key.

[section_pattern.emit.field.name_template]
type = string
help = Identifier template with {field|fallback|...} substitution. If a
       field is missing or empty, the next fallback is tried.
       Example: {name|comment|uuid}.1.from. Used heavily by abs-policy
       fan-out to keep cross-references stitched.

[section_pattern.emit.field.child_map]
type = multiline_string
help = Newline-separated 'input_field = xml_subpath [| value_map]' rules.
       The input_field is read from the entry; the xml_subpath (relative
       to xml_element_name) is created and filled with that value.
       Optional value_map applies translation from concept_map.ini.

[section_pattern.emit.field.static_children]
type = multiline_string
help = Newline-separated 'subpath = literal_value' lines. Filled in for
       every emitted element regardless of input. Use this for WG default
       fields that aren't in the SonicWall data (e.g. property = 0,
       proxy-type = '').

[section_pattern.emit.field.conditional_children]
type = multiline_string
help = Newline-separated '<predicate> = subpath' rules. Predicate is a
       Python expression on the entry; if truthy, the subpath is created
       (otherwise omitted). Used for ip-network-addr vs host-ip-addr
       branching on address-group children.

[section_pattern.emit.field.value_maps]
type = csv
help = Names of [value_map.X] sections in concept_map.ini that this
       rule's child_map / list_expand_* lines may reference.

[section_pattern.emit.field.merge_implicit_addresses]
type    = bool
default = false
help    = If true, this emit rule consults implicit_address_objects.json
          (synthesized in Phase 1.5) to resolve interface-relative
          references like 'X0 Subnet'.

# ---- list_expand_* — one entry's array becomes child elements -----------
[section_pattern.emit.field.list_expand_field]
type = string
help = Name of an array field on the entry; each element produces one
       child element nested at xml_parent_xpath/xml_element_name/<list_expand_subpath>.

[section_pattern.emit.field.list_expand_subpath]
type = string
help = Subpath where each list-expanded child element lands. May contain
       slashes for nested wrapping (e.g. service-item/member).

[section_pattern.emit.field.list_expand_child_map]
type = multiline_string
help = Per-list-element child_map. Same syntax as child_map but the
       member dict (not the parent entry) is the value source.

[section_pattern.emit.field.list_expand_static]
type = multiline_string
help = Per-list-element static_children. Same syntax as static_children
       but applied to each list-expanded element.

# ---- nested_list_expand_* — array-within-each-element-of-an-array -------
# Used for schedules: each entry has wg_schedule[] (per day), and each
# day has periods[] (per time slot). Two levels of expansion.
[section_pattern.emit.field.nested_list_expand_field]
type = string
help = Outer-list field on the entry (e.g. wg_schedule, where each
       element is one day's structure).

[section_pattern.emit.field.nested_list_expand_subpath]
type = string
help = Subpath where each outer-list element lands.

[section_pattern.emit.field.nested_list_expand_child_map]
type = multiline_string
help = Outer-list child_map (e.g. day_of_week = day-of-week).

[section_pattern.emit.field.nested_list_inner_field]
type = string
help = Field on each outer-list element holding the inner list (e.g.
       periods on each day).

[section_pattern.emit.field.nested_list_inner_subpath]
type = string
help = Subpath under the outer element where each inner-list element
       lands (e.g. period/member).

[section_pattern.emit.field.nested_list_inner_child_map]
type = multiline_string
help = Inner-list child_map (e.g. from_h = from-hour).

[section_pattern.emit.field.nested_list_inner_static]
type = multiline_string
help = Static fields applied to each inner element.

[section.validation]
required = false

[section.validation.field.enabled]
type = bool
required = true

[section.validation.field.schema_path]
type = string
required = true

[section.validation.field.unknown_element_severity]
type = enum
enum_values = error, warning, info
required = false

[section.validation.field.fail_on]
type = enum
enum_values = never, error, warning, info
required = false

[section.validation.field.references_path]
type = string
required = false

[section_pattern.emit.field.skip_name_patterns]
type = multiline_string
required = false
help = Optional list of regex patterns. Any input entry whose `name` field matches a pattern is dropped from emit and logged to migration_notes.md. Used to filter SonicWall-only constructs (e.g. auto-generated IPv6 system aliases) that have no WatchGuard equivalent.

[section_pattern.emit.field.skip_note_category]
type = string
required = false
help = Optional human-readable category label that appears in the migration_notes.md heading for filtered entries. Defaults to the rule name if not set.

[section_pattern.emit.field.merge_into_existing_by]
type = string
required = false
help = When set to a child-element tag (typically "name"), the engine looks for an existing element under xml_parent_xpath whose <child-tag>/text matches the resolved final_name, and merges into THAT element instead of creating a new one. Used when the master skeleton has pre-populated structural elements that source-side data should populate rather than duplicate.

[section_pattern.emit.field.derive_zone_from_first_token]
type = string
required = false
help = Pre-emit transformation: for each entry, take the first whitespace-token of the named field and store it as `zone`. Used for SonicWall ip-assignment._args = "LAN static" -> zone="LAN".

[section_pattern.emit.field.advisory_preamble]
type = multiline_string
required = false
help = For advisory_only rules: optional intro text rendered once at the top of the migration_notes.md section, before the per-entry advisory_template lines.

[section_pattern.emit.field.advisory_template]
type = multiline_string
required = false
help = For advisory_only rules: per-entry template rendered once for each matched entry, with {field} substitutions from the entry. When set, the template-based renderer is used instead of the legacy GVC-specific renderer.
