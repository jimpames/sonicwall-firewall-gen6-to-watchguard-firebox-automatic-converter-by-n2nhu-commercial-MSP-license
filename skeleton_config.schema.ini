# ============================================================================
# skeleton_config.schema.ini
#
# Schema describing the structure of skeleton_config.ini. The validator uses
# this at engine load time to catch typos and missing fields. The GUI uses
# it to render type-aware editing widgets.
#
# Documented dialect: ../docs/schema_format.md
# ============================================================================

[meta]
config_name = skeleton_config.ini
description = Declares which lists in a real WatchGuard XML export to empty,
              which to preserve, what secrets to redact, and what device
              identity to clear when producing a reusable skeleton.
version     = 1.0


# ============================================================================
# [meta]
# ============================================================================
[section.meta]
description = Header info: name, version, description.
required    = true
fields      = name, version, description

[section.meta.field.name]
type     = string
required = true
help     = Human-readable name for this skeleton config.

[section.meta.field.version]
type     = string
required = true
default  = 1.0.0
help     = Semantic version. Bump on breaking changes.

[section.meta.field.description]
type     = multiline_string
help     = Free-text description of the scrubbing strategy.


# ============================================================================
# [io] — paths
# ============================================================================
[section.io]
description = File-system paths the scrubber reads from and writes to.
required    = true
fields      = input_export, output_skeleton, output_audit

[section.io.field.input_export]
type      = path
path_kind = file
required  = true
help      = Real WatchGuard XML export to scrub. Treated as the source
            of WG-shipped defaults.

[section.io.field.output_skeleton]
type      = path
path_kind = file
required  = true
help      = Where the scrubbed master skeleton XML is written. Used by the
            Phase-2 emitter as the starting tree.

[section.io.field.output_audit]
type      = path
path_kind = file
required  = true
help      = JSON audit log: what was emptied, what was preserved, what was
            redacted. Useful for verifying no secrets leaked.


# ============================================================================
# [empty_lists] — top-level lists to empty entirely
# ============================================================================
[section.empty_lists]
description = WG top-level XML lists whose contents are ENTIRELY user-defined.
              Their contents are stripped (the empty <list/> element is left
              in place so other elements can reference it).
required    = true
fields      = description, migration_replaceable, migration_optional

[section.empty_lists.field.description]
type = multiline_string
help = Free-text documentation of the scrubbing strategy for these lists.

[section.empty_lists.field.migration_replaceable]
type     = csv
required = true
help     = Lists that the Phase-2 emitter will refill with migrated content.
           E.g. address-group-list, service-list, abs-policy-list.

[section.empty_lists.field.migration_optional]
type = csv
help = Lists the toolkit COULD refill from a SonicWall config, but doesn't
       yet (RADIUS, wireless, etc.). Empty in the skeleton; future-fill.


# ============================================================================
# [additive_lists.X] — one section per list that gets append-merged
# ============================================================================
[section_pattern.additive_lists]
match_pattern = ^additive_lists\.[\w_-]+$
description   = WG-shipped-defaults lists where the scrubber KEEPS the
                built-in entries and the emitter APPENDS migrated entries
                alongside. The list name (e.g. alias-list) is the X in the
                section name.
fields        = description, keep_names

[section_pattern.additive_lists.field.description]
type     = multiline_string
required = true
help     = What WG built-ins live in this list and why they must be kept.

[section_pattern.additive_lists.field.keep_names]
type     = csv
required = true
help     = Names of <name>-bearing entries to preserve verbatim. Anything
           else in this list during scrubbing is dropped (they were
           user-content from the source export).


# ============================================================================
# [preserve_lists] — top-level lists to keep as-is
# ============================================================================
[section.preserve_lists]
description = WG top-level lists that contain shipped templates / device
              defaults — keep verbatim. The Phase-2 emitter does not write
              into these.
required    = true
fields      = description, device_defaults, device_invariants,
              preserve_with_caveats

[section.preserve_lists.field.description]
type = multiline_string
help = Free-text rationale for what's preserved.

[section.preserve_lists.field.device_defaults]
type     = csv
required = true
help     = Lists carrying device-default templates (proxy-action-list,
           alarm-action-list, dlp-sensor-list, etc.).

[section.preserve_lists.field.device_invariants]
type = csv
help = Top-level scalar elements with device-shape invariants. Kept verbatim.
       Non-list root children (product-grade, rs-version, etc.).

[section.preserve_lists.field.preserve_with_caveats]
type = csv
help = Lists kept but with [device_identity_redact] applied to specific
       inner xpaths (e.g. system-parameters keeps NTP/DNS shape but redacts
       firebox-name, serial-number).


# ============================================================================
# [preserve_scaffolding] — containers whose inner structure is required
# by the WatchGuard importer (added post-Captain-friend-review).
# ============================================================================
[section.preserve_scaffolding]
description = Containers preserved with their inner scaffolding intact.
              Two flavors: verbatim_from_reference and fresh_stamp.
required    = false
fields      = description, verbatim_from_reference, fresh_stamp

[section.preserve_scaffolding.field.description]
type = multiline_string
help = Free-text rationale.

[section.preserve_scaffolding.field.verbatim_from_reference]
type = csv
help = Top-level tags whose contents are kept exactly as in the reference
       XML (gateway-wireless-controller scaffolding, etc.). Existing
       [redact] xpaths still apply.

[section.preserve_scaffolding.field.fresh_stamp]
type = csv
help = Top-level tags whose contents are cleared and replaced with one
       toolkit-stamped entry. Used for revision-history.

# ============================================================================
# [redact] — secrets to wipe before saving the skeleton
# ============================================================================
[section.redact]
description        = XPaths whose text is a secret. Replaced with the
                     paired _replacement value (defaulting to empty).
required           = true
fields             = description
dynamic_keys       = true
dynamic_value_type = string
dynamic_keys_help  = Each secret slot is two keys: <name> (the XPath) and
                     <name>_replacement (the substitute value, usually empty).

[section.redact.field.description]
type = multiline_string
help = Documentation of redaction policy and which secrets get wiped.


# ============================================================================
# [empty_lists_secondary] — second-tier lists to empty (privacy / reuse)
# ============================================================================
[section.empty_lists_secondary]
description = Lists that aren't user-content per se but should still be
              emptied for privacy or reuse (audit trails, etc.).
required    = false
fields      = description, audit_trails

[section.empty_lists_secondary.field.description]
type = multiline_string
help = Why these are emptied even though they aren't strictly user-content.

[section.empty_lists_secondary.field.audit_trails]
type = csv
help = Lists holding a chain-of-custody / change history that should be
       cleared before publishing the skeleton.


# ============================================================================
# [device_identity_redact] — xpaths to clear inside otherwise-preserved lists
# ============================================================================
[section.device_identity_redact]
description = XPaths inside otherwise-preserved lists that hold device
              identity (firebox-name, serial-number, license keys, etc.).
              Cleared so the skeleton is reusable across migrations.
required    = false
fields      = description, xpaths

[section.device_identity_redact.field.description]
type = multiline_string
help = Documentation of what device identity is being scrubbed and why.

[section.device_identity_redact.field.xpaths]
type = csv
help = XPaths whose text is cleared (set to empty) during scrubbing.


# ============================================================================
# [output] — formatting controls for the written skeleton
# ============================================================================
[section.output]
description = How the output XML is formatted on write.
required    = false
fields      = xml_declaration, header_comment, preserve_indentation

[section.output.field.xml_declaration]
type    = string
default = <?xml version="1.0" encoding="UTF-8"?>
help    = First line of the output file. Standard XML declaration.

[section.output.field.header_comment]
type = multiline_string
help = XML comment block emitted after the declaration. Identifies the
       skeleton's provenance and warns against hand-editing.

[section.output.field.preserve_indentation]
type    = bool
default = true
help    = If true, preserves the original element indentation. If false,
          re-indents to a consistent style.
