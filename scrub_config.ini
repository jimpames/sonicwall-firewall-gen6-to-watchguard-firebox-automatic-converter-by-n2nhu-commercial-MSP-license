# ============================================================================
# scrub_config.ini — jpa scrubber: factory-allowlist + private-blocklist
#
# Algebraic-design idea (J P Ames, "Applied Algebraic Design for Agentic AI"):
#   Object × Verb = Action.
#   Object = a jpa list (alias-list, address-group-list, ipsec-action-list, ...)
#   Verb   = scrub-by-allowlist | scrub-by-blocklist | scrub-by-pattern
#   Action = the entry stays or is removed from the skeleton.
#
# WHY THIS EXISTS
# ----------------
# jpa.xml is the export of a working Firebox. It contains TWO kinds of
# content interleaved:
#   (A) WG factory infrastructure — built-in services, aliases, default
#       policy package, standard IPSec proposals, factory NAT.
#   (B) jpa-customer-private data — that customer's address book entries
#       (FAKECO, BOGUS, ...), their VPN gateway IPs (174.62.83.243),
#       their custom NAT rules (snat demo), their schedule (MF 0700-1900).
#
# The skeleton engine MUST keep (A) and SCRUB (B). Without this scrub,
# we ship the previous customer's address book to the new customer's box.
# That's a privacy and correctness failure, and the on-box Web UI shows
# names like 'FAKECO-VPN-1' that the new customer has never heard of.
#
# HOW IT WORKS
# ------------
# For each PRESERVE_AND_APPEND list, this file declares:
#   factory_names = explicit list of jpa entry <name>s that ARE WG factory
#                   infrastructure. Anything not in this list (and not
#                   matching a factory_pattern) gets scrubbed.
#   factory_patterns = regex patterns that ALSO mark a name as factory
#                      (handles auto-generated `.1.from` / `.1.to` aliases).
#
# Separately, [private_strings] lists known jpa-customer-private values
# that MUST NOT appear anywhere in the emit. The validator scans the full
# XML body for these strings; if any are found, validation fails HARD.
# This is a backstop in case my factory classification is incomplete.
#
# Section ordering does not matter here (it's an allowlist, not a state
# machine). Each list's [scrub.<list-tag>] section is independent.
# 
#   (C) Copyright 2026, jim ames. all rights reserved. 
#   reverse engineering my system is prohibited.
#   license: closed source, commercial use license required.
#   no hobby or one-off use- MSP only
#
#   contact: jimpames@gmail.com for licensing
#
#   $10,000 per MSP one-time
# 
#  need something else other than sonicwall to watchguard?
#  translate most anything to sonicwall with THEIR universal translator
#  then use FESv11 algebraic to translate THAT to watchguard... 
# 
# 
# ============================================================================

[meta]
name        = jpa scrubber: factory-allowlist + private-blocklist
version     = 1.0.0
description = Removes jpa-customer-private entries from PRESERVE_AND_APPEND
              lists before the filler runs. Keeps WG factory infrastructure
              intact. Backstop validator scans for known-private strings.

# ============================================================================
# Per-list factory allowlists
# ============================================================================

# ---- alias-list ------------------------------------------------------------
# Factory aliases: WG built-ins (Any, External, Trusted, ...) + auto-generated
# .1.from / .1.to aliases that accompany factory policies in policy-list and
# abs-policy-list. Plus dnat.from.N aliases that pair with the FROZEN
# <dnat-list>.
[scrub.alias-list]
factory_names =
    Any
    Any-External
    Any-Trusted
    Any-Optional
    Any-BOVPN
    Any-MUVPN
    Any-Multicast
    External
    Trusted
    Optional-1
    Optional-2
    Optional-3
    Firebox
    dnat.from.1
    dnat.from.2
    dnat.from.3

# Patterns that ALSO match a factory alias name. These cover the auto-generated
# `.1.from` / `.1.to` aliases for every WG factory policy.
factory_patterns =
    ^Any From Firebox\.1\.(from|to)$
    ^BOVPN-Allow\.(in|out)\.1\.(from|to)$
    ^DNS\.1\.(from|to)$
    ^FTP-proxy\.1\.(from|to)$
    ^HTTP-proxy\.1\.(from|to)$
    ^HTTPS-proxy\.1\.(from|to)$
    ^Outgoing\.1\.(from|to)$
    ^Ping\.1\.(from|to)$
    ^Allow IKEv2-Users\.1\.(from|to)$
    ^Unhandled (External|Internal) Packet\.1\.(from|to)$
    ^WatchGuard\.1\.(from|to)$
    ^WatchGuard Certificate Portal\.1\.(from|to)$
    ^WatchGuard Web UI\.1\.(from|to)$


# ---- address-group-list ----------------------------------------------------
# Factory address-groups: WG built-ins, WG IKEv2 MVPN ranges, the dnat-paired
# address groups. The bovpntunnel.1.1.tlc/trm address-groups belong to the
# jpa-customer's site-to-site VPN (now scrubbed alongside its ipsec-action
# and interface) — they get scrubbed too.
[scrub.address-group-list]
factory_names =
    Any
    Firebox
    dnat.from.1
    dnat.from.2
    dnat.from.3

factory_patterns =
    ^WG IKEv2 MVPN_(mr|mp)$
    ^Any-


# ---- ipsec-action-list -----------------------------------------------------
# Factory IPSec actions: WG IKEv2 MVPN (the mobile-VPN action). bovpntunnel.1
# is the jpa-customer's tunnel — scrub.
[scrub.ipsec-action-list]
factory_names =
    WG IKEv2 MVPN

factory_patterns =


# ---- abs-ipsec-action-list -------------------------------------------------
[scrub.abs-ipsec-action-list]
factory_names =
    WG IKEv2 MVPN

factory_patterns =


# ---- ipsec-proposal-list ---------------------------------------------------
# Factory IPSec proposals: the standard ESP-* catalog + p2-WAN-GroupVPN
# which is referenced by the factory WG IKEv2 MVPN ipsec-action.
# Verified by inspecting jpa: WG IKEv2 MVPN's <ipsec-proposal><member>
# = 'p2-WAN-GroupVPN'.
[scrub.ipsec-proposal-list]
factory_names =
    p2-WAN-GroupVPN

factory_patterns =
    ^ESP-
    ^WG


# ---- ike-action-list -------------------------------------------------------
# Factory IKE actions: WG defaults + ike2_shared_action which is referenced
# by the factory 'WG Default IKEv2 Gateway' ike-policy. Verified by inspecting
# jpa: WG Default IKEv2 Gateway <ike-action>ike2_shared_action</ike-action>.
# bovpngateway.1_bo is jpa-customer (paired with bovpngateway.1) and gets
# scrubbed.
[scrub.ike-action-list]
factory_names =
    ike2_shared_action

factory_patterns =
    ^WG


# ---- ike-policy-list -------------------------------------------------------
# Factory IKE policies: WG defaults. bovpngateway.1 is jpa-customer; scrub.
[scrub.ike-policy-list]
factory_names =

factory_patterns =
    ^WG Default
    ^WG IKEv2


# ---- ike-policy-group-list -------------------------------------------------
# Factory IKE policy groups: WG defaults. bovpngateway.1 is jpa-customer.
[scrub.ike-policy-group-list]
factory_names =

factory_patterns =
    ^WG


# ---- abs-muvpn-list --------------------------------------------------------
[scrub.abs-muvpn-list]
factory_names =
    WG IKEv2 MVPN

factory_patterns =


# ---- schedule-list ---------------------------------------------------------
# Factory schedule: Always On (WG built-in). MF 0700-1900 is jpa-customer.
[scrub.schedule-list]
factory_names =
    Always On

factory_patterns =


# ---- nat-list --------------------------------------------------------------
# Factory NAT: Dynamic-NAT (required for outbound NAT + management return
# path). snat demo is jpa-customer.
[scrub.nat-list]
factory_names =
    Dynamic-NAT

factory_patterns =


# ---- policy-list -----------------------------------------------------------
# Factory policy package: the WG out-of-box policies. All other entries
# are jpa-customer. Names use the `-00` suffix convention.
[scrub.policy-list]
factory_names =
    Any From Firebox-00
    BOVPN-Allow.in-00
    BOVPN-Allow.out-00
    Allow IKEv2-Users-00
    Allow-IKE-to-Firebox
    Unhandled Internal Packet-00
    Unhandled External Packet-00
    WatchGuard-00
    WatchGuard Web UI-00
    WatchGuard Certificate Portal-00
    Ping-00
    DNS-00
    Outgoing-00
    FTP-proxy-00
    HTTP-proxy-00
    HTTPS-proxy-00

factory_patterns =


# ---- abs-policy-list -------------------------------------------------------
# Factory abs-policy definitions. Names DON'T have the -00 suffix.
[scrub.abs-policy-list]
factory_names =
    Any From Firebox
    BOVPN-Allow.in
    BOVPN-Allow.out
    Allow IKEv2-Users
    Unhandled Internal Packet
    Unhandled External Packet
    WatchGuard
    WatchGuard Web UI
    WatchGuard Certificate Portal
    Ping
    DNS
    Outgoing
    FTP-proxy
    HTTP-proxy
    HTTPS-proxy

factory_patterns =


# ---- service-list ----------------------------------------------------------
# Factory service catalog: WG's well-known service definitions. This list
# is large (~100 entries) and most names overlap with industry standards
# (HTTP, FTP, DNS, ...). The safer rule: KEEP every jpa service-list entry,
# because the service-list is a catalog of port/protocol bindings, not
# customer data. The jpa-customer's *services* (custom port ranges, etc.)
# would have been at the end of the list — but auditing jpa shows no
# customer-named services. If a future jpa shows custom service entries,
# add them to a known_private section below.
[scrub.service-list]
# Empty allowlist means: nothing is scrubbed by this rule.
# All jpa entries are kept; customer entries appended on top.
keep_all = true


# ============================================================================
# Known-private strings — the backstop validator
# ============================================================================
# Any of these strings appearing ANYWHERE in the emitted XML body is HARD
# proof we leaked jpa-customer-private data. The validator does a substring
# scan of the serialized XML. Even if my classification above is wrong or
# incomplete, this catches the specific data we already know is private.
#
# When a new jpa.xml is introduced, AUDIT it and add any new customer-private
# strings to this list. This is the "$1 on diff saves $100 on debug" check.
[private_strings]
strings =
    FAKECO-VPN-1
    FAKECO-VPN-2
    FAKECO-2025MGT-SOURCES
    BOGUS
    snat demo
    174.62.83.243
    173.62.83.243
    10.10.10.10
    20.20.20.20
    MF 0700-1900
