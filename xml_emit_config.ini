# ============================================================================
# xml_emit_config.ini  —  WatchGuard configuration.xml emit rules.
#
# Each [emit.X] section declares one section of the output XML.
#
# 'status' values:
#   confirmed     - XPath verified against watchparse.py and/or a T-30 export
#   todo          - stubbed; needs T-30 export to fill in element details
#   partial       - basics confirmed, edge cases TBD
#   advisory_only - emits a migration advisory note, no XML
#
# Order matters: dependencies first (concrete addresses before aliases that
# reference them; gateways before tunnels that reference them).
# ============================================================================

[meta]
name        = SonicWall canonical-JSON -> WatchGuard configuration.xml emitter
version     = 0.5.0
description = Phase 2 of the migration toolkit. Confirmed sections from
              watchparse.py reverse-engineering; remaining sections await
              T-30 hand-built export to fill in the schema.

[io]
enricher_output_dir = ../enricher/output
parser_output_dir   = ../sonicwall_parser/output
concept_map_path    = ../concept_map/concept_map.ini
output_dir          = ./dry_run
root_element        = profile

# Optional: start emit from a real-Firebox skeleton instead of an empty
# <profile>. The skeleton provides the device-default lists (proxy actions,
# alarm actions, DLP sensors, etc.) that a Firebox import expects.
# Generate with make_skeleton.py. Blank = build from empty root.
skeleton_path       = ../docs/skeletons/master_skeleton.xml


# ============================================================================
# CONFIRMED — schema validated by watchparse.py XPath queries
# ============================================================================

# ---- Static routes ---------------------------------------------------------
[emit.routes]
description       = Static routes -> /system-parameters/route/route-entry
status            = confirmed
input_file        = route_policies.json
xml_parent_xpath  = /profile/system-parameters/route
xml_element_name  = route-entry
child_map         = destination          = dest-address
                    netmask              = mask
                    gateway              = gateway-ip


# ---- Concrete address objects (SonicWall address-object -> WG address-group)
# !! VOCABULARY SWAP !! WatchGuard's "address-group" is the concrete primitive.
[emit.address_groups_concrete]
description       = Concrete host/network/range addresses ->
                    /address-group-list/address-group (WG concrete primitive).
                    !! VOCABULARY SWAP !! SonicWall calls these address-objects.
status            = confirmed
input_file        = address_objects.json
xml_parent_xpath  = /profile/address-group-list
xml_element_name  = address-group
name_attribute    = name
merge_implicit_addresses = true
# Each entry has zero-or-one of host/network/range. Translate accordingly.
# (Each rule must fit on ONE line; '; ' separates multiple child assignments.)
#
# WatchGuard's <member> element requires a <type> discriminator FIRST,
# before the address payload. From T30jpa1.xml reference:
#   <type>1</type> = host       paired with <host-ip-addr>
#   <type>2</type> = network    paired with <ip-network-addr> + <ip-mask>
# Range (<type>3>?) and fqdn (<type>4>?) — best-guess codes; the toolkit
# has no jpa.xml example for these. Lab-verify before relying on them.
# Found post-Phase-8 when Captain attempted lab T-30 import and got:
#   "400 Error line N: Element 'host-ip-addr': not expected, Expected ( type )"
#
# Note: conditional_children directives execute in declaration order,
# so writing `type=N` BEFORE the payload elements in the same directive
# string puts <type> first. This is equivalent to @first for static_children.
conditional_children = host_present    = addr-group-member/member/type=1; addr-group-member/member/host-ip-addr=<host>
                       network_present = addr-group-member/member/type=2; addr-group-member/member/ip-network-addr=<network_ip>; addr-group-member/member/ip-mask=<network_mask>
                       range_present   = addr-group-member/member/type=3; addr-group-member/member/start-ip-addr=<range_start>; addr-group-member/member/end-ip-addr=<range_end>
                       fqdn_present    = addr-group-member/member/type=4; addr-group-member/member/fqdn=<fqdn>
static_children       = property                                 = 16


# ---- Address group collections (SonicWall address-group -> WG alias)
# !! VOCABULARY SWAP !! WatchGuard's "alias" is the collection type.
[emit.aliases]
description       = Named collections of address references -> /alias-list/alias.
                    !! VOCABULARY SWAP !! SonicWall calls these address-groups.
status            = confirmed
input_file        = address_groups.json
xml_parent_xpath  = /profile/alias-list
xml_element_name  = alias
name_attribute    = name
# Members get listed under <alias-member-list>/<alias-member>.
# Per jpa.xml reference: <alias-member type=2> is the "reference to
# another alias" shape (41 instances in lab T-30). <alias-member type=1>
# is the "direct address/interface/user" shape (21 instances). The
# toolkit currently emits only type=2 (reference shape) since SonicWall
# address-groups always reference named address-objects.
#
# @first ensures <type> precedes <alias-name>, matching jpa.xml order.
child_map         = address-object  = alias-member-list/alias-member/alias-name
                    address-group   = alias-member-list/alias-member/alias-name
static_children   = alias-member-list/alias-member/type@first = 2
skip_name_patterns       = .* IPv6 (Link-Local|Primary (Dynamic|Static)) Address(?: Subnet)?$
                    .* IPv6 Subnets$
                    .* IPv6 Addresses$
                    .* Management IPv6 Addresses$
                    ^Default Geo-IP and Botnet Exclusion Group$
skip_note_category       = SonicWall IPv6 system aliases (no WG equivalent)


# ---- Services --------------------------------------------------------------
# Each service may have ONE protocol/port pair (singleton) or MULTIPLE in the
# `service_members` array (TCP/UDP merged twins). The emit produces one
# <member> per protocol/port. WatchGuard's <type>1</type> = "well-known
# protocol+port" — set as static_children. <protocol> is IANA number via
# value-map; <server-port> is the port_low.
[emit.services]
description       = Service objects -> /service-list/service.
                    Singleton TCP/UDP service -> one <service-item><member>.
                    Twin-merged service -> two <service-item><member> entries
                    (one per protocol). Emitted post-merge so the count
                    drops from 224 toward 106 (matching real WG count).
status            = confirmed
input_file        = service_objects.json
# Skip ICMP services entirely — they are SonicWall vendor builtins
# (33 of them on a stock NSA3600, none referenced by customer rules
# in tested configs). Translating them requires per-name lookup
# (echo-reply->0/255, echo-request->8/255, etc.) and produces
# <icmp-type>+<icmp-code> instead of <server-port>. WatchGuard's
# Firebox has its own ICMP catalog baked in; re-emitting the
# vendor builtins from source creates schema-conflict noise.
# Discovered 2026-06-03 via lab T-30 12.5.9 import error line 1348:
#   "Element 'server-port': 'echo-reply' is not a valid value of
#    the atomic type 'Port-Type'."
# If a future customer rule references a specific ICMP service,
# this filter needs an exception path. For now: skip uniformly.
input_filter      = protocol !~ "^(ICMP|IGMP)"
xml_parent_xpath  = /profile/service-list
xml_element_name  = service
name_attribute    = name
value_maps        = protocol_id
# Singleton case: protocol/port are top-level fields on the entry.
child_map         = protocol         = service-item/member/protocol | protocol_id
                    port_low         = service-item/member/server-port
# Multi-member case: emit one <member> per item in service_members[].
list_expand_field      = service_members
list_expand_subpath    = service-item/member
list_expand_child_map  = protocol = protocol | protocol_id
                         port_low = server-port
# type@first puts <type>1</type> at position 0; server-port=0 is a
# fallback for layer-3 protocols (ESP, AH, GRE, OSPF...) that have no
# port — matches jpa.xml's <server-port>0</server-port> convention.
list_expand_static     = type@first = 1
                         server-port = 0
# Static defaults from real T-30 service entries. The @first suffix
# on `service-item/member/type` forces it to position 0 inside <member>,
# matching jpa.xml's order — WatchGuard's importer rejects <member>
# elements where <type> comes after the payload (verified against
# lab T-30 12.5.9, line 839 of an earlier import attempt).
#
# `service-item/member/server-port` fallback to 0: WatchGuard schema
# requires <member type=1> to carry one of {icmp-type, server-port,
# start-server-port}. Layer-3 protocols (ESP=50, AH=51, GRE=47,
# IPCOMP=108, OSPF=89, 6OVER4=41) have no L4 port; per jpa.xml
# reference, WG represents them with <server-port>0</server-port>.
# child_map's `port_low → server-port` takes precedence; this fallback
# only fires when port_low is empty. Verified against lab T-30 12.5.9,
# line 1241 of an earlier import attempt ("Element 'member': Missing
# child element(s). Expected is one of ( icmp-type, server-port,
# start-server-port ).")
static_children   = property                            = 2
                    description                         =
                    proxy-type                          =
                    service-item/member/type@first      = 1
                    service-item/member/server-port     = 0
                    idle-timeout                        = 0


# ---- Service groups (post-expansion: same shape as merged services) -------
# After [pass.expand_service_groups] flattens each group's nested members
# into a list of leaf protocol/port records, the result is structurally
# identical to a multi-protocol service — just with more members. We emit
# them into the SAME /service-list (WG has no separate group list).
[emit.service_groups]
description       = Expanded SonicWall service-groups emit as additional
                    /service-list/service entries — each with one <member>
                    per leaf protocol/port. Same shape as merged services.
status            = confirmed
input_file        = service_groups.json
xml_parent_xpath  = /profile/service-list
xml_element_name  = service
name_attribute    = name
value_maps        = protocol_id
# Skip ICMP-only groups (vendor builtins, same rationale as [emit.services]
# input_filter on protocol=ICMP). The 15 SonicWall ICMP groups all have
# names matching one of these patterns. WatchGuard ships its own ICMP
# groups, so re-emitting these creates name collisions and schema mismatch.
skip_name_patterns       = ^(?:ICMP|Ping|ICMPv6|Ping6|IGMP)$
                    ^Neighbor Discovery$
                    ^Management Services$
                    .*(?:Destination Unreachable|Redirect|Time Exceeded|Parameter Problem|Router Renumbering|ICMP Node Information).*\s+Group$
skip_note_category       = SonicWall ICMP/IGMP vendor-builtin service groups
# Service groups never have a singleton protocol/port — only members.
list_expand_field      = service_members
list_expand_subpath    = service-item/member
list_expand_child_map  = protocol = protocol | protocol_id
                         port_low = server-port
# Same server-port=0 fallback as [emit.services] for layer-3 protocols.
list_expand_static     = type@first = 1
                         server-port = 0
static_children   = property                            = 2
                    description                         =
                    proxy-type                          =
                    idle-timeout                        = 0


# ---- Schedules ------------------------------------------------------------
# Phase 1.5 [pass.expand_schedules] produces wg_schedule[] (array of
# {day_of_week, periods[]}) and wg_schedule_type ('always_on' or 'recurring').
# Emit walks the array and produces one <schedule>/<member> per day, each
# with one <period>/<member> per time-window.
#
# WatchGuard schedule semantics from real T-30 export:
#   <type>0</type> = always-on; uses one <member> with <day-of-week>0</day-of-week>
#   <type>2</type> = recurring; one <member> per active day (1=Mon..7=Sun)
[emit.schedules]
description       = Schedules -> /schedule-list/schedule. Renders the
                    wg_schedule[] array produced by Phase 1.5 expansion
                    into nested <member>/<period>/<member> XML structure.
status            = confirmed
input_file        = schedules.json
xml_parent_xpath  = /profile/schedule-list
xml_element_name  = schedule
name_attribute    = name
value_maps        = wg_schedule_type_num
child_map         = comment              = description
                    wg_schedule_type     = type | wg_schedule_type_num
# Walk wg_schedule[] -> emit one <schedule>/<member> per day-of-week.
# Each member has <day-of-week> + a nested <period>/<member> per time-window.
# This is a TWO-LEVEL list expansion that needs new emit support.
nested_list_expand_field   = wg_schedule
nested_list_expand_subpath = schedule/member
nested_list_expand_child_map = day_of_week = day-of-week
nested_list_inner_field    = periods
nested_list_inner_subpath  = period/member
nested_list_inner_child_map = from_h = from-hour
                              from_m = from-min
                              to_h   = to-hour
                              to_m   = to-min
nested_list_inner_static   = on-flag = 1
static_children   = property                            = 4
                    on-off                              = 1

# ============================================================================
# FIREWALL POLICY FAN-OUT (one input -> four coordinated XML outputs)
#
# Discovery from real T-30 export: every <abs-policy> in WatchGuard generates
# THREE additional sibling artifacts elsewhere in the profile:
#
#   1. an <alias>  "<name>.1.from" in alias-list  (holds source-zone refs)
#   2. an <alias>  "<name>.1.to"   in alias-list  (holds dest-zone refs)
#   3. a <policy>  "<name>-00"     in policy-list (the runtime policy ref)
#
# The <abs-policy> itself REFERENCES these by auto-generated name. A
# WatchGuard import will reject a profile where any reference dangles.
#
# We model this as four emit rules driven by the same access_rules.json
# input. The auto-generated names are stitched together by name_template
# (a new directive that substitutes {name} from the source entry).
# Zone translation lands inside the from/to aliases — NOT in the abs-policy
# directly — matching real WG behavior.
# ============================================================================


# ---- 1. Auto-generated FROM aliases ---------------------------------------
[emit.firewall_policy_aliases_from]
description       = Per-policy auto-generated FROM alias holding source-zone
                    references. The <name>.1.from convention matches WG's
                    internal scheme. type=2 = alias-of-alias (zone reference).
status            = confirmed
input_file        = access_rules.json
xml_parent_xpath  = /profile/alias-list
xml_element_name  = alias
name_attribute    = uuid
name_template     = {name|comment|uuid}.1.from
value_maps        = zone
child_map         = from_zone         = alias-member-list/alias-member/alias-name | zone
static_children   = property                                       = 16
                    alias-member-list/alias-member/type@first      = 2


# ---- 2. Auto-generated TO aliases -----------------------------------------
[emit.firewall_policy_aliases_to]
description       = Per-policy auto-generated TO alias holding dest-zone
                    references.
status            = confirmed
input_file        = access_rules.json
xml_parent_xpath  = /profile/alias-list
xml_element_name  = alias
name_attribute    = uuid
name_template     = {name|comment|uuid}.1.to
value_maps        = zone
child_map         = to_zone           = alias-member-list/alias-member/alias-name | zone
static_children   = property                                       = 16
                    alias-member-list/alias-member/type@first      = 2


# ---- 3. The abs-policy itself ---------------------------------------------
[emit.firewall_policies]
description       = Firewall access rules -> /abs-policy-list/abs-policy.
                    References the auto-generated *.1.from / *.1.to aliases
                    by name (those are emitted by the rules above).
                    type=Firewall is the default; traffic-type=1 = inter-zone.
status            = confirmed
input_file        = access_rules.json
xml_parent_xpath  = /profile/abs-policy-list
xml_element_name  = abs-policy
name_attribute    = uuid
name_template     = {name|comment|uuid}
value_maps        = wg_firewall_action, wg_bool_text, wg_canonical_service, wg_canonical_schedule
child_map         = enable            = enabled | wg_bool_text
                    action            = firewall | wg_firewall_action
                    service           = service | wg_canonical_service
                    schedule          = settings/schedule | wg_canonical_schedule
                    logging           = settings/log-enabled | wg_bool_text
                    comment           = description
# Static defaults observed in real T-30 abs-policy entries.
# from/to-alias-list reference auto-generated *.1.from/*.1.to aliases (see rules 1-2).
# policy-list reference the matching policy-list/policy entry (see rule 4).
static_children   = property                                            = 0
                    type                                                = Firewall
                    traffic-type                                        = 1
                    reject-action                                       = TCP_RST
                    from-alias-list/alias                               = {name|comment|uuid}.1.from
                    to-alias-list/alias                                 = {name|comment|uuid}.1.to
                    settings/apply-one-to-one-nat-rules                 = true
                    settings/apply-dnat-global                          = true
                    settings/apply-dnat-all-traffic                     = false
                    settings/dnat-src-ip                                = 0.0.0.0
                    settings/connection-rate                            = 0
                    settings/qos-marking/marking-field                  = 0
                    settings/qos-marking/marking-method/marking-type    = 0
                    settings/qos-marking/priority-method                = 0
                    settings/schedule                                   = Always On
                    settings/auto-block-enabled                         = false
                    settings/snmp-enabled                               = false
                    settings/notification-enabled                       = false
                    settings/ips-monitor-enabled                        = false
                    settings/idle-timeout                               = 0
                    settings/using-global-sticky-setting                = 1
                    settings/policy-sticky-timer                        = 0
                    policy-list/policy                                  = {name|comment|uuid}-00
                    settings/compliance-check                        = false
                    settings/connection-rate-alarm                   = 
                    settings/forward-traffic-mgmt                    = 
                    settings/geo-action                              = Global
                    settings/launch-interval                         = 900
                    settings/log-for-report                          = 0
                    settings/non-compliant-drop                      = false
                    settings/notification-type                       = Email
                    settings/policy-routing                          = 
                    settings/proxy                                   = 
                    settings/quota-enabled                           = false
                    settings/repeat-count                            = 10
                    settings/reverse-traffic-mgmt                    = 
                    settings/traffic-mgmt                            = 
                    muvpn-users-list                                 = 
                    policy-nat                                       = 


# ---- 4. The runtime policy-list entry -------------------------------------
[emit.firewall_policies_runtime]
description       = Per-policy runtime entry in /policy-list.
                    DIFFERENT schema than abs-policy:
                      - numeric <firewall> (1=Allow, 0=Deny)
                      - numeric <enable> (1/0, not 'true'/'false')
                      - numeric <reject-action>
                    Both lists must be populated and cross-referenced for a
                    valid Firebox profile.
status            = confirmed
input_file        = access_rules.json
xml_parent_xpath  = /profile/policy-list
xml_element_name  = policy
name_attribute    = uuid
name_template     = {name|comment|uuid}-00
value_maps        = wg_bool_text, wg_canonical_service
child_map         = service           = service | wg_canonical_service
                    comment           = description
# Static defaults observed in real T-30 policy-list/policy entries.
# Different field encoding than abs-policy: numeric, not text.
static_children   = property                                       = 32
                    firewall                                       = 1
                    reject-action                                  = 1
                    enable                                         = 1
                    from-alias-list/alias                          = {name|comment|uuid}.1.from
                    to-alias-list/alias                            = {name|comment|uuid}.1.to
                    qos-marking/marking-field                      = 0
                    qos-marking/marking-method/marking-type        = 0
                    qos-marking/priority-method                    = 0
                    connection-rate                                = 0
                    log                                            = 0
                    idle-timeout                                   = 0
                    alarm                                   = 
                    compliance-check                        = 0
                    connection-rate-alarm                   = 
                    forward-traffic-mgmt                    = 
                    geo-action                              = Global
                    global-1to1-nat                         = 1
                    global-dnat                             = 1
                    ips-monitor-enabled                     = 0
                    log-for-report                          = 0
                    nat                                     = 
                    non-compliant-drop                      = 0
                    policy-routing                          = 
                    policy-sticky-timer                     = 0
                    proxy                                   = 
                    quota-enabled                           = 0
                    reverse-traffic-mgmt                    = 
                    schedule                                = Always On
                    send-tcp-reset                          = 1
                    traffic-mgmt                            = 
                    user-firewall                           = 0
                    using-global-sticky-setting             = 1



# ---- Interfaces ------------------------------------------------------------
[emit.interfaces]
description       = Interfaces -> /interface-list/interface.
                    Maps SonicWall X<n> ids to WG if-dev-name slots.
                    Static defaults observed in real T-30 export — full
                    physical-if, qos, anti-spoof, dos-prevention defaults.
                    Note real WG nests a <item> inside <if-item-list> — we
                    follow that schema. zone semantics live in the parent
                    <interface>'s name (mapped to WG zone alias separately).
status            = confirmed
input_file        = interfaces.json
xml_parent_xpath  = /profile/interface-list
xml_element_name  = interface
name_attribute    = zone
value_maps        = wg_bool_int, sw_zone_to_wg_iface_name
child_map         = ip-assignment.ip   = if-item-list/item/physical-if/ip
                    ip-assignment.netmask = if-item-list/item/physical-if/netmask
                    ip-assignment.gateway = if-item-list/item/physical-if/default-gateway
                    comment           = description
                    mtu               = if-item-list/item/physical-if/mtu
# Static defaults observed in real T-30 interface entries.
# Most are physical-link parameters (auto-negotiation, link-speed, full-duplex)
# and security defaults (anti-spoof, anti-scan, dos-prevention) that every
# Firebox interface needs. Without these the importer rejects the entry.
static_children   = property                                                 = 0
                    netflow                                                  = 0
                    multicast-if/enabled                                     = 0
                    multicast-if/rp-candidate                                = 0
                    if-item-list/item/item-type                              = 1
                    if-item-list/item/physical-if/enabled                    = 1
                    if-item-list/item/physical-if/if-property                = 1
                    if-item-list/item/physical-if/mtu                        = 1500
                    if-item-list/item/physical-if/auto-negotiation           = 1
                    if-item-list/item/physical-if/link-speed                 = 100
                    if-item-list/item/physical-if/mac-address-enable         = 0
                    if-item-list/item/physical-if/full-duplex                = 1
                    if-item-list/item/physical-if/anti-spoof                 = 1
                    if-item-list/item/physical-if/anti-scan                  = 0
                    if-item-list/item/physical-if/block-notification         = 0
                    if-item-list/item/physical-if/dos-prevention             = 1
                    if-item-list/item/physical-if/intra-inspection           = 0
                    if-item-list/item/physical-if/qos/max-link-bandwidth     = 0
                    if-item-list/item/physical-if/qos/qos-marking/marking-field          = 2
                    if-item-list/item/physical-if/qos/qos-marking/marking-method/marking-type = 0
                    if-item-list/item/physical-if/qos/qos-marking/priority-method        = 0
                    if-item-list/item/physical-if/static-mac-ip-binds/restrict-traffic   = 0
                    if-item-list/item/physical-if/static-mac-acl/enable                  = 0
derive_zone_from_first_token       = ip-assignment._args
merge_into_existing_by       = name


# ============================================================================
# CONFIRMED FROM T-30 EXPORT (Apr 2026)
#
# WatchGuard splits IPsec into FIVE related list elements (cracked from
# T-30 export):
#
#   <ike-policy>     - the "outer" Phase 1 gateway shell (peer-addr, PSK,
#                      DPD, NAT-T, version, vpn-type). References ike-action.
#   <ike-action>     - Phase 1 cipher transforms (algorithms, lifetimes, DH).
#                      Reusable across multiple ike-policies.
#   <ipsec-proposal> - Phase 2 ESP transforms (ESP encryption + auth + key-len).
#                      Reusable.
#   <ipsec-action>   - Phase 2 SA: links ike-policy + ipsec-proposal[] +
#                      local-remote address pair list. THIS is the tunnel.
#   <abs-muvpn>      - Mobile VPN bundle: references an ipsec-action.
#
# A site-to-site BOVPN = ike-policy + ike-action + ipsec-proposal + ipsec-action
# A Mobile-VPN-IKEv2  = same four + abs-muvpn
# ============================================================================


# ---- IKE Action (Phase 1 cipher transforms — reusable) ---------------------
[emit.ike_action]
description       = Phase 1 cipher transforms (encryption/auth/DH/lifetime).
                    Emitted once per VPN policy. Static defaults observed
                    in the real T-30 reference export are populated via
                    static_children so the emit is fully Firebox-shaped.
status            = confirmed
input_file        = vpn_policies.json
input_filter      = vpn_type != "tunnel-interface"
xml_parent_xpath  = /profile/ike-action-list
xml_element_name  = ike-action
name_attribute    = name
value_maps        = wg_ike_encryp_algm, wg_ike_auth_algm, wg_ike_prf_algm,
                    wg_time_unit, wg_ike_encryp_keylen
child_map         = description                = description
                    phase1.encryption          = ike-transform/member/encryp-algm | wg_ike_encryp_algm
                    phase1.authentication      = ike-transform/member/auth-algm | wg_ike_auth_algm
                    phase1.authentication      = ike-transform/member/prf-algm | wg_ike_prf_algm
                    phase1.encryption          = ike-transform/member/encryp-key-len | wg_ike_encryp_keylen
                    phase1.dh_group            = ike-transform/member/dh-group
# Static defaults from real T-30 export. property=16 is the bitfield seen on
# shipped ike-actions. mode=0 = aggressive disabled. pfs=0/xauth=1 = IKEv2.
# nat-t-config required for IKEv2 NAT-T traversal. auth-method=1 = PSK.
# life-length=0 = use time-based lifetime only.
static_children   = property                                       = 16
                    description                                    =
                    mode                                           = 0
                    nat-t-config/nat-t-enabled                     = 1
                    nat-t-config/nat-t-keep-alive                  = 20
                    nat-t-config/nat-t-from-port                   = 4500
                    nat-t-config/nat-t-to-port                     = 4500
                    nat-t-config/nat-t-udp-checksum-enabled        = 0
                    pfs                                            = 0
                    xauth                                          = 1
                    ike-transform/member/auth-method               = 1
                    ike-transform/member/time-unit                 = 1
                    ike-transform/member/lifetime                  = 24
                    ike-transform/member/life-length               = 0


# ---- IKE Policy (Phase 1 gateway shell — peer, PSK, DPD, NAT-T) -----------
[emit.ike_policy]
description       = Phase 1 gateway shell. References its ike-action by name.
                    PSK is LEFT EMPTY on purpose — operator fills in via the
                    sidecar secrets.ini during migration review.
status            = confirmed
input_file        = vpn_policies.json
input_filter      = vpn_type != "tunnel-interface"
xml_parent_xpath  = /profile/ike-policy-list
xml_element_name  = ike-policy
name_attribute    = name
value_maps        = wg_ike_version, wg_bool_int
child_map         = description                = description
                    phase1.exchange            = version | wg_ike_version
                    enable                     = enabled | wg_bool_int
                    name                       = ike-action
# Static defaults from real T-30 export. peer-addr=Any is correct for
# group-vpn (dynamic peers); site-to-site will need a peer-addr override.
# DPD/keep-alive defaults match shipped 'WG Default IKEv2 Gateway'.
static_children   = property                   = 16
                    # enabled + version: WG 12.5.9 XSD requires both in
                    # every <ike-policy>. child_map sets them when source
                    # data has phase1.exchange and enable fields; these
                    # are fallback defaults when source is silent. IKEv2
                    # is the modern default; enabled=1 follows jpa.xml
                    # which shows all instances with enabled=1.
                    enabled                    = 1
                    version                    = 2
                    peer-addr                  = Any
                    peer-auth/peer-auth-mask   = 1
                    peer-auth/ip-addr          = Any
                    local-cert/rsa-id-type     = 0
                    local-cert/psk-hex         = 0
                    local-cert/local-id-type   = 0
                    local-cert/local-if        = Any-External
                    keep-alive-interval        = 30
                    keep-alive-max             = 3
                    dpd-enabled                = 1
                    dpd-max-failure            = 5
                    dpd-worry-metric           = 20
                    vpn-type                   = 1
                    auto-start                 = 1
                    local-cert/dsa-id-type   = 0
                    local-cert/rsa-id        = 0
                    # WG XSD requires <local-cert> contain at least one of:
                    # rsa-cert, dsa-cert, dsa-id, ec-cert, ec-id, ec-id-type,
                    # gen-cert-id, psk, local-id-data, local-if-ip.
                    # Per jpa.xml, ALL real instances carry empty <psk>,
                    # <local-id-data>, <rsa-cert>, and <dsa-cert> placeholders
                    # even when not in use. Adding them silences the
                    # XSD complaint. PSK value stays empty — operator fills
                    # in via sidecar secrets.ini during migration review.
                    # Verified against lab T-30 12.5.9 import error line 3619:
                    #   "Element 'local-cert': Missing child element(s).
                    #    Expected is one of ( rsa-cert, dsa-cert, dsa-id,
                    #    ec-cert, ec-id, ec-id-type, gen-cert-id, psk,
                    #    local-id-data, local-if-ip )."
                    local-cert/rsa-cert      = 
                    local-cert/dsa-cert      = 
                    local-cert/psk           = 
                    local-cert/local-id-data = 


# ---- IPsec Proposal (Phase 2 ESP transforms — reusable) -------------------
[emit.ipsec_proposal]
description       = Phase 2 ESP transform (encryption/auth/key-length).
                    Reusable across multiple tunnels. Type 1 = ESP, 2 = AH.
status            = confirmed
input_file        = vpn_policies.json
input_filter      = vpn_type != "tunnel-interface"
xml_parent_xpath  = /profile/ipsec-proposal-list
xml_element_name  = ipsec-proposal
name_attribute    = name
value_maps        = wg_ipsec_encryp_algm, wg_ipsec_auth_algm,
                    wg_ipsec_encryp_keylen, wg_ipsec_protocol_type, wg_time_unit
child_map         = phase2.protocol            = type | wg_ipsec_protocol_type
                    phase2.encryption          = esp-transform/member/encryp-algm | wg_ipsec_encryp_algm
                    phase2.authentication      = esp-transform/member/auth-algm | wg_ipsec_auth_algm
                    phase2.encryption          = esp-transform/member/encryp-key-length | wg_ipsec_encryp_keylen
# Static defaults from real T-30 ipsec-proposal entries.
# <type>1</type> = ESP (default); fallback when source data lacks phase2.protocol.
# (child_map's `phase2.protocol → type` takes precedence when present;
#  static_children's `type` only fires for entries where child_map didn't set it.)
static_children   = property                              = 2
                    type                                  = 1
                    anti-replay-window                    = 0
                    esp-transform/member/time-unit        = 1
                    esp-transform/member/lifetime         = 8
                    esp-transform/member/life-length      = 0
                    esp-transform/member/auth-key-length  = 0


# ---- IPsec Action (Phase 2 SA — links policy + proposal + addresses) ------
[emit.ipsec_action]
description       = Phase 2 SA. Glues ike-policy + ipsec-proposal[] together.
                    Includes vpn-tunnel-sharing block (required) per T-30
                    reference defaults.
status            = confirmed
input_file        = vpn_policies.json
input_filter      = vpn_type != "tunnel-interface"
xml_parent_xpath  = /profile/ipsec-action-list
xml_element_name  = ipsec-action
name_attribute    = name
value_maps        = wg_ike_version, wg_bool_int
child_map         = enable                     = enabled | wg_bool_int
                    phase1.exchange            = version | wg_ike_version
                    phase2.pfs                 = pfs | wg_bool_int
                    phase2.dh_group            = dh-group
                    name                       = ike-policy
                    name                       = ipsec-proposal/member
# Static defaults from real T-30. vpn-tunnel-sharing = use Any-* for everything
# matches the shipped default for an unrestricted tunnel.
#
# NOTE on local-remote-pair-list: removed from this rule 2026-06-03 after
# lab T-30 12.5.9 import error line 3369:
#   "Element 'local-addr': Element content is not allowed, because the
#    type definition is simple."
# Per jpa.xml: inside /ipsec-action-list/ipsec-action/, <local-addr> is a
# LEAF (simpleType) carrying a name-reference to an entry defined elsewhere.
# The structured form (<type>+<value>) lives in /abs-ipsec-action-list/
# instead and is emitted by [emit.abs_ipsec_action]. Two separate paths,
# two separate schemas — our emit was writing the structured form to the
# wrong path.
static_children   = property                                          = 0
                    mode                                              = 1
                    key-mode                                          = 2
                    vpn-tunnel-sharing/use-any-for-service            = 1
                    vpn-tunnel-sharing/use-any-for-address            = 1
                    vpn-tunnel-sharing/use-any-for-local-address      = 1
                    vpn-tunnel-sharing/use-any-for-remote-address     = 1
                    vpn-tunnel-sharing/sharing-across-policy          = 1
                    use-local-remote-pair                             = 0
                    # <local-remote-pair-list>: present in jpa.xml 100% of
                    # ipsec-action instances even when empty. Emitting
                    # an empty placeholder satisfies the "always present"
                    # invariant without containing the structured
                    # children that caused the line 3369 error.
                    local-remote-pair-list                            =
                    dh-group                                      = 14
                    enabled                                       = 1
                    version                                       = 2
                    pfs                                           = 0
                    # NOTE: <ike-policy-group> and <ike-policy> are MUTUALLY
                    # EXCLUSIVE in <ipsec-action>. Per jpa.xml:
                    #   - WG IKEv2 MVPN (mobile-VPN): uses <ike-policy>
                    #   - bovpntunnel.1 (BOVPN site-to-site): uses
                    #     <ike-policy-group> + has NO <version>
                    # SonicWall GroupVPN migrates to the mobile-VPN
                    # (IKEv2 MVPN) pattern, so we emit <ike-policy> only.
                    # Removed <ike-policy-group> 2026-06-03 after lab T-30
                    # 12.5.9 import error line 3368:
                    #   "Element 'ike-policy-group': not expected.
                    #    Expected one of ( pfs, dh-group, ipsec-proposal,
                    #    version, enabled, use-vif )."
                    # which fires because we wrote BOTH discriminators.
                    # use-vif: WG 12.5.9 XSD requires this in <ipsec-action>
                    # even though jpa.xml empty-stub entries don't carry it.
                    # Verified against lab T-30 12.5.9 import error line 3375:
                    #   "Element 'description': not expected. Expected ( use-vif )."
                    # Value 0 = not using BOVPN virtual-interface mode (matches
                    # our group-vpn migration shape). bovpn-vif is a separate
                    # WG feature; if migrating a tunnel-interface SonicWall
                    # VPN, set use-vif=1 (out of scope tonight).
                    use-vif                                       = 0


# ---- Mobile VPN (was group-vpn in SonicWall) -------------------------------
[emit.abs_muvpn]
description       = Mobile VPN with IKEv2 — replaces SonicWall GVC.
                    References its ipsec-action by name. The crypto
                    transforms come from the ike-/ipsec-action above.
                    !! BREAKING !! GVC clients can't connect to a Firebox;
                    end-users install WG IKEv2 client (or OS-native IKEv2).
status            = confirmed
input_file        = vpn_policies.json
input_filter      = vpn_type == "group-vpn"
xml_parent_xpath  = /profile/abs-muvpn-list
xml_element_name  = abs-muvpn
name_attribute    = name
value_maps        = wg_bool_text
child_map         = name                       = ipsec-action
# Static defaults from real T-30 abs-muvpn. tunnel-auth/auth-method=certificate
# is the IKEv2 default. all-traffic-thru-tunnel + 0.0.0.0/0 = full-tunnel VPN.
static_children   = tunnel-auth/auth-method                                  = certificate
                    all-traffic-thru-tunnel                                  = true
                    resource-addr-list/resource-addr/ip-network-addr         = 0.0.0.0/0
                    line-conn-mode                                           = 0
                    line-inactivity-timeout                                  = 0




# ---- NAT (dynamic SNAT) ----------------------------------------------------
[emit.nat_dynamic]
description       = SonicWall NAT policies -> WatchGuard /nat-list/nat. Emits each
                    SonicWall nat-policy as a WG type=3 Dynamic NAT entry. The
                    static_children carry the WG default shape (property=0, type=3
                    Dynamic NAT, algorithm=0, proxy-arp=0). For now we don't translate
                    SonicWall translated-source/translated-destination groups into
                    WG's nat-item/member sub-tree (type=7 SNAT shape) — that needs
                    more real NAT examples to model from. The fallback name_template
                    ({name|comment|uuid}) handles SonicWall's auto-generated NAT
                    policies that have empty name fields.
status            = confirmed
input_file        = nat_policies.json
xml_parent_xpath  = /profile/nat-list
xml_element_name  = nat
name_attribute    = name
value_maps        = wg_bool_text
child_map         = comment                    = description
name_template       = {name|comment|uuid}
static_children       = property             = 0
                    type                 = 3
                    algorithm            = 0
                    proxy-arp            = 0


# ---- DNAT (destination NAT / port-forwarding) ------------------------------
[emit.dnat]
description       = Destination NAT entries -> /dnat-list/dnat.
                    Each entry has from-alias and to-alias references.
                    SonicWall NAT policies that translate destinations
                    typically map here. For now this is a stub that will
                    receive entries when the parser surfaces DNAT-shaped
                    nat_policies (via input_filter on a future field).
status            = partial
input_file        = nat_policies.json
input_filter      = nat_type == "dnat"
xml_parent_xpath  = /profile/dnat-list
xml_element_name  = dnat
child_map         = original_destination       = from-alias
                    translated_destination     = to-alias


# ============================================================================
# ADVISORY ONLY — emits migration notes, no XML
# ============================================================================

[emit.gvc_migration_advisory]
description       = Migration advisory: SonicWall GVC clients cannot connect
                    to a Firebox. Generates migration_notes.md listing every
                    GVC user and recommending WG IKEv2 client adoption.
status            = advisory_only
input_file        = vpn_policies.json
input_filter      = vpn_type == "group-vpn"
# advisory rules render to migration_notes.md, not XML

[emit.abs_ipsec_action]
description = Phase 2 site-to-site VPN wrapper. Ties together the ike-policy
    and ipsec-action by name, plus carries local/remote address pair.
    Reference T-30 has one of these per BOVPN tunnel (bovpntunnel.1).
    For GroupVPN-only inputs, output may overemit; review on real
    BOVPN data when available.
status = partial
input_file = vpn_policies.json
xml_parent_xpath = /profile/abs-ipsec-action-list
xml_element_name = abs-ipsec-action
name_attribute = name
child_map = name              = ike-policy
    name              = ipsec-action
static_children = property                                                   = 0
    allow-all-traffic                                          = 1
    enabled                                                    = 1
    local-remote-pair-list/local-remote-pair/local-addr/type   = Host IP
    local-remote-pair-list/local-remote-pair/local-addr/value  = 0.0.0.0
    local-remote-pair-list/local-remote-pair/direction         = bi-directional
    local-remote-pair-list/local-remote-pair/remote-addr/type  = Host IP
    local-remote-pair-list/local-remote-pair/remote-addr/value = 0.0.0.0
    local-remote-pair-list/local-remote-pair/one-to-one-nat-enabled = false
    local-remote-pair-list/local-remote-pair/dnat-enabled      = false
    local-remote-pair-list/local-remote-pair/dnat-src-ip       = 0.0.0.0
    local-remote-pair-list/local-remote-pair/nat-action        = 

[emit.ike_policy_group]
description = IKE policy-group wrapper. One per VPN, naming the ike-policy
    this group references. Reference T-30 has one (bovpngateway.1)
    mirroring its single ike-policy. Pattern: the group name equals
    the VPN name, and member-list/member/ike-policy points back to
    the matching ike-policy emit.ike_policy produced.
status = partial
input_file = vpn_policies.json
xml_parent_xpath = /profile/ike-policy-group-list
xml_element_name = ike-policy-group
name_attribute = name
child_map = name              = member-list/member/ike-policy
static_children = property                                = 0
    version                                 = 1
    enabled                                 = 1


[validation]
enabled = true
schema_path = ../wg_validator/wg_xml_schema.ini
unknown_element_severity = warning
fail_on = never
references_path = ../wg_validator/wg_xml_references.ini



[emit.portshield_advisory]
description = SonicWall portshield -> WatchGuard Bridge interface advisory.
    Detects interfaces using SonicWall portshield (port-aggregation)
    and writes operator-actionable guidance to migration_notes.md.
    See docs/portshield_to_bridge.md for the full migration playbook.
status = advisory_only
input_file = interfaces.json
input_filter = ip-assignment =~ "portshield"
advisory_preamble = SonicWall portshield bonds multiple physical ports into a single
    logical switch -- they share an IP and act as one L2 broadcast
    domain. WatchGuard equivalent: a Bridge interface (separate
    schema, manual setup required).
    
    **Manual configuration required.** This toolkit does NOT auto-
    generate Bridge interfaces because:
    
    1. The Bridge schema is distinct from physical-if and the toolkit
    has not yet captured a reference example to mirror.
    
    2. Bridge configuration affects topology decisions that need
    operator review.
    
    3. Improperly configured bridges can create L2 loops on the
    network, which warrants human verification.
    
    See **docs/portshield_to_bridge.md** for the full operator
    playbook (6-step migration procedure with verification steps).
    
    **Detected portshield member interfaces:**
advisory_template = - `{id}` -> ip-assignment: `{ip-assignment}`
