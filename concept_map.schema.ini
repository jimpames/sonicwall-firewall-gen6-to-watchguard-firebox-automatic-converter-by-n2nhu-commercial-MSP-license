# ============================================================================
# concept_map.schema.ini
#
# Schema describing the structure of concept_map.ini. The validator uses this
# at engine load time to catch typos and missing fields. The GUI uses it to
# render type-aware editing widgets.
#
# Documented dialect: docs/schema_format.md
# ============================================================================

[meta]
config_name = concept_map.ini
description = Vendor-neutral concept map — the durable Rosetta Stone.
version     = 1.0


# ============================================================================
# [meta] section in concept_map.ini
# ============================================================================
[section.meta]
description = Header info about the concept map itself.
required    = true
fields      = name, version, description, contributors

[section.meta.field.name]
type     = string
required = true
help     = Human-readable name for this concept map.

[section.meta.field.version]
type     = string
required = true
default  = 1.0.0
help     = Semantic version. Bump on breaking changes.

[section.meta.field.description]
type     = multiline_string
help     = Free-text description shown in operator-facing tooling.

[section.meta.field.contributors]
type     = string
help     = Comma-separated names of people who maintain this map.


# ============================================================================
# [concept.X] sections — repeated, one per vendor-neutral concept
# ============================================================================
[section_pattern.concept]
match_pattern = ^concept\.[\w_-]+$
description   = Vendor-neutral concept definition. Each declares how the
                concept is named in SonicWall, in WatchGuard, and (over
                time) in other vendors. The durable artifact.
fields        = description, canonical_term, sonicwall, watchguard,
                swap_warning, severity, note

[section_pattern.concept.field.description]
type     = multiline_string
required = true
help     = What this concept is in plain English.

[section_pattern.concept.field.canonical_term]
type     = string
required = true
help     = Vendor-neutral name for this concept; how engines refer to it.

[section_pattern.concept.field.sonicwall]
type     = multiline_string
help     = What SonicWall calls this concept. May span multiple lines for
           cases where translation is contextual (e.g. an enumeration of
           variants).

[section_pattern.concept.field.watchguard]
type     = multiline_string
help     = What WatchGuard calls this concept. May span multiple lines.

[section_pattern.concept.field.swap_warning]
type        = enum
enum_values = none, vocabulary_swap, lossy_translation, semantic_drift,
              no_equivalent
default     = none
help        = Type of translation hazard, if any. 'no_equivalent' means the
              SonicWall concept has no direct WatchGuard counterpart.

[section_pattern.concept.field.severity]
type        = enum
enum_values = informational, info, advisory, warning, breaking
default     = informational
help        = How loudly to surface this concept's translation caveats.

[section_pattern.concept.field.note]
type     = multiline_string
help     = Free-form note about translation traps and how the toolkit handles them.


# ============================================================================
# [zones] — singleton zone-name translation
# ============================================================================
[section.zones]
description = SonicWall-zone-name to canonical and to-WatchGuard translation.
required    = false
fields      = description, sonicwall_to_canonical, canonical_to_watchguard

[section.zones.field.description]
type = multiline_string
help = Documentation about the zone-translation strategy.

[section.zones.field.sonicwall_to_canonical]
type = kv_list
help = Comma-separated 'sonicwall_zone=canonical_zone' pairs.

[section.zones.field.canonical_to_watchguard]
type = kv_list
help = Comma-separated 'canonical_zone=watchguard_zone' pairs.


# ============================================================================
# [value_map.X] sections — repeated, one per value translation table
# ============================================================================
[section_pattern.value_map]
match_pattern = ^value_map\.[\w_-]+$
description   = One value-translation table per section. Used by emit rules
                that reference the section's name in their value_maps directive.
fields        = description, sonicwall_to_canonical, canonical_to_watchguard

[section_pattern.value_map.field.description]
type = multiline_string
help = What this value map translates and why.

[section_pattern.value_map.field.sonicwall_to_canonical]
type = kv_list
help = SonicWall raw-value to canonical-name translation.

[section_pattern.value_map.field.canonical_to_watchguard]
type     = kv_list
required = true
help     = Canonical-name to WatchGuard XML-value translation.


# ============================================================================
# [crypto_audit.X] sections — repeated, one per audit dimension.
# These have a `description` PLUS arbitrary algorithm=severity pairs.
# We declare the description field and use dynamic_keys for the rest.
# ============================================================================
[section_pattern.crypto_audit]
match_pattern      = ^crypto_audit\.[\w_-]+$
description        = Crypto-strength audit table. Algorithm-name keys map to
                     severity values used by the enricher's audit pass.
fields             = description
dynamic_keys       = true
dynamic_value_type = string
dynamic_keys_help  = Each key is an algorithm/parameter name; each value is
                     a severity word (ok, strong, acceptable, weak,
                     deprecated, critical) or a numeric threshold.

[section_pattern.crypto_audit.field.description]
type = multiline_string
help = What aspect of crypto this table audits.


# ============================================================================
# [crypto_upgrade_recommendation] — singleton with dynamic key=value pairs.
# Keys look like 'encryption.des', values are recommended replacements.
# ============================================================================
[section.crypto_upgrade_recommendation]
description        = Per-finding upgrade recommendation. Keyed as
                     '<class>.<algorithm>' (e.g. encryption.des).
required           = false
fields             = description
dynamic_keys       = true
dynamic_value_type = string
dynamic_keys_help  = Each key is '<audit_class>.<algorithm>'; each value is
                     the recommended canonical name to replace it with.

[section.crypto_upgrade_recommendation.field.description]
type = multiline_string
help = Documentation of the upgrade strategy.


# ============================================================================
# [terminology] — vocabulary swap warnings (informational; for operators)
# ============================================================================
[section.terminology]
description        = Vendor-vocabulary swap warnings.
required           = false
fields             = description
dynamic_keys       = true
dynamic_value_type = multiline_string
dynamic_keys_help  = Each key documents a specific terminology trap; each value
                     is free-form prose describing the trap.

[section.terminology.field.description]
type = multiline_string
help = Top-level documentation of the vocabulary-swap traps.
