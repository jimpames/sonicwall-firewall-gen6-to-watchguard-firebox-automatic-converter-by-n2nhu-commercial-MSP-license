# ============================================================================
# concept_map.ini  —  The Rosetta Stone.
#
# This is the durable artifact of the migration project. It encodes how
# firewall concepts are named across vendors. Tools come and go; vendor
# versions change; CLI grammars get rewritten. This file outlives all that.
#
# Each [concept.X] entry says: "the vendor-neutral concept X is called
# <sonicwall> in SonicWall and <watchguard> in WatchGuard."
#
# When you add a new vendor (Cisco, Fortinet, Palo Alto), add a new field
# alongside `sonicwall` and `watchguard`. The translator engines look up
# the relevant column at runtime; nothing in code knows vendor names.
#
# Algebraic-design model:
#       Concept × Vendor = Term
#
# This is exactly the Object × Verb = Action pattern from the book, applied
# to a different domain.
# 
#   (C) Copyright 2026, jim ames. all rights reserved. 
#   reverse engineering my system is prohibited.
#   license: closed source, commercial use license required.
#   no hobby or one-off use- MSP only
#
#   contact: jimpames@gmail.com for licensing
#
#   $10,000 per MSP one-time
# 
#  need something else other than sonicwall to watchguard?
#  translate most anything to sonicwall with THEIR universal translator
#  then use FESv11 algebraic to translate THAT to watchguard... 
# 
# 
# ============================================================================

[meta]
name        = SonicWall <-> WatchGuard concept map
version     = 1.0.0
contributors = J P Ames, Claude
description = Vendor-neutral firewall concept dictionary. Open for extension.


# ============================================================================
# ADDRESS / NETWORK CONCEPTS
# ============================================================================

[concept.concrete_address]
description     = A concrete network primitive — a host IP, a network/mask,
                  or an IP range. Has a literal value, no references.
canonical_term  = concrete_address
sonicwall       = address-object
watchguard      = address-group
swap_warning    = vocabulary_swap
severity        = breaking
note            = !! VOCABULARY SWAP !! WatchGuard calls the CONCRETE primitive
                  'address-group'. SonicWall reserves 'address-group' for the
                  COLLECTION/reference type. This swap will silently produce
                  wrong output if not consciously translated. See watchparse.py
                  XPath /address-group-list/address-group — its members are
                  host-ip-addr, ip-network-addr, start/end-ip-addr (concrete!).

[concept.address_collection]
description     = A named collection of references to other addresses (and/or
                  other collections). Recursive. The thing policies reference.
canonical_term  = address_collection
sonicwall       = address-group
watchguard      = alias
swap_warning    = vocabulary_swap
severity        = breaking
note            = The other half of the vocabulary swap. WatchGuard's 'alias'
                  is what SonicWall calls 'address-group'. It contains
                  references to other aliases or to address-groups (concrete).

[concept.implicit_interface_subnet]
description     = An auto-generated address object referring to "the subnet
                  on interface X" (e.g. "X0 Subnet"). SonicWall creates these
                  silently from the interface table; they do NOT appear in
                  the config but ARE referenced by VPN policies.
canonical_term  = implicit_interface_subnet
sonicwall       = "<id> Subnet"
watchguard      = (resolved to network IP at translation time)
swap_warning    = lossy_translation
severity        = warning
note            = Phase 1.5 must synthesize these from interfaces.json before
                  any policy/VPN translation can resolve its references.
                  Without resolver, ~60-80% of real site-to-site VPNs break.

[concept.implicit_interface_ip]
description     = Auto-generated address object for "the IP address of
                  interface X" (e.g. "X0 IP", "WAN Interface IP").
canonical_term  = implicit_interface_ip
sonicwall       = "<id> IP"
watchguard      = (resolved to host IP at translation time)
swap_warning    = lossy_translation
severity        = warning

[concept.universal_any]
description     = The match-everything address.
canonical_term  = any
sonicwall       = "Any"
watchguard      = Any-External / Any-Trusted / Any-Optional / "Any"
swap_warning    = semantic_drift
severity        = advisory
note            = WatchGuard splits 'Any' by zone. SonicWall's bare 'Any'
                  must be resolved to the right zone-scoped Any in WatchGuard
                  using the access-rule's from-zone/to-zone fields.


# ============================================================================
# SERVICE CONCEPTS
# ============================================================================

[concept.service_primitive]
description     = A single protocol/port definition.
canonical_term  = service
sonicwall       = service-object
watchguard      = service
note            = Both vendors have built-in service catalogs; we'll need a
                  built-in service mapping table (Phase 2 work).

[concept.service_collection]
description     = A named bundle of services.
canonical_term  = service_collection
sonicwall       = service-group
watchguard      = service-group
note            = Same name in both vendors — for once.

[concept.protocol_id]
description     = Identifies a protocol within a service definition.
canonical_term  = protocol
sonicwall       = name (e.g. "TCP", "UDP", "ICMP", "ESP")
watchguard      = IANA number (e.g. 6, 17, 1, 50)
swap_warning    = lossy_translation
severity        = warning
note            = Translator must apply value_map.protocol_id during emit.
                  SonicWall's "ICMP" + named-type ("echo-reply") needs special
                  handling; WatchGuard uses ICMP type/code numbers.


# ============================================================================
# POLICY CONCEPTS
# ============================================================================

[concept.firewall_rule]
description     = A zone-to-zone packet-filtering rule.
canonical_term  = firewall_rule
sonicwall       = access-rule
watchguard      = abs-policy
note            = WatchGuard XPath: /abs-policy-list/abs-policy.
                  Both have from/to (zones/aliases), action, service, schedule,
                  log, NAT reference.

[concept.rule_action_allow]
description     = "Allow this traffic."
canonical_term  = allow
sonicwall       = allow
watchguard      = allow
note            = WatchGuard stores in <firewall>allow</firewall>.

[concept.rule_action_deny]
description     = "Drop this traffic." (silent)
canonical_term  = deny
sonicwall       = deny
watchguard      = deny

[concept.rule_action_discard]
description     = "Drop and reject" (with ICMP/TCP reply).
canonical_term  = discard
sonicwall       = discard
watchguard      = (controlled via reject-action element)
swap_warning    = semantic_drift
note            = WatchGuard splits this into deny + reject-action attribute.


# ============================================================================
# NAT CONCEPTS
# ============================================================================

[concept.nat_policy]
description     = Source/destination/static NAT rule.
canonical_term  = nat_policy
sonicwall       = nat-policy
watchguard      = (referenced from abs-policy via policy-nat element;
                   standalone NAT structure TBD from T-30 export)
swap_warning    = lossy_translation
severity        = warning
note            = TODO: confirm WG XML structure for SNAT/1-to-1-NAT from
                  T-30 export. watchparse.py captures the policy-nat reference
                  on policies but not the standalone NAT rule shape.


# ============================================================================
# IKE / IPSEC CONCEPTS
# ============================================================================

[concept.vpn_site_to_site]
description     = Static-IP, gateway-to-gateway IPsec tunnel.
canonical_term  = bovpn_site_to_site
sonicwall       = vpn policy site-to-site
watchguard      = bovpn-gateway + bovpn-tunnel (PAIR)
swap_warning    = semantic_drift
severity        = info
note            = SonicWall: ONE policy object per tunnel.
                  WatchGuard: TWO objects (Phase 1 gateway + Phase 2 tunnel)
                  per logical tunnel. The translator emits both from one input.

[concept.vpn_route_based]
description     = Route-based IPsec tunnel using a virtual interface.
canonical_term  = bovpn_vif
sonicwall       = vpn policy tunnel-interface
watchguard      = bovpn-vif
note            = Both vendors support this.

[concept.vpn_client_to_site]
description     = Mobile users connecting to the firewall over IPsec.
canonical_term  = mobile_vpn_ipsec
sonicwall       = vpn policy group-vpn (with SonicWall GVC client)
watchguard      = Mobile VPN with IKEv2 (preferred) OR
                  Mobile VPN with IPSec (legacy IKEv1)
swap_warning    = no_equivalent
severity        = breaking
note            = SonicWall GVC is a proprietary IKEv1+XAUTH+SonicWall-extensions
                  client. WatchGuard does not speak it. Server-side proposals
                  translate; client-side must be replaced with WG IKEv2 client
                  (native to Windows/macOS/iOS/Android). Emit advisory.

[concept.ike_phase1_proposal]
description     = IKE Phase 1 (SA negotiation) crypto proposal.
canonical_term  = phase1
sonicwall       = proposal ike <attr> <value>   (lines in vpn policy)
watchguard      = phase1-settings element       (in bovpn-gateway)
note            = SonicWall expresses as flat lines. Phase 1.5 enrichment
                  pivots into a phase1{} dict. Translator emits as XML element.

[concept.ike_phase2_proposal]
description     = IPsec Phase 2 (data SA) crypto proposal.
canonical_term  = phase2
sonicwall       = proposal ipsec <attr> <value>
watchguard      = phase2-settings / transform-list (in bovpn-tunnel)

[concept.psk_credential]
description     = Pre-shared key authentication.
canonical_term  = psk
sonicwall       = auth-method shared-secret + shared-secret "..."
watchguard      = credential-method/pre-shared-key
swap_warning    = lossy_translation
severity        = warning
note            = SonicWall stores PSK as "4,<hex>" reversible cipher.
                  We do NOT decrypt. Sidecar secrets.ini holds cleartext;
                  operator fills it during migration review.


# ============================================================================
# INTERFACE / ZONE CONCEPTS
# ============================================================================

[concept.physical_interface]
description     = A physical or virtual network interface.
canonical_term  = interface
sonicwall       = interface
watchguard      = interface
note            = Same name; different child structure. WG XPath:
                  /interface-list/interface/if-item-list/.../if-dev-name.

[concept.security_zone]
description     = A trust grouping for interfaces.
canonical_term  = zone
sonicwall       = zone (LAN/WAN/DMZ/VPN/SSLVPN/WLAN/MULTICAST)
watchguard      = (implicit via interface aliases:
                   Trusted/External/Optional/Custom)
swap_warning    = semantic_drift
severity        = advisory
note            = WatchGuard does NOT have an explicit zone object. Zones are
                  implicit in interface naming/aliases. Translator must map:
                    LAN -> Trusted, WAN -> External, DMZ -> Optional-1,
                    WLAN -> Optional-2, VPN -> handled by BOVPN itself.


# ============================================================================
# OTHER CONCEPTS
# ============================================================================

[concept.static_route]
description     = A manually-configured route.
canonical_term  = static_route
sonicwall       = route-policy
watchguard      = route-entry
note            = WG XPath: /system-parameters/route/route-entry.

[concept.schedule]
description     = A named time window for use by policies.
canonical_term  = schedule
sonicwall       = schedule (recurring/once)
watchguard      = schedule
note            = Confirm WG XML structure from T-30 export.


# ============================================================================
# VALUE MAPS — literal value translation
# ============================================================================

# ----------------------------------------------------------------------------
# WatchGuard's IKE and IPsec enums use DIFFERENT numbers for the same
# algorithm. Cracked from a real T-30 configuration.xml export by reading the
# named ipsec-proposals (e.g. "ESP-AES256-SHA256" -> encryp-algm=12, auth-algm=5).
# ----------------------------------------------------------------------------

[value_map.wg_schedule_type_num]
description = WatchGuard schedule type field — 0=always-on, 2=recurring.
              Cracked from real T-30 export.
canonical_to_watchguard = always_on=0, recurring=2

[value_map.wg_ipsec_encryp_algm]
description = WatchGuard ESP encryp-algm enum (Phase 2 / IPsec).
              Cracked from named ipsec-proposals in T-30 export.
              Use encryp-key-length to disambiguate AES variants:
                AES-CBC: 16=128, 24=192, 32=256
                AES-GCM: same
sonicwall_to_canonical  = des=des, triple-des=3des, aes-128=aes128,
                          aes-192=aes192, aes-256=aes256,
                          aes-128-gcm=aes128gcm, aes-192-gcm=aes192gcm,
                          aes-256-gcm=aes256gcm
canonical_to_watchguard = des=2, 3des=3, aes128=12, aes192=12, aes256=12,
                          aes128gcm=20, aes192gcm=20, aes256gcm=20

[value_map.wg_ipsec_encryp_keylen]
description = Bytes (not bits!) for encryp-key-length when encryp-algm needs
              a key length to disambiguate. AES-CBC and AES-GCM both use these.
sonicwall_to_canonical  = des=des, triple-des=3des, aes-128=aes128,
                          aes-192=aes192, aes-256=aes256,
                          aes-128-gcm=aes128gcm, aes-192-gcm=aes192gcm,
                          aes-256-gcm=aes256gcm
canonical_to_watchguard = des=0, 3des=0, aes128=16, aes192=24, aes256=32,
                          aes128gcm=16, aes192gcm=24, aes256gcm=32

[value_map.wg_ipsec_auth_algm]
description = WatchGuard ESP auth-algm enum (Phase 2). 0 means "no auth"
              which is correct for AEAD ciphers like AES-GCM.
sonicwall_to_canonical  = sha-1=sha1, sha1=sha1, sha-256=sha2_256,
                          sha256=sha2_256, sha-384=sha2_384, sha384=sha2_384,
                          sha-512=sha2_512, sha512=sha2_512, md5=md5, none=none
canonical_to_watchguard = none=0, md5=1, sha1=2, sha2_256=5,
                          sha2_384=6, sha2_512=7

[value_map.wg_ike_encryp_algm]
description = WatchGuard IKE encryp-algm enum (Phase 1).
              DIFFERENT from the IPsec/ESP enum above.
              Cracked from ike-actions: "ike2_shared_action" uses 7 for AES.
sonicwall_to_canonical  = des=des, triple-des=3des, aes-128=aes128,
                          aes-192=aes192, aes-256=aes256
canonical_to_watchguard = des=1, 3des=5, aes128=7, aes192=7, aes256=7

[value_map.wg_ike_encryp_keylen]
description = IKE encryp-key-len in BYTES. Same convention as IPsec.
sonicwall_to_canonical  = des=des, triple-des=3des, aes-128=aes128,
                          aes-192=aes192, aes-256=aes256
canonical_to_watchguard = des=0, 3des=0, aes128=16, aes192=24, aes256=32

[value_map.wg_ike_auth_algm]
description = WatchGuard IKE auth-algm enum (Phase 1).
              DIFFERENT from the IPsec auth-algm enum.
              Observed in ike-actions: 4 paired with strong (DH14), 2 paired
              with weaker (DH2/DH5). Best inference: 2=SHA1, 4=SHA2-256.
              Recommend confirmation against a hand-built IKE policy with
              MD5/SHA1/SHA2-256/SHA2-384/SHA2-512 each.
sonicwall_to_canonical  = sha-1=sha1, sha1=sha1, sha-256=sha2_256,
                          sha256=sha2_256, sha-384=sha2_384, sha384=sha2_384,
                          sha-512=sha2_512, sha512=sha2_512, md5=md5
canonical_to_watchguard = md5=1, sha1=2, sha2_256=4, sha2_384=5, sha2_512=6

[value_map.wg_ike_prf_algm]
description = IKE PRF (pseudo-random function) algorithm. Usually mirrors
              the auth-algm choice. Observed: prf=5 with auth=4 (SHA2-256),
              prf=2 with auth=2 (SHA1).
sonicwall_to_canonical  = sha-1=sha1, sha1=sha1, sha-256=sha2_256,
                          sha256=sha2_256, sha-384=sha2_384, sha384=sha2_384,
                          sha-512=sha2_512, sha512=sha2_512, md5=md5
canonical_to_watchguard = md5=1, sha1=2, sha2_256=5, sha2_384=6, sha2_512=7

[value_map.wg_ike_version]
description = IKE protocol version.
sonicwall_to_canonical  = ikev1=ikev1, main=ikev1, aggressive=ikev1, ikev2=ikev2
canonical_to_watchguard = ikev1=1, ikev2=2

[value_map.wg_ipsec_protocol_type]
description = IPsec proposal type (ESP vs AH).
sonicwall_to_canonical  = esp=esp, ah=ah
canonical_to_watchguard = esp=1, ah=2

[value_map.wg_time_unit]
description = WatchGuard SA-lifetime time unit.
              Observed: time-unit=1 paired with lifetime=8 or 24 (hours).
canonical_to_watchguard = seconds=0, hours=1, kilobytes=2

[value_map.wg_firewall_action]
description = abs-policy/firewall action — note the capitalization!
              WatchGuard uses 'Allow' (capital A), 'Denied', 'No Op'.
sonicwall_to_canonical  = allow=allow, deny=deny, discard=deny, drop=deny
canonical_to_watchguard = allow=Allow, deny=Denied, discard=Denied, drop=Denied

[value_map.wg_bool_text]
description = Boolean fields in WG XML are 'true'/'false' (lowercase text),
              NOT 1/0 and NOT 'True'/'False'. Use for proxy-action subtrees,
              abs-policy, dlp-sensor, and other contexts where jpa.xml shows
              true/false values.
sonicwall_to_canonical  = true=true, false=false, True=true, False=false,
                          1=true, 0=false
canonical_to_watchguard = true=true, false=false

[value_map.wg_bool_int]
description = NUMERIC boolean (0/1) for WG XML contexts where the XSD
              atomic type is Enable-Type (xs:unsignedByte) or similar.
              Per jpa.xml empirical audit, these paths require numeric:
                /ipsec-action-list/ipsec-action/enabled
                /ipsec-action-list/ipsec-action/pfs
                /abs-ipsec-action-list/abs-ipsec-action/enabled
                /ike-policy-list/ike-policy/enabled
                /ike-policy-group-list/ike-policy-group/enabled
                /interface-list/.../physical-if/enabled
                /system-parameters/*/enabled (most)
              Verified against lab T-30 12.5.9 import error line 3420:
                "Element 'enabled': 'true' is not a valid value of the
                 atomic type 'Enable-Type'."
sonicwall_to_canonical  = true=1, false=0, True=1, False=0,
                          1=1, 0=0, yes=1, no=0
canonical_to_watchguard = 1=1, 0=0

[value_map.protocol_id]
description = Map between protocol names (SonicWall) and IANA numbers (WatchGuard).
    Extended 2026-06-03 after lab T-30 import error line 1906:
    "Element 'protocol': 'IPCOMP' is not a valid value of the atomic
    type 'xs:unsignedShort'." Source: IANA Protocol Numbers registry.
sonicwall_to_canonical    = TCP=tcp, UDP=udp, ICMP=icmp,
                            ICMPv6=icmpv6, ICMPV6=icmpv6,
                            ESP=esp, AH=ah, GRE=gre, IGMP=igmp,
                            HOPOPT=hopopt, OSPFIGP=ospf, OSPF=ospf,
                            EIGRP=eigrp, PIM=pim,
                            IPCOMP=ipcomp, IPCOMPRESS=ipcomp,
                            6OVER4=6over4, 6IN4=6in4,
                            L2TP=l2tp, SCTP=sctp,
                            RSVP=rsvp, IPENCAP=ipencap, IPIP=ipencap
canonical_to_watchguard   = tcp=6, udp=17, icmp=1, icmpv6=58,
                            esp=50, ah=51, gre=47, igmp=2,
                            hopopt=0, ospf=89, eigrp=88, pim=103,
                            ipcomp=108, 6over4=41, 6in4=41,
                            l2tp=115, sctp=132, rsvp=46, ipencap=4

[value_map.ike_encryption]
description = IKE/IPsec encryption algorithm names.
sonicwall_to_canonical    = des=des, triple-des=3des, aes-128=aes128,
                            aes-192=aes192, aes-256=aes256,
                            aes-128-gcm=aes128gcm, aes-256-gcm=aes256gcm
canonical_to_watchguard   = des=DES, 3des=3DES, aes128=AES-CBC-128,
                            aes192=AES-CBC-192, aes256=AES-CBC-256,
                            aes128gcm=AES-GCM-128, aes256gcm=AES-GCM-256

[value_map.ike_hash]
description = IKE/IPsec authentication hash algorithm names.
sonicwall_to_canonical    = md5=md5, sha-1=sha1, sha1=sha1,
                            sha256=sha2_256, sha-256=sha2_256,
                            sha384=sha2_384, sha-384=sha2_384,
                            sha512=sha2_512, sha-512=sha2_512
canonical_to_watchguard   = md5=MD5, sha1=SHA1,
                            sha2_256=SHA2-256, sha2_384=SHA2-384,
                            sha2_512=SHA2-512

[value_map.dh_group]
description = Diffie-Hellman group identifiers.
sonicwall_to_canonical    = 1=1, 2=2, 5=5, 14=14, 15=15,
                            19=19, 20=20, 21=21, 24=24
canonical_to_watchguard   = 1=Diffie-Hellman-Group-1, 2=Diffie-Hellman-Group-2,
                            5=Diffie-Hellman-Group-5, 14=Diffie-Hellman-Group-14,
                            15=Diffie-Hellman-Group-15,
                            19=Diffie-Hellman-Group-19, 20=Diffie-Hellman-Group-20,
                            21=Diffie-Hellman-Group-21, 24=Diffie-Hellman-Group-24

[value_map.zone]
description = Zone-to-WatchGuard-alias mapping (defaults; operator may override).
sonicwall_to_canonical    = LAN=trusted, WAN=external, DMZ=optional1,
                            WLAN=optional2, VPN=vpn_internal, SSLVPN=ssl_vpn,
                            MULTICAST=multicast
canonical_to_watchguard   = trusted=Trusted, external=External,
                            optional1=Optional-1, optional2=Optional-2,
                            vpn_internal=BOVPN, ssl_vpn=SSLVPN-Users,
                            multicast=Multicast


# ============================================================================
# CRYPTO AUDIT TABLE — used by Phase 1.5 enrichment
# ============================================================================

[crypto_audit.encryption]
description = Severity classification of IKE/IPsec encryption algorithms.
des       = deprecated  ; broken
3des      = deprecated  ; sunset 2023 NIST; Sweet32 vulnerability
aes128    = strong
aes192    = strong
aes256    = strong
aes128gcm = strong
aes256gcm = strong       ; preferred (AEAD)
null      = breaking     ; null encryption — never acceptable

[crypto_audit.hash]
description = Severity of authentication hash algorithms.
md5       = deprecated  ; collision-broken
sha1      = deprecated  ; collision-broken (SHAttered, 2017)
sha2_256  = strong
sha2_384  = strong
sha2_512  = strong

[crypto_audit.dh_group]
description = Severity of Diffie-Hellman groups.
1   = deprecated  ; 768-bit, broken
2   = deprecated  ; 1024-bit MODP, weakened by Logjam
5   = weak        ; 1536-bit, marginal
14  = acceptable  ; 2048-bit MODP, current minimum
15  = acceptable  ; 3072-bit MODP
19  = strong      ; 256-bit ECP
20  = strong      ; 384-bit ECP
21  = strong      ; 521-bit ECP
24  = acceptable  ; 2048-bit MODP w/ 256-bit subgroup

[crypto_audit.lifetime]
description = Maximum acceptable SA lifetimes (seconds).
ike_max_seconds   = 86400   ; 24 hours
ipsec_max_seconds = 28800   ; 8 hours

[crypto_audit.pfs]
description = Whether Perfect Forward Secrecy is required.
required = true

[crypto_upgrade_recommendation]
description = Default upgrade path for any deprecated finding.
encryption.des       = aes256gcm
encryption.3des      = aes256gcm
hash.md5             = sha2_256
hash.sha1            = sha2_256
dh_group.1           = 14
dh_group.2           = 14
dh_group.5           = 14
pfs.disabled         = enable_with_dh_group_14

[value_map.wg_canonical_service]
description = Canonicalize SonicWall lowercase service references to the
    WatchGuard built-in form. SonicWall CLI emits "any" but WG
    expects "Any" (capital). Identity rules are intentionally
    omitted — fields containing actual service names (e.g.
    "HTTP", "Apple Bonjour") pass through unchanged.
sonicwall_to_canonical = any=any
canonical_to_watchguard = any=Any

[value_map.wg_canonical_schedule]
description = Canonicalize SonicWall lowercase schedule references to the
    WatchGuard built-in form. SonicWall CLI emits "always-on"
    (lowercase, hyphen) but WG expects "Always On" (canonical
    form, capital A, capital O, space).
sonicwall_to_canonical = always-on=always-on
canonical_to_watchguard = always-on=Always On

[value_map.sw_zone_to_wg_iface_name]
description = SonicWall zone name -> WG canonical interface name.
    SonicWall: X0 typically=LAN, X1=WAN, others=DMZ/etc.
    WG: physical interfaces named by zone-role (External=eth0,
    Trusted=eth1, Optional-1=eth2, Optional-2=eth3, ...).
    Mapping by SonicWall security-type semantics: trusted->Trusted,
    untrusted->External, public->Optional-1, encrypted->Optional-2.
sonicwall_to_canonical = LAN=LAN, WAN=WAN, DMZ=DMZ, VPN=VPN, WLAN=WLAN, MULTICAST=MULTICAST, SSLVPN=SSLVPN
canonical_to_watchguard = LAN=Trusted, WAN=External, DMZ=Optional-1, VPN=Optional-2,
    WLAN=Optional-3, MULTICAST=Optional-4, SSLVPN=Optional-5
