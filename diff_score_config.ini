# ============================================================================
# diff_score_config.ini  —  Vector-math diff scorer for measuring how close
# our emitted WatchGuard XML is to a real exported reference.
#
# Concept: the migration's "completeness" is not one number but a vector of
# scores along several dimensions. The aggregate is just one summary; the
# per-dimension breakdown shows where the gaps actually are.
#
# Design follows the same algebraic-design pattern as the rest of the toolkit:
#   Document × Dimension = Score
# Dimensions live in this INI; the engine knows nothing about WatchGuard.
# ============================================================================

[meta]
name        = WatchGuard XML diff scorer
version     = 1.0.0
description = Multi-dimensional structural similarity score for evaluating
              migration completeness against a reference Firebox export.

[io]
# These can also be overridden via command-line args
reference_xml = ../docs/reference_exports/T30jpa1__1_.xml
candidate_xml = ../xml_emitter/dry_run/configuration.xml
output_report = ./diff_report.json
output_summary = ./diff_summary.txt


# ============================================================================
# DIMENSIONS — each scored 0.0..1.0, weighted into the aggregate.
# Each dimension has a `kind` that selects the scoring engine.
# ============================================================================


# ---- Dimension 1: Structural similarity ------------------------------------
# Compares the SET of XPaths present in each document. A perfect score means
# every element type the reference uses, the candidate also uses (and vice
# versa). Doesn't care about counts or values — just "does this kind of
# element exist."
[dimension.structural]
description = Set similarity of element XPaths. Catches "missing entire
              section types" gaps. Computed as Jaccard similarity over
              the set of unique XPaths (depth-limited).
kind        = xpath_set_jaccard
weight      = 0.25
xpath_depth = 3
# Optional: ignore xpath prefixes that we don't expect to migrate yet
ignore_xpath_prefixes = /profile/proxy-action-list/, /profile/alarm-action-list/,
                        /profile/dlp-sensor-list/, /profile/signature-update/


# ---- Dimension 2: Element-count similarity --------------------------------
# Compares how many of each element-type exist. Catches "we have abs-policies
# but only 12 of 15." Computed per-XPath as min/max ratio, then averaged.
[dimension.element_counts]
description = For each element XPath present in both docs, score = min(a,b)/max(a,b).
              Averaged across all common XPaths. Catches under/over emission.
kind        = xpath_count_ratio
weight      = 0.30
xpath_depth = 2
# XPaths to skip (legitimately empty in our migration; not a defect)
exclude_xpaths = /profile/revision-history,
                 /profile/dnat-list,
                 /profile/nat-list,
                 /profile/radius-conf-list,
                 /profile/ras-user-group-list,
                 /profile/gateway-wireless-controller


# ---- Dimension 3: Field-completeness --------------------------------------
# For each top-level list, looks at the union of CHILD field names used in
# each instance. Score = (fields_in_candidate ∩ fields_in_reference) /
#                        (fields_in_reference). Catches "we emit abs-policy
# but only 5 of the 25 expected fields."
[dimension.field_completeness]
description = Per element type, ratio of expected child fields populated.
              Catches thin element emissions (right tag, missing fields).
kind        = field_overlap
weight      = 0.20
# Sample at most N instances of each element type for the field union
sample_size = 5


# ---- Dimension 4: Cross-reference integrity -------------------------------
# Walks all <alias>X</alias>, <service>X</service>, <ike-policy>X</ike-policy>
# style references and checks whether the named target exists in the
# referenced list. A perfect score = 100% references resolve.
[dimension.cross_reference]
description = Fraction of named references that resolve to existing entries.
              Catches dangling references that would cause Firebox import
              to fail validation.
kind        = reference_resolution
weight      = 0.20
# Reference patterns: (xpath_to_reference, list_to_search_in, name_field)
reference_rules = abs_policy_from_alias, abs_policy_to_alias,
                  abs_policy_policy_ref, ipsec_action_ike_policy,
                  ipsec_action_proposal, abs_muvpn_ipsec_action

[reference_rule.abs_policy_from_alias]
ref_xpath = .//abs-policy/from-alias-list/alias
target_xpath = ./alias-list/alias/name

[reference_rule.abs_policy_to_alias]
ref_xpath = .//abs-policy/to-alias-list/alias
target_xpath = ./alias-list/alias/name

[reference_rule.abs_policy_policy_ref]
ref_xpath = .//abs-policy/policy-list/policy
target_xpath = ./policy-list/policy/name

[reference_rule.ipsec_action_ike_policy]
ref_xpath = .//ipsec-action/ike-policy
target_xpath = ./ike-policy-list/ike-policy/name

[reference_rule.ipsec_action_proposal]
ref_xpath = .//ipsec-action/ipsec-proposal/member
target_xpath = ./ipsec-proposal-list/ipsec-proposal/name

[reference_rule.abs_muvpn_ipsec_action]
ref_xpath = .//abs-muvpn/ipsec-action
target_xpath = ./ipsec-action-list/ipsec-action/name


# ---- Dimension 5: Value-distribution similarity ---------------------------
# Compares the SHAPE of values, not specific identities. For each list,
# what is the distribution of the field values? This catches "we have
# 11 ESP-* proposals" matching "real has 11 ESP-* proposals" even if
# the user-added proposals differ.
[dimension.value_distribution]
description = For specific high-signal fields, compare the distribution of
              values via histogram cosine similarity.
kind        = value_histogram
weight      = 0.05
# (xpath_to_field, comparison_kind)
fields = ike_action_encryp, ipsec_proposal_encryp, abs_policy_action

[value_field.ike_action_encryp]
xpath = .//ike-action/ike-transform/member/encryp-algm

[value_field.ipsec_proposal_encryp]
xpath = .//ipsec-proposal/esp-transform/member/encryp-algm

[value_field.abs_policy_action]
xpath = .//abs-policy/firewall


# ============================================================================
# OUTPUT
# ============================================================================
[report]
# Verbosity of the JSON output report
include_xpath_details = true
include_per_field_breakdown = true
include_unresolved_refs_sample = 10
