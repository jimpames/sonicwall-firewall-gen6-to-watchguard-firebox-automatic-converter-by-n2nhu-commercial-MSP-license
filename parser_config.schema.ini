# ============================================================================
# parser_config.schema.ini
#
# Schema describing the structure of parser_config.ini. The validator uses
# this at engine load time to catch typos and missing fields. The GUI uses
# it to render type-aware editing widgets.
#
# Documented dialect: ../docs/schema_format.md
#
# parser_config.ini drives Phase 1 — converting raw SonicOS exports into
# canonical JSON, one file per logical section. Each [section.X] declares
# how to recognize and group entries of one kind.
# ============================================================================

[meta]
config_name = parser_config.ini
description = SonicOS Enhanced -> canonical-JSON parser config. Calibrated
              against SonicOS 6.5.x exports.
version     = 1.0


# ============================================================================
# [meta] — header
# ============================================================================
[section.meta]
description = Header info: name, version, target SonicOS version.
required    = true
fields      = name, version, target, description

[section.meta.field.name]
type     = string
required = true
help     = Human-readable name for this parser config.

[section.meta.field.version]
type     = string
required = true
default  = 1.0.0
help     = Semantic version. Bump on breaking changes.

[section.meta.field.target]
type     = string
required = true
help     = SonicOS version this config is calibrated against. Different
           SonicOS major versions may need their own forked parser config
           (e.g. parser_config.sonicos_6_2.ini).

[section.meta.field.description]
type     = multiline_string
help     = Free-text description of what this parser config produces.


# ============================================================================
# [parser] — global parsing behavior
# ============================================================================
[section.parser]
description = Global controls that apply to every section's parsing.
required    = true
fields      = block_terminator, indent_style, indent_size, strip_quotes,
              parse_no_negation, auto_collect_repeated, unmatched_body_action,
              body_comment_prefix

[section.parser.field.block_terminator]
type     = string
required = true
default  = exit
help     = Token that closes a block in SonicOS exports. Default 'exit'.

[section.parser.field.indent_style]
type        = enum
enum_values = spaces, tabs
required    = true
default     = spaces
help        = Whether SonicOS uses spaces or tabs to indent block contents.

[section.parser.field.indent_size]
type     = int
min      = 1
required = true
default  = 4
help     = Number of indent units per nesting level (irrelevant if a single
           character is enough; meaningful for spaces).

[section.parser.field.strip_quotes]
type    = bool
default = true
help    = If true, surrounding double-quotes on values are stripped.

[section.parser.field.parse_no_negation]
type    = bool
default = true
help    = If true, lines beginning with `no ` set the corresponding field
          to false rather than being kept as raw text.

[section.parser.field.auto_collect_repeated]
type    = bool
default = true
help    = If true, repeating same-key lines inside a block are collected
          into a list rather than overwriting one another.

[section.parser.field.unmatched_body_action]
type        = enum
enum_values = preserve, drop, error
default     = preserve
help        = What to do with body lines that no rule recognizes. preserve
              keeps them in _unparsed.json for later analysis.

[section.parser.field.body_comment_prefix]
type    = string
default = #
help    = Comment-line prefix inside SonicOS export bodies. Lines starting
          with this character are skipped during parse.


# ============================================================================
# [output] — JSON output controls
# ============================================================================
[section.output]
description = Controls for the canonical JSON output the parser produces.
required    = true
fields      = directory, indent_json, envelope_id_field, envelope_source_lines,
              envelope_section_name, list_wrapper_key, include_run_metadata

[section.output.field.directory]
type      = path
path_kind = dir
required  = true
help      = Output directory for the canonical JSON files (one per
            [section.X] in this config).

[section.output.field.indent_json]
type    = int
min     = 0
default = 2
help    = JSON indent level for output files. 0 = no indentation, 2 = standard.

[section.output.field.envelope_id_field]
type    = string
default = _id
help    = Name of the auto-added id field on each output entry. Used by
          downstream phases to reference entries.

[section.output.field.envelope_source_lines]
type    = string
default = _source_lines
help    = Name of the auto-added field carrying the [start, end] line numbers
          in the source export this entry came from. Useful for debugging.

[section.output.field.envelope_section_name]
type    = string
default = _section
help    = Name of the auto-added field carrying the [section.X] name that
          produced this entry.

[section.output.field.list_wrapper_key]
type    = string
default = entries
help    = Top-level key in each output JSON that wraps the list of entries.
          Output shape: { "entries": [...] }.

[section.output.field.include_run_metadata]
type    = bool
default = true
help    = If true, include parse-run metadata (parser version, source file
          path, parse timestamp) in each output JSON.


# ============================================================================
# [section.X] — one section per logical area to recognize
# ============================================================================
[section_pattern.section]
match_pattern = ^section\.[\w_-]+$
description   = One parsing rule. Each rule declares a regex that
                identifies a SonicOS export-line family (the rule's
                "match_regex"), and how matched entries should be
                emitted to JSON. The X in [section.X] becomes the
                logical name of the resulting JSON file's contents.
fields        = description, match_regex, form, output_file, key_field,
                list_fields

[section_pattern.section.field.description]
type     = multiline_string
required = true
help     = What kind of SonicOS entries this rule captures. Plain English.

[section_pattern.section.field.match_regex]
type     = regex
required = true
help     = Python regex matched against the leading line of each
           candidate entry. Capture groups become fields on the output
           entry. Use named groups (?P<name>...) for clarity.

[section_pattern.section.field.form]
type        = enum
enum_values = block, single_line, block_or_single
required    = true
help        = block: the matched line introduces a SonicOS block whose
              indented body is parsed and folded onto the entry.
              single_line: the matched line IS the entry; no body to parse.
                            block_or_single: opener may have an indented body OR
                            be a complete single-line directive — parser decides at
                            runtime based on whether next non-blank line is indented.

[section_pattern.section.field.output_file]
type     = string
required = true
help     = JSON filename written to [output] directory (e.g.
           address_objects.json).

[section_pattern.section.field.key_field]
type = string
help = Name of the captured group used as the entry's primary key.
       Defaults to 'name' if absent. Multiple entries with the same
       key in a single export typically indicates a parse error.

[section_pattern.section.field.list_fields]
type = csv
help = Capture-group names whose values should be collected into lists
       across multiple body lines (rather than overwriting one another).
       Equivalent to per-rule auto_collect_repeated.
