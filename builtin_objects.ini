; ===========================================================================
; builtin_objects.ini — SonicWall vendor built-in registry
; ===========================================================================
;
; Phase 7. Captain J P Ames' insight: "why translate stuff that's a
; vendor built-in?" Vendor built-ins map 1:1 to WatchGuard equivalents;
; no operator decision needed.
;
; CURATION PRINCIPLE:
;
;   This list is OPERATOR-AUTHORED. Every entry is a senior-engineer
;   declaration that this object IS a SonicOS built-in. If unsure,
;   leave it OUT — false-negatives just mean an extra triage step.
;   False-positives silently drop customer config.
;
; PROVENANCE:
;
;   This registry was curated from a factory-default NSA 3600 running
;   SonicOS Enhanced 6.5.4.7-83n. The 224 services, 50 service-groups,
;   8 schedules, and 7 zones below were ALL present in a fresh
;   factory-reset configuration — confirming they ship with SonicOS.
;
; ===========================================================================

