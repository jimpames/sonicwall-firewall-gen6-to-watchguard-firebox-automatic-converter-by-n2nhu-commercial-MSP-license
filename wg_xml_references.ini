# =========================================================================
# wg_xml_references.ini
#
# Cross-reference rules for the WatchGuard XML validator. Each
# [reference.X] section declares a named-reference relationship: text
# at one xpath must equal a `name` field of an element at another
# xpath. Catches dangling references — like a policy that names a
# nonexistent service, an abs-policy whose from-alias doesn't have a
# matching alias-list/alias entry, or an ipsec-action pointing to a
# missing ike-policy.
#
# Built-in allowances ([builtin.X] sections) declare names that don't
# need a definition in the XML — they're shipped on every Firebox.
#
# This file is HAND-CURATED. The schema_inferer doesn't write here.
# =========================================================================

[meta]
name        = wg_xml_references
version     = 1.0.0
description = Cross-reference rules and built-in name allowances for
              the WatchGuard XML validator.


# -------------------------------------------------------------------------
# Built-in name allowances
# -------------------------------------------------------------------------
# These names are valid references even when not defined in the XML
# being validated. They're shipped with WatchGuard. References that
# resolve to a builtin name pass the cross-reference check.

[builtin.alias]
# WatchGuard built-in aliases. Real Fireboxes have these by default
# regardless of what's in alias-list.
description = Aliases shipped with every Firebox.
names = Any, Any-External, Any-Trusted, Any-Optional, Firebox,
        External, Trusted, Optional-1, Optional-2, Optional-3,
        Optional-4, Optional-5, Optional-6, Optional-7, Optional-8,
        Any-MUVPN, Any-BOVPN, MUVPN-Users

[builtin.schedule]
description = WatchGuard built-in schedules.
names = Always On

[builtin.service]
description = WatchGuard built-in service names that match common protocol
              definitions. Not exhaustive — sourced from the SonicWall/WG
              name-overlap reconnaissance plus common protocols.
              Note: "Any" (capital A) is a WG built-in; "any" (lowercase)
              is NOT and will be flagged as a dangling reference. The
              validator does this deliberately — emitters that produce
              lowercase forms have a real bug that needs fixing.
names = Any, HTTP, HTTPS, FTP, SSH, Telnet, DNS, DNS-proxy, SMTP, SMTPS,
        IMAP, IMAPS, POP3, POP3S, NTP, SNMP, LDAP, LDAPS, RDP,
        TFTP, IKE, IPsec, ICMP, Ping, BGP, GRE, IGMP, IDENT,
        Gopher, NFS, NetBIOS

[builtin.app-action]
description = WatchGuard built-in geo/app actions.
names = Global


# -------------------------------------------------------------------------
# Cross-reference rules
# -------------------------------------------------------------------------
# Each rule says: text at <from_xpath> must match a <name> child of an
# element at <to_xpath>, OR be in a built-in allowance, OR be empty if
# allow_empty=true.

[reference.policy_service]
description = <policy>/<service> names a service from service-list.
from_xpath  = .//policy-list/policy/service
to_xpath    = .//service-list/service
to_field    = name
allow_empty = true
allow_builtin = service
severity    = warning

[reference.abs_policy_service]
description = <abs-policy>/<service> names a service from service-list.
from_xpath  = .//abs-policy-list/abs-policy/service
to_xpath    = .//service-list/service
to_field    = name
allow_empty = true
allow_builtin = service
severity    = warning

[reference.policy_from_alias]
description = <policy>/<from-alias-list>/<alias> names an alias.
from_xpath  = .//policy-list/policy/from-alias-list/alias
to_xpath    = .//alias-list/alias
to_field    = name
allow_empty = false
allow_builtin = alias
severity    = warning

[reference.policy_to_alias]
description = <policy>/<to-alias-list>/<alias> names an alias.
from_xpath  = .//policy-list/policy/to-alias-list/alias
to_xpath    = .//alias-list/alias
to_field    = name
allow_empty = false
allow_builtin = alias
severity    = warning

[reference.abs_policy_from_alias]
description = <abs-policy>/<from-alias-list>/<alias> names an alias.
from_xpath  = .//abs-policy-list/abs-policy/from-alias-list/alias
to_xpath    = .//alias-list/alias
to_field    = name
allow_empty = false
allow_builtin = alias
severity    = warning

[reference.abs_policy_to_alias]
description = <abs-policy>/<to-alias-list>/<alias> names an alias.
from_xpath  = .//abs-policy-list/abs-policy/to-alias-list/alias
to_xpath    = .//alias-list/alias
to_field    = name
allow_empty = false
allow_builtin = alias
severity    = warning

[reference.abs_policy_to_policy]
description = <abs-policy>/<policy-list>/<policy> names a runtime policy.
              This stitches together the abs-policy (definition) and the
              policy (runtime instantiation) pair that share a name.
from_xpath  = .//abs-policy-list/abs-policy/policy-list/policy
to_xpath    = .//policy-list/policy
to_field    = name
allow_empty = false
severity    = warning

[reference.policy_schedule]
description = <policy>/<schedule> names a schedule. "Always On" is a
              built-in that doesn't need a schedule-list/schedule entry.
from_xpath  = .//policy-list/policy/schedule
to_xpath    = .//schedule-list/schedule
to_field    = name
allow_empty = true
allow_builtin = schedule
severity    = warning

[reference.abs_policy_settings_schedule]
description = <abs-policy>/<settings>/<schedule> names a schedule.
from_xpath  = .//abs-policy-list/abs-policy/settings/schedule
to_xpath    = .//schedule-list/schedule
to_field    = name
allow_empty = true
allow_builtin = schedule
severity    = warning

[reference.alias_member_alias_name]
description = <alias-member>/<alias-name> names another alias (alias-of-alias).
from_xpath  = .//alias-list/alias/alias-member-list/alias-member/alias-name
to_xpath    = .//alias-list/alias
to_field    = name
allow_empty = true
allow_builtin = alias
severity    = warning

[reference.alias_member_address]
description = <alias-member>/<address> names an address-group.
from_xpath  = .//alias-list/alias/alias-member-list/alias-member/address
to_xpath    = .//address-group-list/address-group
to_field    = name
allow_empty = true
allow_builtin = alias
severity    = warning

[reference.alias_member_interface]
description = <alias-member>/<interface> names an interface.
from_xpath  = .//alias-list/alias/alias-member-list/alias-member/interface
to_xpath    = .//interface-list/interface
to_field    = name
allow_empty = true
allow_builtin = alias
severity    = warning

[reference.ike_policy_action]
description = <ike-policy>/<ike-action> names an ike-action.
from_xpath  = .//ike-policy-list/ike-policy/ike-action
to_xpath    = .//ike-action-list/ike-action
to_field    = name
allow_empty = false
severity    = error

[reference.ipsec_action_ike_policy]
description = <ipsec-action>/<ike-policy> names an ike-policy.
from_xpath  = .//ipsec-action-list/ipsec-action/ike-policy
to_xpath    = .//ike-policy-list/ike-policy
to_field    = name
allow_empty = true
severity    = warning

[reference.ipsec_action_ike_policy_group]
description = <ipsec-action>/<ike-policy-group> names an ike-policy-group.
from_xpath  = .//ipsec-action-list/ipsec-action/ike-policy-group
to_xpath    = .//ike-policy-group-list/ike-policy-group
to_field    = name
allow_empty = true
severity    = warning

[reference.ike_policy_group_member]
description = <ike-policy-group>/<member-list>/<member>/<ike-policy> names
              an ike-policy.
from_xpath  = .//ike-policy-group-list/ike-policy-group/member-list/member/ike-policy
to_xpath    = .//ike-policy-list/ike-policy
to_field    = name
allow_empty = false
severity    = error

[reference.abs_ipsec_action_ike_policy]
description = <abs-ipsec-action>/<ike-policy> names an ike-policy.
from_xpath  = .//abs-ipsec-action-list/abs-ipsec-action/ike-policy
to_xpath    = .//ike-policy-list/ike-policy
to_field    = name
allow_empty = false
severity    = error

[reference.abs_ipsec_action_ipsec_action]
description = <abs-ipsec-action>/<ipsec-action> names an ipsec-action.
from_xpath  = .//abs-ipsec-action-list/abs-ipsec-action/ipsec-action
to_xpath    = .//ipsec-action-list/ipsec-action
to_field    = name
allow_empty = false
severity    = error
