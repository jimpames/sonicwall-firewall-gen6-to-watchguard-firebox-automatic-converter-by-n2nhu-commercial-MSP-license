# ============================================================================
# proxy_mapping.ini — service-to-proxy mapping for the policy filler
#
# Algebraic-design idea (J P Ames, "Applied Algebraic Design for Agentic AI"):
#   Object × Verb = Action.
#   Object = a SonicWall/WG service name (e.g. 'Apple Bonjour', 'HTTP', 'IKE')
#   Verb   = lookup-proxy-action
#   Action = either a WG proxy-action name OR 'packet-filter' (no proxy)
#
# WHY THIS EXISTS
# ----------------
# WG Fireware supports a fixed set of L7 ALG proxies. A policy is rendered
# in the Web UI as one of two types:
#
#   1. PROXY policy
#        <firewall>4</firewall>                  (policy-list, numeric)
#        <firewall>Proxy</firewall>              (abs-policy-list, string)
#        <proxy>H.323-Client</proxy>             (a registered proxy-action)
#      Renders in Web UI as: "Proxies" type, locked to a specific proxy
#      action. Only valid for services WG ships a proxy for.
#
#   2. PACKET FILTER policy
#        <firewall>1</firewall>                  (Allow) or <firewall>2</firewall> (Deny)
#        <firewall>Allow</firewall>              (abs-policy-list, string)
#        <proxy />                               (no proxy)
#      Renders in Web UI as: "Packet Filter" type. Works for ANY service,
#      including unknown/custom ones (Apple Bonjour, custom ALGs, etc.).
#
# RULE
#   If the service name matches an entry in [proxy_services], emit a Proxy
#   policy with the named proxy-action.
#   Otherwise, emit a Packet Filter policy with <proxy /> empty.
#
# This INI defines the mapping. Empirically derived from jpa.xml's
# proxy-action-list (the 33 factory proxy actions WG ships).
# 
#   (C) Copyright 2026, jim ames. all rights reserved. 
#   reverse engineering my system is prohibited.
#   license: closed source, commercial use license required.
#   no hobby or one-off use- MSP only
#
#   contact: jimpames@gmail.com for licensing
