[meta]
name        = service -> proxy-action mapping for WG policy emission
version     = 1.0.0
description = Maps SonicWall/WG service names to WG proxy-action names.
              Services not listed default to packet-filter (no proxy).
              Verified against jpa proxy-action-list: 33 WG factory proxy
              actions, covering FTP, HTTP, HTTPS, H.323, SIP, SMTP, IMAP,
              POP3, DNS, Explicit-Web, TCP-UDP-Proxy.

# ============================================================================
# Service -> Proxy-action map
# ============================================================================
# Format:    <SonicWall/WG service name> = <WG proxy-action name>
#
# The service name on the LEFT is what appears in the customer's access
# rule <service> field (case-insensitive lookup, normalized at runtime).
# The proxy-action on the RIGHT must exist in proxy-action-list (jpa
# ships these by default).
#
# Any service NOT in this section will be emitted as a Packet Filter
# policy. That's the safe default — the policy will still work, just
# without L7 inspection.
#
# WG-supported proxies (per jpa.xml proxy-action-list):
#   DNS-Incoming, DNS-Outgoing
#   FTP-Client, FTP-Client.Standard, FTP-Server, FTP-Server.Standard,
#     Default-FTP-Client
#   HTTP-Client, HTTP-Client.Standard, HTTP-Content.Standard, HTTP-Server,
#     HTTP-Server.Standard, Default-HTTP-Client
#   HTTPS-Client, HTTPS-Client.Standard, HTTPS-Server, HTTPS-Server.Standard,
#     Default-HTTPS-Client
#   IMAP-Client.Standard, IMAP-Server.Standard
#   POP3-Client, POP3-Client.Standard, POP3-Server, POP3-Server.Standard
#   SMTP-Incoming, SMTP-Incoming.Standard, SMTP-Outgoing, SMTP-Outgoing.Standard
#   H.323-Client
#   SIP-Client
#   TCP-UDP-Proxy, TCP-UDP-Proxy.Standard
#   Explicit-Web.Standard

[proxy_services]
# WG service name -> WG proxy-action name
#
# Format note: WG service names are case-preserved exactly as in
# service-list. Looking up uses case-insensitive match.

# ---- HTTP/HTTPS ----
HTTP            = Default-HTTP-Client
HTTPS           = Default-HTTPS-Client

# ---- FTP ----
FTP             = Default-FTP-Client

# ---- DNS ----
DNS             = DNS-Outgoing

# ---- SMTP / IMAP / POP3 ----
SMTP            = SMTP-Outgoing.Standard
IMAP            = IMAP-Client.Standard
POP3            = POP3-Client.Standard

# ---- H.323 / SIP (voice) ----
H323            = H.323-Client
H323-ALG        = H.323-Client
SIP             = SIP-Client
SIP-ALG         = SIP-Client


# ============================================================================
# Service name normalization
# ============================================================================
# SonicWall sometimes ships service names that don't match WG's exact
# spelling. This section maps SonicWall service names -> WG service names
# in service-list. Applied BEFORE the proxy lookup.
#
# Format: <SonicWall service name> = <WG service name>
[service_aliases]
# Examples — extend as needed when new customer configs introduce
# different naming.

# SonicWall sometimes lowercases, WG capitalizes
http            = HTTP
https           = HTTPS
ftp             = FTP
dns             = DNS
smtp            = SMTP
imap            = IMAP
pop3            = POP3

# H.323 naming variants
h323            = H.323
h.323           = H.323
h323-alg        = H323-ALG


# ============================================================================
# Default firewall action for packet-filter policies
# ============================================================================
# When a customer policy maps to a packet-filter (no proxy), the
# <firewall> value comes from the customer's <action> field. This
# section maps SonicWall action verbs to WG numeric firewall codes.
[firewall_actions]
# SonicWall action -> WG firewall code (numeric, used in policy-list)
allow           = 1
permit          = 1
accept          = 1
deny            = 2
drop            = 2
block           = 2
reject          = 2

# String form (used in abs-policy-list)
# Mapping is derived at runtime: 1 -> Allow, 2 -> Block, 4 -> Proxy
