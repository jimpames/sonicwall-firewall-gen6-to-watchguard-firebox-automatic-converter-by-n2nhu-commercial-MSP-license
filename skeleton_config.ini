# ============================================================================
# skeleton_config.ini  —  How to scrub a real WatchGuard XML export into a
# reusable, non-secret, device-neutral skeleton.
#
# Run once per Firebox model to produce a master skeleton. Phase 2 emit
# starts from that skeleton instead of an empty <profile>, so the resulting
# XML has all the lists and defaults a Firebox import expects.
#
# Algebraic-design model:
#       Profile element × Scrub rule = Skeleton element
#
#       (The same engine pattern. Scrub rules in INI, never in code.)
# 
#   (C) Copyright 2026, jim ames. all rights reserved. 
#   reverse engineering my system is prohibited.
#   license: closed source, commercial use license required.
#   no hobby or one-off use- MSP only
#
#   contact: jimpames@gmail.com for licensing
#
#   $10,000 per MSP one-time
# 
#  need something else other than sonicwall to watchguard?
#  translate most anything to sonicwall with THEIR universal translator
#  then use FESv11 algebraic to translate THAT to watchguard... 
# 
# 
# ============================================================================

[meta]
name        = WatchGuard XML skeleton scrubber
version     = 1.0.0
description = Strips user-defined content and secrets from a WG XML export
              and emits a reusable skeleton for the Phase 2 emitter to merge into.

[io]
input_export        = ../docs/reference_exports/T30jpa1__1_.xml
output_skeleton     = ../docs/skeletons/master_skeleton.xml
output_audit        = ../docs/skeletons/_skeleton_audit.json


# ============================================================================
# THREE SCRUBBER MODES
#
# 1. [empty_lists]         — wipe ALL children. The whole list is user content.
#                            Use when user content is unambiguous (no built-ins).
#
# 2. [additive_lists.<X>]  — keep ONLY the named built-ins; scrub everything
#                            else. The emitter then APPENDS migrated content
#                            alongside the surviving built-ins.
#
# 3. [preserve_lists]      — leave 100% untouched (device defaults).
#
# Determine which mode by looking at the real export:
# if a list mixes WG-shipped built-ins WITH user content → additive.
# if a list is pure user content → empty.
# if a list is pure WG defaults → preserve.
# ============================================================================


# ============================================================================
# EMPTY LISTS (mode 1)
# Pure user content. Emit fills these from scratch. No built-ins to preserve.
# ============================================================================

[empty_lists]
description = Lists whose contents are entirely user-defined.
              Scrubbed empty; emit fills from scratch.

# These hold the things our migration translates from SonicWall AND
# whose contents are 100% user-defined (no WG-shipped defaults to lose).
migration_replaceable = address-group-list, service-list,
                        abs-policy-list, policy-list,
                        nat-list, one-to-one-nat-list, dnat-list,
                        ipsec-action-list, ike-policy-group-list,
                        abs-ipsec-action-list, abs-muvpn-list

# These are typically user-defined too but we may not migrate them yet:
# NOTE: gateway-wireless-controller was previously in this list but
# Captain's friend caught that the importer needs the inner scaffolding
# (<ap-list/>, <ssid-list/>, <global-settings>) preserved. Moved to
# [preserve_scaffolding] below.
migration_optional   = ras-user-list, ras-user-group-list, ras-server-group-list,
                       ras-domain-item-list, radius-conf-list,
                       sslvpn-list, l2tp-list,
                       hotspot-list


# ============================================================================
# ADDITIVE LISTS (mode 2)
# Mixed content: WG built-ins must survive; user content gets scrubbed.
# Emit APPENDS migrated entries alongside the surviving built-ins.
#
# Each entry is keyed by <name> child text. Entries whose <name> appears in
# the keep_names list survive; everything else gets removed.
# ============================================================================

[additive_lists.alias-list]
description = WG ships ~11 built-in aliases (Any, Firebox, External, Trusted,
              Optional-N, Any-External, Any-Trusted, Any-Optional, Any-BOVPN,
              Any-MUVPN, Any-Multicast). The .from/.to scaffolding aliases
              are user/policy-generated and should be cleared so emit can
              rebuild them deterministically.
keep_names  = Any, Firebox, External, Trusted, Optional-1, Optional-2, Optional-3,
              Any-External, Any-Trusted, Any-Optional,
              Any-BOVPN, Any-MUVPN, Any-Multicast

[additive_lists.ipsec-proposal-list]
description = WG ships 11 named ESP transform templates (ESP-AES256-SHA256,
              etc.) which abs-muvpn-list and ipsec-action-list reference by
              name. Without these, every VPN reference dangles. Keep them all.
keep_names  = ESP-AES256-SHA256, ESP-AES128-SHA1, ESP-AES-SHA1,
              ESP-AES-MD5, ESP-3DES-SHA1, ESP-3DES-MD5,
              ESP-DES-SHA1, ESP-DES-MD5,
              ESP-AES128-GCM, ESP-AES192-GCM, ESP-AES256-GCM

[additive_lists.ike-action-list]
description = WG ships ike2_shared_action as the default IKEv2 transform set.
              Keep it; emit appends per-VPN custom transforms.
keep_names  = ike2_shared_action

[additive_lists.ike-policy-list]
description = WG ships "WG Default IKEv2 Gateway" as the dynamic-peer
              IKEv2 policy. Keep it; emit appends per-VPN gateway policies.
keep_names  = WG Default IKEv2 Gateway

[additive_lists.interface-list]
description = WG ships abstract zone-aliases as interface entries (Any-*,
              External/Trusted/Optional-N, Firebox). These are referenced
              throughout abs-policy-list. Keep them; emit appends physical
              interfaces from SonicWall side.
keep_names  = Any, Any-External, Any-Trusted, Any-Optional,
              Any-BOVPN, Any-MUVPN, Any-Multicast,
              Firebox, External, Trusted,
              Optional-1, Optional-2, Optional-3

[additive_lists.schedule-list]
description = WG ships "Always On" as the universal schedule reference.
              Most policies reference it by name. Keep it.
keep_names  = Always On


# ============================================================================
# PRESERVE LISTS (mode 3)
# WG-shipped device defaults. Untouched.
# ============================================================================

[preserve_lists]
description = Lists with WG-shipped default content. Keep verbatim.
              The scrubber will not modify these unless they appear in
              [empty_lists] or [redact].

device_defaults = proxy-action-list, proxy-helper-list, alarm-action-list,
                  signature-update, dlp-sensor-list,
                  webblocker-global-exception-list,
                  https-exception-override-list, tls-profile-list,
                  app-action-list, apps-block-profile-list,
                  policy-filter-list, traffic-mgmt-list,
                  device-group-list, policy-view, geolocation-blocking,
                  load-balance-list, policy-tag-list, probe-list,
                  user-group-list, auth-group-list, auth-domain-list

# NOTE: service-group-list is NOT a real WatchGuard top-level element. WG
# composes services within service-list/service-item. Do not emit one.

# device_invariants are the elements whose VALUES are device-specific and
# MUST be replaced per-target-Firebox (firmware version, rs-version
# integer, etc.). The scrubber now (post-Captain's-friend-review) replaces
# each listed element's text with a sentinel string
# __OPERATOR_REPLACE__<tagname>__ so a forgotten replacement is loudly
# visible to the operator and to wg_validator. CLI flags on make_skeleton.py
# (--for-version, --rs-version, --product-grade, --xml-purpose) override
# the sentinels with explicit values when the target Firebox stats are
# already known.
device_invariants = product-grade, rs-version, using-cpm-profile, for-version,
                    xml-purpose, base-model

# system-parameters held separately — keep its structure but scrub the
# device-specific identity bits (hostname, serial in some cases).
preserve_with_caveats = system-parameters, account-list


# ============================================================================
# PRESERVE SCAFFOLDING (Fix C, post-friend-review)
# Top-level containers that look "user-defined" at first glance but whose
# inner structure is required by the importer. The scrubber leaves these
# alone (existing [redact] rules still apply to anything sensitive within).
#
# Two flavors:
#   verbatim_from_reference  — keep the JPA structure as-is, useful for
#                              feature-off-by-default scaffolds whose values
#                              communicate "this subsystem is disabled".
#   fresh_stamp              — clear the contents and emit ONE fresh entry
#                              stamped with the toolkit's name + current
#                              time. Used for revision-history so the
#                              importer sees a valid revision record.
# ============================================================================

[preserve_scaffolding]
description = Containers whose inner structure is required by the importer.
              Existing [redact] and [device_identity_redact] rules still
              apply to anything sensitive within.

# Keep the JPA structure exactly. The gateway-wireless-controller scaffold
# carries <ap-list/>, <ssid-list/>, <policy-domain-list/>, plus
# <global-settings> with <gwc-enabled>0</gwc-enabled> and assorted
# disabled-by-default settings. Importer expects all of these.
verbatim_from_reference = gateway-wireless-controller

# Clear contents and stamp fresh. revision-history needs at least one
# <revision> child; the scrubber writes a single revision entry with
# module-id = "n2nhu lab migration toolkit", time = now, and a comment
# explaining the provenance.
fresh_stamp = revision-history


# ============================================================================
# REDACT
# Specific elements whose VALUES are sensitive (PSKs, passwords, secrets,
# certificates) and must be removed even from preserved lists.
#
# Each rule matches by XPath and replaces the element's text with the
# `replacement` value. Sub-elements are unaffected.
# ============================================================================

[redact]
description = Sensitive values to wipe from the skeleton before checking it
              into version control or sharing it.

# IKE pre-shared keys
psk                       = .//psk
psk_replacement           =

# IPsec / mobile VPN passphrases
passphrase                = .//passphrase
passphrase_replacement    =

# RADIUS shared secrets
radius_secret             = .//radius-conf/secret
radius_secret_replacement =

# RSA / DSA certificate bodies
rsa_cert                  = .//rsa-cert
rsa_cert_replacement      =
dsa_cert                  = .//dsa-cert
dsa_cert_replacement      =

# Local IDs / certificate IDs that may identify the device
local_id_data             = .//local-id-data
local_id_data_replacement =

# Account passwords (account-list children — list itself is preserved
# but any password values are wiped)
account_password          = .//account/password
account_password_replacement =


# ============================================================================
# REVISION HISTORY
# The revision-history is a per-device audit trail. Keep the element but
# clear its children so the skeleton doesn't carry someone else's history.
# ============================================================================

[empty_lists_secondary]
description = Lists that should be emptied for privacy / reuse but aren't
              user content per se.
# NOTE: revision-history was previously here, but the importer prefers at
# least one revision entry. Moved to [preserve_scaffolding].fresh_stamp
# which emits one fresh revision stamped with the toolkit's name + time.
audit_trails =


# ============================================================================
# DEVICE IDENTITY
# Strip identifying info from system-parameters: hostname, serial,
# device-name. Keep the structural shell.
# ============================================================================

[device_identity_redact]
description = XPaths inside otherwise-preserved lists to redact for re-use.
xpaths = ./system-parameters/firebox-name,
         ./system-parameters/serial-number,
         ./system-parameters/device-name,
         ./system-parameters/host-name


# ============================================================================
# OUTPUT FORMATTING
# ============================================================================

[output]
xml_declaration = <?xml version="1.0" encoding="UTF-8"?>
header_comment  = SKELETON — DO NOT EDIT BY HAND.
                  Generated by make_skeleton.py from a real Firebox export.
                  All user-defined content has been scrubbed; all secrets
                  have been redacted. Phase 2 emit merges its output into
                  this skeleton to produce a complete loadable profile.
preserve_indentation = true
