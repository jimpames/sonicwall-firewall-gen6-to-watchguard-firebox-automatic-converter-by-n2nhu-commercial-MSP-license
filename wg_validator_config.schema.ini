# =========================================================================
# wg_validator_config.schema.ini
#
# Validates wg_validator_config.ini's shape.
# =========================================================================

[meta]
name        = wg_validator_config_schema
version     = 1.0.0
description = Meta-schema for wg_validator_config.ini.


# -------------------------------------------------------------------------
[section.meta]
required = true

[section.meta.field.name]
type     = string
required = true

[section.meta.field.version]
type     = string
required = true

[section.meta.field.description]
type     = multiline_string
required = false


# -------------------------------------------------------------------------
[section.io]
required = true

[section.io.field.schema_path]
type     = string
required = true
help     = Path to wg_xml_schema.ini, relative to this config or absolute.

[section.io.field.candidate_xml]
type     = string
required = true
help     = Path to the candidate WG XML file to validate.

[section.io.field.output_dir]
type     = string
required = false
help     = Directory where the validation report will be written.

[section.io.field.output_json]
type     = string
required = false

[section.io.field.output_summary]
type     = string
required = false


# -------------------------------------------------------------------------
[section.engine]
required = true

[section.engine.field.unknown_element_severity]
type        = enum
enum_values = error, warning, info
required    = true
help        = Severity assigned to unknown elements (those without an
              [element.X] section in the schema).

[section.io.field.references_path]
type = string
required = false
help = Path to wg_xml_references.ini (cross-reference rules + built-in name allowances). Optional — if absent, the cross-reference validation phase is skipped.
