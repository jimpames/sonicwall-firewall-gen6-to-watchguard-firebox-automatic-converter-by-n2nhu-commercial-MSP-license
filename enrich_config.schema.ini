# ============================================================================
# enrich_config.schema.ini
#
# Schema describing the structure of enrich_config.ini. The validator uses
# this at engine load time to catch typos and missing fields. The GUI uses
# it to render type-aware editing widgets.
#
# Documented dialect: ../docs/schema_format.md
#
# Phase 1.5 sits between the parser (Phase 1) and the XML emitter (Phase 2).
# The enricher engine knows six kinds of pass:
#   derive  — synthesize new entries from existing ones
#   pivot   — reshape an array of strings into a structured dict
#   transform — regex-based value normalization
#   merge   — coalesce multiple entries into one (TCP/UDP twins; service-groups)
#   expand_schedule — SonicWall recurring-string -> WG day-of-week structure
#   audit   — apply a severity table, emit findings
#
# Each pass declares its `kind` and the kind-specific fields. Many fields
# are optional and apply only to one kind — the help text notes which.
# ============================================================================

[meta]
config_name = enrich_config.ini
description = Phase 1.5 enrichment passes. Pivot/derive/transform/merge/
              expand_schedule/audit pipelines, all data-driven.
version     = 1.0


# ============================================================================
# [meta] — header
# ============================================================================
[section.meta]
description = Header info: name, version, description.
required    = true
fields      = name, version, description

[section.meta.field.name]
type     = string
required = true
help     = Human-readable name for this enrichment config.

[section.meta.field.version]
type     = string
required = true
default  = 1.0.0
help     = Semantic version. Bump on breaking changes.

[section.meta.field.description]
type     = multiline_string
help     = Free-text description of the pass pipeline.


# ============================================================================
# [io] — input/output paths
# ============================================================================
[section.io]
description = File-system paths the enricher reads from and writes to.
required    = true
fields      = parser_output_dir, enricher_output_dir, concept_map_path

[section.io.field.parser_output_dir]
type      = path
path_kind = dir
required  = true
help      = Phase-1 parser output directory. Source of canonical JSONs.

[section.io.field.enricher_output_dir]
type      = path
path_kind = dir
required  = true
help      = Where this enricher writes its outputs (post-pivot, post-derive,
            post-audit JSONs).

[section.io.field.concept_map_path]
type      = path
path_kind = file
required  = true
help      = Path to concept_map.ini. Audit passes consult its
            crypto_audit.X tables for severity classification.


# ============================================================================
# [pass.X] — one pass per section, in declaration order
# ============================================================================
[section_pattern.pass]
match_pattern = ^pass\.[\w_-]+$
description   = One enrichment pass. Runs in declaration order. Each
                pass reads its `input_file` (relative to parser_output_dir
                or enricher_output_dir) and writes its `output_file`.
                Most fields are conditional on `kind`; see each field's
                help for which kind applies.
fields        = description, kind, input_file, output_file, enabled,
                derive_from, derive_template,
                pivot_array, pivot_target, pivot_keep_raw, pivot_rules,
                transform_fields, transform_pattern, transform_replacement,
                strategy, name_pattern, members_field, member_carry_fields,
                leaves_file, reference_fields, nested_reference_field,
                skip_empty_groups,
                source_field, output_field, day_tokens, emit_type_field,
                audit_target, audit_table, findings_field,
                upgrade_table, upgrade_field

[section_pattern.pass.field.description]
type     = multiline_string
required = true
help     = What this pass does. The first line is shown in pipeline summaries.

[section_pattern.pass.field.kind]
type        = enum
required    = true
enum_values = derive, pivot, transform, merge, expand_schedule, audit
help        = Pass kind. Determines which other fields apply.

[section_pattern.pass.field.input_file]
type     = string
required = true
help     = JSON file this pass reads. Relative to parser_output_dir for the
           first pass that touches a given file; subsequent passes read from
           enricher_output_dir.

[section_pattern.pass.field.output_file]
type     = string
required = true
help     = JSON file this pass writes. Relative to enricher_output_dir.

[section_pattern.pass.field.enabled]
type     = bool
required = true
default  = true
help     = If false, the pass is skipped. Useful for disabling experimental
           passes without removing them from the config.

# ---- derive-specific ------------------------------------------------------
[section_pattern.pass.field.derive_from]
type = string
help = [kind=derive] Field name in input entries that drives derivation
       (e.g. 'interfaces' to synthesize per-interface address objects).

[section_pattern.pass.field.derive_template]
type = multiline_string
help = [kind=derive] Newline-separated 'name_template = json_template' pairs.
       The engine substitutes {placeholders} from each input entry and
       parses the right side as JSON to produce a new derived entry.

# ---- pivot-specific -------------------------------------------------------
[section_pattern.pass.field.pivot_array]
type = string
help = [kind=pivot] Name of the input field holding the flat array of
       strings to pivot (e.g. 'proposal' on a VPN policy).

[section_pattern.pass.field.pivot_target]
type = string
help = [kind=pivot] Free-text label describing the pivot output shape.
       Documentation only; the actual structure comes from pivot_rules.

[section_pattern.pass.field.pivot_keep_raw]
type    = bool
default = false
help    = [kind=pivot] If true, keep the original flat array on the entry
          alongside the pivoted dict. Useful for round-trip debugging.

[section_pattern.pass.field.pivot_rules]
type = multiline_string
help = [kind=pivot] Newline-separated 'pattern = target_path' rules. The
       pattern is matched against each array element; capture groups are
       written to the dotted target path on the output dict.

# ---- transform-specific ---------------------------------------------------
[section_pattern.pass.field.transform_fields]
type = csv
help = [kind=transform] List of field names to apply the regex to. Each
       value is searched + replaced. Lists are walked element-wise.

[section_pattern.pass.field.transform_pattern]
type = regex
help = [kind=transform] Python regex applied to each value of each
       transform_field. Use named groups for clarity.

[section_pattern.pass.field.transform_replacement]
type = string
help = [kind=transform] Replacement template. Standard re.sub() backrefs:
       \1, \2, etc. or \\g<name>.

# ---- merge-specific -------------------------------------------------------
[section_pattern.pass.field.strategy]
type        = enum
enum_values = name_pattern, recursive_expand
help        = [kind=merge] Merge algorithm. name_pattern groups entries
              whose names share a captured prefix (e.g. TCP/UDP twins).
              recursive_expand walks reference graphs (e.g. service-groups
              referencing service-objects, possibly nested).

[section_pattern.pass.field.name_pattern]
type = regex
help = [kind=merge, strategy=name_pattern] Regex matched against each
       entry's name. Group 1 captures the merged-entry name; remaining
       members go onto a list.

[section_pattern.pass.field.members_field]
type    = string
default = members
help    = [kind=merge] Field name on the merged entry that holds the
          list of original members.

[section_pattern.pass.field.member_carry_fields]
type = csv
help = [kind=merge] Per-original-entry fields to carry onto each member
       record (e.g. protocol, port_low, port_high for TCP/UDP merges).

[section_pattern.pass.field.leaves_file]
type = string
help = [kind=merge, strategy=recursive_expand] JSON file holding the LEAF
       entries that group references resolve to (e.g. service_objects.json).

[section_pattern.pass.field.reference_fields]
type = csv
help = [kind=merge, strategy=recursive_expand] Fields on the input entry
       holding direct references to leaf entries.

[section_pattern.pass.field.nested_reference_field]
type = string
help = [kind=merge, strategy=recursive_expand] Field on the input entry
       holding references to OTHER input entries (recurse to expand).

[section_pattern.pass.field.skip_empty_groups]
type    = bool
default = true
help    = [kind=merge, strategy=recursive_expand] If true, drop output
          entries whose member list is empty after recursive expansion.

# ---- expand_schedule-specific --------------------------------------------
[section_pattern.pass.field.source_field]
type = string
help = [kind=expand_schedule] Dotted path to the source field holding
       the SonicWall recurring-string(s). E.g. occurs.recurring.

[section_pattern.pass.field.output_field]
type    = string
default = wg_schedule
help    = [kind=expand_schedule] Field on the output entry that receives
          the WatchGuard day-of-week structured representation.

[section_pattern.pass.field.day_tokens]
type    = kv_list
help    = [kind=expand_schedule] Day-token-to-index map (mon=1, tue=2,
          ..., all=0). Required to interpret the recurring strings.

[section_pattern.pass.field.emit_type_field]
type    = string
default = wg_schedule_type
help    = [kind=expand_schedule] Field name that captures whether the
          schedule is always_on or recurring.

# ---- audit-specific -------------------------------------------------------
[section_pattern.pass.field.audit_target]
type = csv
help = [kind=audit] List of dotted field paths on each input entry to
       inspect. Each value is looked up in audit_table for severity.

[section_pattern.pass.field.audit_table]
type = string
help = [kind=audit] Section name in concept_map.ini (e.g. crypto_audit.X)
       holding the value-to-severity table this pass consults. If empty,
       the engine derives the table from the target field name.

[section_pattern.pass.field.findings_field]
type    = string
default = audit_findings
help    = [kind=audit] Field on the input entry that the audit pass
          writes its findings list to.

[section_pattern.pass.field.upgrade_table]
type = string
help = [kind=audit] Section name in concept_map.ini holding the
       audit_class.algorithm -> recommended-replacement mapping.

[section_pattern.pass.field.upgrade_field]
type    = string
default = upgrade_recommendation
help    = [kind=audit] Field on each finding that captures the
          recommended replacement (if upgrade_table is set).
