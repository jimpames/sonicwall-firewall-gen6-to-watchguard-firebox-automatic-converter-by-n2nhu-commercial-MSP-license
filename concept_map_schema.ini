# ============================================================================
# concept_map_schema.ini  —  Schema for the vendor-neutral concept map.
#
# The concept map is the durable artifact of this project. Tools come and go;
# vendor versions change; CLI grammars get rewritten. What survives is the
# mapping between concepts:
#
#       <vendor> × <vendor-term>  =  <canonical-concept>
#
# This schema describes the structure of concept_map.ini so a GUI editor can
# render a form to maintain it. Algebraic-design recursion: the schema is
# "physics", the concept map is "content", the translator is "the universe".
# ============================================================================

[schema_meta]
name        = concept_map.ini schema
version     = 1.0.0
description = Drives a GUI to maintain the vendor-neutral concept map —
              the bilingual (eventually multilingual) dictionary that
              translates between firewall vendors' vocabularies.

# ============================================================================
# FIELD TYPES
# ============================================================================

[type.string]
widget = text_input

[type.string_multiline]
widget = textarea

[type.enum]
widget = dropdown

[type.csv_list]
widget = chip_list
delimiter = ,

[type.severity]
widget = dropdown
values = info, advisory, warning, deprecated, breaking

# ============================================================================
# CONCEPT ENTRIES — the heart of the file
#
# Each [concept.<name>] declares ONE concept and how each vendor names it.
# A concept is a vendor-neutral abstraction (e.g. "concrete address primitive",
# "collection of address references", "Phase 1 IKE proposal").
#
# Vendors are added by adding new rows under each concept. Today we have
# sonicwall and watchguard. Tomorrow you can add cisco, fortinet, paloalto.
# ============================================================================

[section_schema.concept]
ini_section_name_pattern = ^concept\.[a-z_][a-z0-9_]*$
cardinality              = multi
title                    = Concept entries (vendor-neutral terms)
fields                   = description, canonical_term, sonicwall, watchguard,
                           note, swap_warning, severity

[field_schema.concept.description]
type     = string_multiline
required = true
help     = Plain-language description of the concept.

[field_schema.concept.canonical_term]
type     = string
required = true
help     = The vendor-neutral name we use in the canonical JSON.

[field_schema.concept.sonicwall]
type     = string
required = false
help     = SonicWall's name for this concept (config keyword, XML element, or "n/a").

[field_schema.concept.watchguard]
type     = string
required = false
help     = WatchGuard's name for this concept (XML element name preferred).

[field_schema.concept.note]
type     = string_multiline
required = false
help     = Free-form notes on edge cases, version differences, gotchas.

[field_schema.concept.swap_warning]
type     = enum
values   = none, vocabulary_swap, semantic_drift, lossy_translation, no_equivalent
default  = none
help     = Flag for translation hazards. 'vocabulary_swap' = same word means
           different things in each vendor (the famous address-group case).

[field_schema.concept.severity]
type     = severity
default  = info
help     = How important is this mapping? 'breaking' means migration cannot
           proceed without operator review.


# ============================================================================
# VALUE MAPS — for protocol numbers, crypto algorithm names, etc.
# ============================================================================

[section_schema.value_map]
ini_section_name_pattern = ^value_map\.[a-z_][a-z0-9_.]*$
cardinality              = multi
title                    = Value translation tables
description              = Per-vendor name lookup tables. Used when the SAME
                           concept uses different LITERAL VALUES in each
                           vendor (e.g. "TCP" vs 6, "triple-des" vs "3DES").
fields                   = description, sonicwall_to_canonical,
                           canonical_to_watchguard

[field_schema.value_map.description]
type     = string
required = true

[field_schema.value_map.sonicwall_to_canonical]
type     = csv_list
help     = Pairs of "sonicwall_value=canonical_value", comma-separated.

[field_schema.value_map.canonical_to_watchguard]
type     = csv_list
help     = Pairs of "canonical_value=watchguard_value", comma-separated.
