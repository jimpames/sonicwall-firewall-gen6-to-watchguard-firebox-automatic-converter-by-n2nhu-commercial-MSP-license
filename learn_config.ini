; ===========================================================================
; learn_config.ini — Schema-Learner driving configuration
; ===========================================================================
;
; Drives the schema-learner engine: which corpus to load, where to write
; proposals, what thresholds gate findings, what behavior on conflicts.
;
; Schema-learner mission (Mission A from DESIGN.md):
;
;   Given a new XML config, identify what's structurally novel relative
;   to the existing schema, present the operator with structured findings
;   that include only OBSERVATIONS (never semantic claims), and require
;   operator declarations (with citations) before any merge.
;
; Founding principle (DESIGN.md):
;
;   No claim without provenance. The engine reports STRUCTURAL facts
;   only. The operator declares semantic meaning with citations.
;
; ---------------------------------------------------------------------------

[meta]
config_version = 1
description = Schema-learner driving configuration. Owns paths,
              thresholds, and behavior flags. Validation rules in
              learn_config.schema.ini.

[io]
; Where the corpus lives (XML configs to learn from + diff against)
corpus_dir = corpus

; Where the existing WG XML schema lives (the bar against which novelty
; is measured). The schema-learner compares incoming features against
; this baseline.
existing_schema_path = ../wg_validator/wg_xml_schema.ini

; Where to write proposals for operator review. Each run produces a
; dated subdirectory under this path containing findings.md, the
; OPERATOR_INTERVENTION_REQUIRED.md, the proposed_diff.md, and a
; merge_preview/ directory of staged INI changes.
proposals_dir = proposals

; Where to write the structured (machine-readable) findings JSON
findings_format = both
                  ; "markdown" | "json" | "both"

[thresholds]
; Confidence threshold above which the engine produces a structural-
; placement proposal. Below this, the operator must classify manually
; (no automatic proposal, only "novel — operator must classify" record).
auto_propose_minimum = 0.40

; Confidence above which the engine flags a finding as "high
; confidence STRUCTURAL match" — operator review can be lighter.
high_confidence = 0.85

; Confidence above which the engine flags as "medium confidence" —
; operator review should be careful.
medium_confidence = 0.50

[reporting]
; Top-K nearest structural neighbors to include in each finding.
; The operator sees the K most-structurally-similar existing elements
; alongside the novel one as CONTEXT (not as suggestions).
top_k_neighbors = 10

; Minimum similarity to include a neighbor in the report. Avoids
; cluttering findings with effectively-zero matches.
neighbor_minimum_similarity = 0.10

[auto_reuse]
; Phase 1 (DESIGN_team_scale_addendum.md): when a novel surface in a
; new config has high structural similarity to an element already in
; the approved corpus, auto-reuse the prior classification rather than
; producing a new intervention-required finding.
;
; The team-scale value proposition: each engineer's classification work
; compounds across the team. After Engineer A classifies <vpn-portal>,
; Engineers B-N never need to re-classify it.
;
; Decisions resolved (May 2026):
;   - threshold = 0.85 baseline (Decision #1, single global default)
;   - require same surface category (operator-declared, not engine-inferred)
;   - operator approval already happened at original classification —
;     auto-reuse inherits that approval through transitive provenance

; Aggregate structural similarity (>=) required to trigger auto-reuse.
; Must match an approved-corpus entry by surface tag fingerprint AND
; structural similarity. Below this, the surface is processed normally
; (intervention required).
similarity_threshold = 0.85

; When auto-reusing, generate a provenance comment in any output that
; references the auto-reused classification, naming the prior surface
; tag and the similarity score.
emit_provenance_comment = true

; Whether auto-reused surfaces appear as findings (with category
; "auto_reused") in findings.md / findings.json. Useful for audit
; visibility — operator can see what was auto-reused without it
; cluttering OPERATOR_INTERVENTION_REQUIRED.md.
report_auto_reused_findings = true

[banned_suppression]
; Phase 2 (DESIGN_team_scale_addendum.md): when a novel surface
; structurally matches a banned-corpus entry, suppress the LLM draft
; (or the intervention-required finding) and route the surface
; directly to the sideline queue for deep research.
;
; The (h)armful triage decision is a NEGATIVE training signal that
; persists across the team: future drafts that look like a previous
; draft already classified as harmful are suppressed before reaching
; any operator.
;
; Decision #2: 0.80 threshold, conservative on the basis that
; operator time is more valuable than missed-suppression false
; negatives.

; Aggregate structural similarity (>=) required to suppress.
; Per addendum disambiguation rule: surface tag must ALSO match.
; A draft is only suppressed if BOTH the tag matches AND the
; structural fingerprint exceeds threshold.
similarity_threshold = 0.80

[mcp]
; Phase 3 (DESIGN_team_scale_addendum.md): the LLM drafting layer.
; When enabled, the triage CLI calls an LLM to produce candidate
; Q1-Q4 declarations for novel surfaces. Drafts include verified
; citations — URLs are programmatically fetched and checked for
; relevant terms before any claim is marked "high confidence."
;
; Per the founding principle: drafts NEVER enter the corpus directly.
; Operator approval via (c)/(e)/(h)/(s) triage is always required.
;
; If disabled or no API key available, Phase 2 workflow continues
; unchanged — operator does all research themselves.

; Master enable/disable. False = Phase 2 behavior (no LLM drafts).
enabled = false

; Which provider to use. The principle binding (citation verification,
; worst-of-four confidence aggregation, structural cross-check) is
; provider-agnostic — all three providers go through the same gates.
;   anthropic  — Claude API (production, requires API key)
;   gpt4all    — Local GPT4All server (offline, no API costs)
;   stub       — Deterministic test fixture (test-only, not for triage)
provider = anthropic

; ---- Anthropic-specific keys (used when provider = anthropic) ----

; Environment variable holding the API key. The toolkit reads this
; at runtime — never stores keys in INI files.
api_key_env_var = ANTHROPIC_API_KEY

; Anthropic model to use for drafting.
;   claude-haiku-4-5-20251001  — fast, low cost, suitable for drafting
;   claude-sonnet-4-6           — higher quality, slower, higher cost
model = claude-haiku-4-5-20251001

; ---- GPT4All-specific keys (used when provider = gpt4all) ----

; Host:port of the local GPT4All server (OpenAI-compatible endpoint).
; Default values match GPT4All's out-of-the-box configuration.
gpt4all_host = localhost
gpt4all_port = 4891

; Model name as recognized by the GPT4All server. Must match a model
; loaded in the GPT4All UI before the triage walk starts.
gpt4all_model = Llama 3 8B Instruct

; ---- Common keys (apply to all providers) ----

; Network timeout for API calls and citation verification (seconds).
timeout_seconds = 30

; Whether to programmatically verify citation URLs. Strongly recommended
; — disabling this means "high confidence" labels are unverified.
; Operationally relevant only if your network can't reach vendor
; documentation hosts (rare).
verify_citations = true

[behavior]
; Operator approval is REQUIRED for every merge regardless of
; confidence. This flag is here to make that policy explicit and
; INI-visible. Setting it to false would be a violation of the
; founding principle and the schema validator should reject it.
require_operator_approval = true

; When the schema-learner detects a finding for which it cannot
; determine a structural placement (similarity all below
; auto_propose_minimum), it marks the finding as "novel — operator
; must classify with no engine hint." This flag controls whether to
; produce a finding entry at all in that case (true) or skip it (false).
report_unplaceable_findings = true

; When applying an approved merge, ALWAYS back up the INIs being
; modified to <name>.ini.bak.<timestamp> before any change. Setting
; this to false would prevent rollback and is dangerous.
backup_before_merge = true
