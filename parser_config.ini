# ============================================================================
# parser_config.ini — Patterns / Rules / Regex for the SonicWall parser.
#
# Nothing about SonicWall lives in code. Everything lives here.
#
# Algebraic-design idea (J P Ames, "Applied Algebraic Design for Agentic AI"):
#   Object × Verb = Action.
#   Object = a logical config category (address-object, policy, interface, ...)
#   Verb   = a parser action (match-start, capture-field, close-block)
#   Action = the resulting JSON entry written to disk.
#
# The engine is a state machine; this file is the matrix that tells it what
# states exist and how to transition.
#
# Section ordering matters: the engine tests sections in declaration order
# and stops at the first match. Specific patterns must come BEFORE general
# ones (e.g. `vpn policy ...` before bare `vpn`).
# 
#   (C) Copyright 2026, jim ames. all rights reserved. 
#   reverse engineering my system is prohibited.
#   license: closed source, commercial use license required.
#   no hobby or one-off use- MSP only
#
#   contact: jimpames@gmail.com for licensing
#
#   $10,000 per MSP one-time
# 
#  need something else other than sonicwall to watchguard?
#  translate most anything to sonicwall with THEIR universal translator
#  then use FESv11 algebraic to translate THAT to watchguard... 
# 
# 
# ============================================================================

[meta]
name        = SonicOS Enhanced -> Canonical JSON Parser
version     = 1.0.0
target      = SonicOS Enhanced 6.5.x   ; tested against 6.5.4.14-109n
description = Phase 1 of the SonicWall->WatchGuard migration. Groups raw
              SonicOS config into one JSON file per logical area. Phase 2
              will translate these JSONs to WatchGuard CLI syntax using a
              second translator config (separate INI).

# ----------------------------------------------------------------------------
# Global parsing behavior
# ----------------------------------------------------------------------------
[parser]
# Token that closes any open block. SonicOS uses 'exit'.
block_terminator   = exit

# Whitespace style of the input.
indent_style       = spaces
indent_size        = 4

# When a captured value is "quoted", strip the surrounding quotes.
strip_quotes       = true

# Convert  `no <thing>`  lines into  <thing> = false.
parse_no_negation  = true

# When the same body key appears multiple times in one block, collect into a
# JSON array instead of overwriting. (The 'list_fields' override below forces
# array-form even for single-occurrence keys.)
auto_collect_repeated = true

# What to do with body lines we can't parse (e.g. comments, malformed lines):
# 'preserve' = keep them under _unparsed_lines on the entry; 'drop' = discard.
unmatched_body_action = preserve

# Body lines starting with this prefix are treated as comments and skipped.
# (SonicOS sometimes emits `# Error: Invalid command: ...` markers.)
# Set blank to disable.
body_comment_prefix = #

# ----------------------------------------------------------------------------
# Output behavior
# ----------------------------------------------------------------------------
[output]
directory          = output
indent_json        = 2
# Every emitted entry gets these envelope keys (set blank to disable):
envelope_id_field         = _id
envelope_source_lines     = _source_lines
envelope_section_name     = _section
# Wrap the whole file in a top-level object with this key (blank = bare list):
list_wrapper_key          = entries
include_run_metadata      = true   ; adds _meta block (parser version, timestamp, source)


# ============================================================================
# SECTION DEFINITIONS
#
# Each [section.<name>] section declares one logical config area.
#
# Required keys:
#   description   - human label (also shown in the editor GUI)
#   match_regex   - Python regex matching the START line (column 0).
#                   Named groups (?P<x>...) become top-level fields on the entry.
#   form          - 'block'        : opens a body terminated by 'exit'
#                   'single_line'  : entire entry is one line
#                   'block_or_single' : block if next line is indented, else single
#   output_file   - JSON filename (relative to [output] directory)
#
# Optional keys:
#   key_field     - which field to use as the entry _id (else use start-line text)
#   list_fields   - csv. Force these body keys to always be JSON arrays.
#   ignore_fields - csv. Body keys to drop entirely.
#   priority      - integer. Lower wins ties when two regexes match (rare).
# ============================================================================


# ---- Address objects (host, network, range, fqdn, mac) ---------------------
[section.address_objects]
description = Address objects — single hosts, networks, ranges, FQDNs, MACs.
match_regex = ^address-object\s+(?P<family>ipv4|ipv6|fqdn|mac)\s+(?P<name>"[^"]+"|\S+)\s*$
form        = block
output_file = address_objects.json
key_field   = name


# ---- Address groups (collections) ------------------------------------------
[section.address_groups]
description = Address groups — collections of address-objects/groups.
match_regex = ^address-group\s+(?P<family>ipv4|ipv6|fqdn|mac)\s+(?P<name>"[^"]+"|\S+)\s*$
form        = block
output_file = address_groups.json
key_field   = name
# These body keys may repeat — force array form even when only one is present.
list_fields = address-object, address-group


# ---- Service objects (single-line: <name> <proto> [port-low] [port-high])
#       OR named ICMP types (<name> ICMP echo-reply / destination-unreachable / ...)
#       OR pure-protocol entries (<name> ESP) with no ports/types.
[section.service_objects]
description = Service objects — single-line protocol/port definitions (TCP, UDP, ICMP, ESP, AH, GRE, …).
match_regex = ^service-object\s+(?P<name>"[^"]+"|\S+)\s+(?P<protocol>[A-Za-z0-9_-]+)(?:\s+(?P<port_low>\d+|"[^"]+"|[A-Za-z][A-Za-z0-9_-]*)(?:\s+(?P<port_high>\d+))?)?\s*$
form        = single_line
output_file = service_objects.json
key_field   = name


# ---- Service groups --------------------------------------------------------
[section.service_groups]
description = Service groups — collections of service-objects/groups.
match_regex = ^service-group\s+(?P<name>"[^"]+"|\S+)\s*$
form        = block
output_file = service_groups.json
key_field   = name
list_fields = service-object, service-group


# ---- Schedules -------------------------------------------------------------
[section.schedules]
description = Schedules — recurring or one-time time windows used by policies.
match_regex = ^schedule\s+(?P<name>"[^"]+"|\S+)\s*$
form        = block
output_file = schedules.json
key_field   = name
list_fields = recurring, once


# ---- Zones -----------------------------------------------------------------
[section.zones]
description = Security zones (LAN, WAN, DMZ, VPN, SSLVPN, WLAN, etc.).
match_regex = ^zone\s+(?P<name>"[^"]+"|\S+)\s*$
form        = block
output_file = zones.json
key_field   = name


# ---- Interfaces (IPv4 — must come BEFORE the IPv6 form? No — see priority) -
# Note: 'interface ipv6 X0' must match BEFORE 'interface X0' because the IPv4
# form regex would also match 'interface ipv6'. We solve this by listing the
# more specific (ipv6) section first.
[section.interfaces_ipv6]
description = IPv6 interface configuration (per-interface).
match_regex = ^interface\s+ipv6\s+(?P<id>\S+)\s*$
form        = block
output_file = interfaces_ipv6.json
key_field   = id

[section.interfaces]
description = IPv4 / physical / virtual / VLAN interfaces.
match_regex = ^interface\s+(?P<id>\S+)\s*$
form        = block
output_file = interfaces.json
key_field   = id


# ---- Access rules (firewall policies) --------------------------------------
[section.access_rules]
description = Access rules — zone-to-zone firewall policies.
match_regex = ^access-rule\s+(?P<family>ipv4|ipv6)\s+from\s+(?P<from_zone>\S+)\s+to\s+(?P<to_zone>\S+)\s+action\s+(?P<action>allow|deny|discard)(?:\s+(?P<inline_spec>.+))?\s*$
form        = block
output_file = access_rules.json
key_field   = uuid


# ---- NAT policies (may not appear in slim sample but always supported) -----
[section.nat_policies]
description = NAT policies (SNAT, DNAT, no-NAT, reflexive).
match_regex = ^nat-policy\s+(?P<family>ipv4|ipv6)\s+.*$
form        = block
output_file = nat_policies.json
key_field   = uuid


# ---- VPN policies (specific) — IKE Phase 1 / Phase 2 -----------------------
# Specific VPN forms must come BEFORE the bare 'vpn' global block.
[section.vpn_policies]
description = VPN policies (group-vpn, site-to-site, tunnel-interface). Carries IKE Phase 1 / IPsec Phase 2 proposals.
match_regex = ^vpn\s+policy\s+(?P<vpn_type>group-vpn|tunnel-interface|site-to-site|ipsec)\s+(?P<name>"[^"]+"|\S+)\s*$
form        = block
output_file = vpn_policies.json
key_field   = name


# ---- VPN global (bare 'vpn' block) -----------------------------------------
[section.vpn_global]
description = Global VPN settings (NAT-T, DPD, IKEv2 defaults, DNS-over-VPN).
match_regex = ^vpn\s*$
form        = block
output_file = vpn_global.json


# ---- Static routes ---------------------------------------------------------
[section.route_policies]
description = Static / policy-based routes.
match_regex = ^route-policy\s+(?P<family>ipv4|ipv6)\s+.*$
form        = block
output_file = route_policies.json
key_field   = uuid


# ---- DHCP server (IPv6 form first so it matches before bare 'dhcp-server') -
[section.dhcp_server_ipv6]
description = DHCPv6 server.
match_regex = ^dhcp-server\s+ipv6\s*$
form        = block
output_file = dhcp_server_ipv6.json

[section.dhcp_server]
description = DHCP server scopes and options (IPv4).
match_regex = ^dhcp-server\s*$
form        = block
output_file = dhcp_server.json


# ---- Wi-Fi (SonicPoint) ----------------------------------------------------
[section.sonicpoint_wifi]
description = SonicPoint / SonicWave Wi-Fi — profiles, radios, SSIDs, VAPs.
match_regex = ^sonicpoint\s*$
form        = block
output_file = sonicpoint_wifi.json


# ---- Firewall global behavior ----------------------------------------------
[section.firewall_global]
description = Global firewall settings (stealth, TTL, FTP transforms, IPv6 drops).
match_regex = ^firewall\s*$
form        = block
output_file = firewall_global.json


# ---- SSL VPN (server, portal, profile) -------------------------------------
[section.ssl_vpn_server]
description = SSL VPN server (NetExtender) configuration.
match_regex = ^ssl-vpn\s+server\s*$
form        = block
output_file = ssl_vpn_server.json

[section.ssl_vpn_portal]
description = SSL VPN portal (web portal layouts and bookmarks).
match_regex = ^ssl-vpn\s+portal(?:\s+(?P<name>"[^"]+"|\S+))?\s*$
form        = block
output_file = ssl_vpn_portal.json
key_field   = name

[section.ssl_vpn_profile]
description = SSL VPN client profile.
match_regex = ^ssl-vpn\s+profile(?:\s+(?P<name>"[^"]+"|\S+))?\s*$
form        = block
output_file = ssl_vpn_profile.json
key_field   = name


# ---- User auth (broader: sso/radius/ldap/tacacs/local/authentication/guest/management) -
[section.users_auth]
description = User authentication / management blocks.
match_regex = ^user\s+(?P<auth_type>sso|radius|ldap|tacacs|local|authentication|guest|management)(?:\s+(?P<sub>\S+))?\s*$
form        = block
output_file = users_auth.json
key_field   = auth_type


# ---- Administration --------------------------------------------------------
[section.administration]
description = Admin / management settings (credentials policy, web mgmt, API).
match_regex = ^administration\s*$
form        = block
output_file = administration.json


# ---- Failover / load balancing ---------------------------------------------
[section.failover_lb]
description = WAN failover & load balancing groups and probes.
match_regex = ^failover-lb\s*$
form        = block
output_file = failover_lb.json


# ---- SD-WAN ----------------------------------------------------------------
[section.sdwan]
description = SD-WAN performance classes, path selection, application steering.
match_regex = ^sdwan\s*$
form        = block
output_file = sdwan.json


# ---- Content filter (CFS) --------------------------------------------------
[section.content_filter]
description = Content Filter Service (CFS) actions, profiles, categories.
match_regex = ^content-filter\s*$
form        = block
output_file = content_filter.json


# ---- Security services (AV / IPS / anti-spyware) ---------------------------
[section.security_services]
description = Gateway AV, IPS, anti-spyware umbrella settings.
match_regex = ^security-services\s*$
form        = block
output_file = security_services.json


# ---- DNS / DNS Security ----------------------------------------------------
[section.dns_directive]
description = DNS single-line directives (`dns server inherit`, `dns split-servers`, etc.).
match_regex = ^dns\s+(?P<key>\S+)(?:\s+(?P<value>.+?))?\s*$
form        = single_line
output_file = dns_directives.json

[section.dns]
description = DNS resolver block (when used as a block).
match_regex = ^dns\s*$
form        = block
output_file = dns.json

[section.dns_security]
description = DNS Security / DNS Filter Service.
match_regex = ^dns-security\s*$
form        = block
output_file = dns_security.json


# ---- High availability -----------------------------------------------------
[section.high_availability]
description = HA active/standby and clustering settings.
match_regex = ^high-availability\s*$
form        = block
output_file = high_availability.json


# ---- AppFlow ---------------------------------------------------------------
[section.appflow]
description = AppFlow / IPFIX export and reporting.
match_regex = ^appflow\s*$
form        = block
output_file = appflow.json


# ---- SNMP ------------------------------------------------------------------
[section.snmp]
description = SNMP agent and traps.
match_regex = ^snmp\s*$
form        = block
output_file = snmp.json


# ---- Bandwidth management --------------------------------------------------
[section.bandwidth_objects]
description = Bandwidth-management objects (egress/ingress priorities).
match_regex = ^bandwidth-object\s+(?P<name>"[^"]+"|\S+)\s*$
form        = block
output_file = bandwidth_objects.json
key_field   = name

[section.bandwidth_management]
description = Global bandwidth-management mode.
match_regex = ^bandwidth-management\s*$
form        = block
output_file = bandwidth_management.json


# ---- Misc protocol / hardening blocks --------------------------------------
[section.icmp_protocol]
description = ICMP protocol-level tuning.
match_regex = ^icmp\s*$
form        = block
output_file = icmp_protocol.json

[section.tcp_protocol]
description = TCP stack tuning (SYN flood, MSS).
match_regex = ^tcp\s*$
form        = block
output_file = tcp_protocol.json

[section.udp_protocol]
description = UDP stack tuning.
match_regex = ^udp\s*$
form        = block
output_file = udp_protocol.json

[section.arp]
description = ARP entries and behavior.
match_regex = ^arp\s*$
form        = block
output_file = arp.json

[section.ndp_directive]
description = NDP single-line directives (`ndp reachable-time 30`).
match_regex = ^ndp\s+(?P<key>\S+)(?:\s+(?P<value>.+?))?\s*$
form        = single_line
output_file = ndp_directives.json

[section.ndp]
description = IPv6 Neighbor Discovery (NDP) block.
match_regex = ^ndp\s*$
form        = block
output_file = ndp.json

[section.ip_helper]
description = IP Helper (DHCP relay, NetBIOS, etc.).
match_regex = ^ip-helper\s*$
form        = block
output_file = ip_helper.json

[section.mac_ip_anti_spoof_ipv6]
description = MAC/IP anti-spoof — IPv6.
match_regex = ^mac-ip-anti-spoof\s+ipv6\s*$
form        = block
output_file = mac_ip_anti_spoof_ipv6.json

[section.mac_ip_anti_spoof]
description = MAC/IP anti-spoof — IPv4 / per interface.
match_regex = ^mac-ip-anti-spoof\s*$
form        = block
output_file = mac_ip_anti_spoof.json

[section.qos_mapping_entry]
description = QoS mapping single-line entries (CoS↔DSCP).
match_regex = ^qos-mapping\s+(?P<rest>.+?)\s*$
form        = single_line
output_file = qos_mapping_entries.json

[section.qos_mapping]
description = QoS / DSCP / 802.1p mapping block.
match_regex = ^qos-mapping\s*$
form        = block
output_file = qos_mapping.json

[section.voip]
description = VoIP / SIP / H.323 transformation settings.
match_regex = ^voip\s*$
form        = block
output_file = voip.json

[section.web_proxy]
description = Web proxy settings.
match_regex = ^web-proxy\s*$
form        = block
output_file = web_proxy.json

[section.ssl_control]
description = SSL Control (DPI-SSL outbound posture).
match_regex = ^ssl-control\s*$
form        = block
output_file = ssl_control.json

[section.rbl]
description = Real-time Blackhole List (anti-spam).
match_regex = ^rbl\s*$
form        = block
output_file = rbl.json

[section.virtual_assist]
description = Virtual Assist (technician remote support).
match_regex = ^virtual-assist\s*$
form        = block
output_file = virtual_assist.json

[section.switch_controller]
description = Switch Controller (managed switches).
match_regex = ^switch-controller\s*$
form        = block
output_file = switch_controller.json

[section.packet_monitor]
description = Packet capture / monitor configuration.
match_regex = ^packet-monitor\s*$
form        = block
output_file = packet_monitor.json


# ---- Top-level "no <foo>" single-line negations ----------------------------
[section.top_level_negations]
description = Top-level `no <foo>` single-line directives (e.g. `no interfaces display-all-traffic`).
match_regex = ^no\s+(?P<directive>.+?)\s*$
form        = single_line
output_file = top_level_negations.json


# ---- File terminator -------------------------------------------------------
[section.file_terminator]
description = `end` token at the end of the config file.
match_regex = ^end\s*$
form        = single_line
output_file = file_terminator.json


# ---- Pure scalars at the file head -----------------------------------------
# These are single-line top-of-file declarations: key, optional value.
# Captured as one document into device_metadata.json.
[section.device_metadata]
description = Device metadata at the top of the config (firmware, model, serial, time).
match_regex = ^(?P<key>firmware-version|rom-version|safemode-version|model|serial-number|system-time|system-uptime|last-modified-by|firmware|license|checksum)\s+(?P<value>.+?)\s*$
form        = single_line
output_file = device_metadata.json
key_field   = key


# ---- CLI session settings (single-line) ------------------------------------
[section.cli_settings]
description = CLI session settings (one entry per directive).
match_regex = ^(?P<key>cli)\s+(?P<value>.+?)\s*$
form        = single_line
output_file = cli_settings.json


# ---- Diagnostics blocks ----------------------------------------------------
[section.diag]
description = Diagnostic / advanced engineering blocks (`diag advanced ...`).
match_regex = ^diag\s+.*$
form        = block
output_file = diag.json


# ---- Content of bare 'license' / 'firmware' / 'tech-support-report' blocks -
[section.license_block]
description = License feature key block.
match_regex = ^license\s*$
form        = block
output_file = license_block.json

[section.firmware_block]
description = Firmware management block.
match_regex = ^firmware\s*$
form        = block
output_file = firmware_block.json

[section.tech_support_report]
description = Tech Support Report (TSR) settings.
match_regex = ^tech-support-report(?:\s+(?P<sub>\S+))?\s*$
form        = block
output_file = tech_support_report.json

[section.time_block]
description = System time / NTP.
match_regex = ^time\s*$
form        = block
output_file = time_block.json

[section.ssh_block]
description = SSH client/server settings.
match_regex = ^ssh\s+.*$
form        = block
output_file = ssh_block.json

[section.user_partitioning]
description = User partitioning settings. Single block. Out of migration scope (WG
    has separate authentication-realm / partition mechanisms).
match_regex = ^user partitioning\s*$
form = block
output_file = user_partitioning.json

[section.switch_block]
description = Switch controller block. Out of migration scope (NSA-only PoE switch
    orchestration; no WG equivalent in our target shape).
match_regex = ^switch\s*$
form = block
output_file = switch_block.json

[section.log_settings]
description = SonicOS logging configuration directives. Both block-form openers
    (log audit, log automation, log categories, log syslog,
    log name-resolution) and single-line directives (log display ...,
    log category "..." ..., etc.) match this rule. Out of migration
    scope — WatchGuard logging is configured separately on the target
    device. Captured here so they don't pollute _unparsed.
match_regex = ^log\s+(?P<log_spec>.+)$
form = block_or_single
output_file = log_settings.json
