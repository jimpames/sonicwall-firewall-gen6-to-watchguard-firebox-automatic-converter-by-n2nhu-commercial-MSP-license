# ============================================================================
# enrich_config.ini  —  Phase 1.5 enrichment passes.
#
# Run after the parser (Phase 1) and before the XML emitter (Phase 2).
# Each [pass.X] section declares ONE pass: pivot, derive, or audit.
#
# Order matters: derive passes that produce inputs for later passes must
# come first. The engine runs passes in declaration order.
# 
#   (C) Copyright 2026, jim ames. all rights reserved. 
