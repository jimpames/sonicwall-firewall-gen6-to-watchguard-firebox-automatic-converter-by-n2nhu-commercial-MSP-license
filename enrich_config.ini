[meta]
name        = SonicWall canonical-JSON enrichment passes
version     = 1.0.0
description = Pivots VPN proposals into phase1/phase2 dicts; synthesizes
              SonicWall implicit address objects from interfaces; audits
              crypto choices against modern severity tables.

[io]
parser_output_dir   = ../sonicwall_parser/output
enricher_output_dir = ./output
concept_map_path    = ../concept_map/concept_map.ini


# ============================================================================
# PASS 1 — Synthesize SonicWall's implicit interface address objects.
#
# SonicOS generates "X0 Subnet", "X1 IP", etc. from the interface table.
# These never appear in the config but ARE referenced by VPN policies.
# Without this synthesis, ~60-80% of real site-to-site VPNs break in Phase 2.
#
# Read interfaces.json; emit one or more synthetic address-object entries
# per interface that has an IP assignment.
# ============================================================================
[pass.derive_implicit_addresses]
description     = Synthesize SonicWall's auto-generated per-interface address
                  objects (X0 Subnet, X0 IP, X0 Default Gateway, etc.).
kind            = derive
input_file      = interfaces.json
output_file     = implicit_address_objects.json
enabled         = true
derive_from     = interfaces
# Each rule key is the synthesized name template; value is the JSON skeleton
# to emit. Placeholders <id>, <ip>, <netmask>, <gateway>, <network> resolve
# from the input entry's fields. Conditional: an emit only fires if all its
# required placeholders resolve to non-null values.
derive_template = "<id> Subnet"          = {"family":"ipv4","name":"<id> Subnet","zone":"<zone>","network":"<network> <netmask>","_implicit":true,"_derived_from":"<id>"}
                  "<id> IP"              = {"family":"ipv4","name":"<id> IP","zone":"<zone>","host":"<ip>","_implicit":true,"_derived_from":"<id>"}
                  "<id> Default Gateway" = {"family":"ipv4","name":"<id> Default Gateway","zone":"<zone>","host":"<gateway>","_implicit":true,"_derived_from":"<id>"}


# ============================================================================
# PASS 2 — Pivot VPN proposal arrays into phase1/phase2 dicts.
#
# SonicOS expresses crypto as flat lines:
#       proposal ike encryption 3des
#       proposal ike authentication sha-1
#       proposal ipsec encryption aes-256
# We pivot into:
#       phase1: { encryption: "3des", authentication: "sha-1", ... }
#       phase2: { encryption: "aes-256", ... }
# Strongly required for clean Phase 2 emit: WG XML wants them as nested
# elements, not flat strings.
# ============================================================================
[pass.pivot_vpn_proposals]
description     = Pivot vpn_policies[].proposal[] from flat strings into
                  structured phase1{} and phase2{} dicts.
kind            = pivot
input_file      = vpn_policies.json
output_file     = vpn_policies.json
enabled         = true
pivot_array     = proposal
pivot_target    = (split into phase1 and phase2)
pivot_keep_raw  = true
# Patterns: each rule maps a token-pattern to a dotted field assignment.
# <v> captures the trailing value.
pivot_rules     = "ike encryption <v>"               = phase1.encryption=<v>
                  "ike authentication <v>"           = phase1.authentication=<v>
                  "ike dh-group <v>"                 = phase1.dh_group=<v>
                  "ike exchange <v>"                 = phase1.exchange=<v>
                  "ike lifetime <v>"                 = phase1.lifetime_seconds=<v>
                  "ipsec protocol <v>"               = phase2.protocol=<v>
                  "ipsec encryption <v>"             = phase2.encryption=<v>
                  "ipsec authentication <v>"         = phase2.authentication=<v>
                  "ipsec lifetime <v>"               = phase2.lifetime_seconds=<v>
                  "ipsec perfect-forward-secrecy"    = phase2.pfs=true


# ============================================================================
# PASS 4 — Normalize address-group member references.
#
# SonicWall stores address-group members as `ipv4 "Name"` or `ipv6 "Name"`,
# preserving the family prefix in the literal string. WatchGuard wants just
# the bare name. This pass strips the prefix so emit produces clean
# <aliasname>Name</aliasname> instead of <aliasname>ipv4 "Name"</aliasname>.
#
# Implemented as a 'transform' pass — a new pass kind that walks each
# entry's specified field list and applies a regex find/replace to each
# string value (or array element).
# ============================================================================
[pass.normalize_address_group_members]
description     = Strip "ipv4 " / "ipv6 " family prefix and surrounding quotes
                  from address-group member references so they translate to
                  clean WatchGuard aliasname values.
kind            = transform
input_file      = address_groups.json
output_file     = address_groups.json
enabled         = true
# Field paths to transform. List fields get each element transformed.
transform_fields = address-object, address-group
# Regex find/replace — applied per string value.
# Capture group 1 is the bare name; everything else (prefix + quotes) drops.
transform_pattern     = ^(?:ipv4|ipv6|fqdn|mac)\s+"?([^"]+)"?\s*$
transform_replacement = \1

[pass.drop_sonicwall_default_address_groups]
description = SonicWall pre-populates address-group placeholders for every
    physical interface slot (X0..X17, U0..U1, MGMT) for both IPv6 host
    addresses and IPv6 management addresses, regardless of whether the
    customer uses IPv6 on those interfaces. It also seeds zone-level
    IPv6 placeholders (LAN IPv6 Subnets, WAN IPv6 Subnets, etc.) and a
    'Default Geo-IP and Botnet Exclusion Group'. All of these ship with
    no members on a factory-reset SonicWall and have no migration value
    for a customer who doesn't use IPv6.
    
    WatchGuard has its own Geo-IP exclusion mechanism and its own
    interface address representation; copying SonicWall's empty
    placeholders just clutters the WG Aliases panel with X0-X17 IPv6
    Addresses, etc.
    
    Detection (both conditions must match):
      - 'name' matches one of the known SonicWall factory patterns
        (interface IPv6 addresses, mgmt IPv6 addresses, zone IPv6
        subnets, default Geo-IP exclusion)
      - 'members' is empty (None / [] / "")
    
    A customer who deliberately added members to one of these named
    groups (e.g. populated 'X0 IPv6 Addresses' with real addresses)
    would survive the filter because the empty_members condition
    would fail.
kind = filter
input_file = address_groups.json
output_file = address_groups.json
# Match factory-default naming patterns: interface slots (X0..X17,
# U0..U1, MGMT), Management variants, zone IPv6 placeholders, and the
# Geo-IP exclusion. Anchored with ^ and $ so customer-named groups
# with similar prefixes still pass.
regex_name = ^(?:[XU]\d+|MGMT) IPv6 Addresses$|^(?:[XU]\d+|MGMT) Management IPv6 Addresses$|^[A-Z]+ IPv6 Subnets$|^[A-Z]+ IPv6 Addresses$|^[A-Z]+ Interface IPv6 Addresses$|^Default Geo-IP and Botnet Exclusion Group$
empty_members = true
enabled = true


# ============================================================================
# PASS 6 — Merge TCP/UDP twin service-objects (Chad 1).
#
# SonicWall splits TCP and UDP variants of the same service into separate
# objects:  "DNS (Name Service) TCP"  +  "DNS (Name Service) UDP"
# WatchGuard collapses them into ONE <service> with two <member> entries.
#
# Strategy 'name_pattern' captures the prefix from each twin name; entries
# with matching prefixes get merged. Singletons (no twin) pass through
# unchanged.
# ============================================================================
[pass.merge_tcp_udp_twins]
description     = Merge SonicWall TCP/UDP twin service-objects into single
                  multi-protocol service entries (Chad 1).
kind            = merge
input_file      = service_objects.json
output_file     = service_objects.json
enabled         = true
strategy        = name_pattern
# Capture group 1 = the merged-entry name (the prefix without TCP/UDP suffix)
name_pattern    = ^(.+)\s+(TCP|UDP)$
members_field   = service_members
# Per-member fields to copy in from each merged source entry
member_carry_fields = protocol, port_low, port_high


# ============================================================================
# PASS 7 — Expand SonicWall service-groups (Chad 2).
#
# SonicWall service-groups can contain other service-groups recursively,
# plus direct service-object references. WatchGuard does not have separate
# group entries — each "group" becomes one <service> with multiple <member>
# children, where each member carries its own protocol/port. We recursively
# flatten the SonicWall group tree to get a list of leaf protocol+port
# triples, then emit as one merged WG-shaped service.
#
# Strategy 'recursive_expand' walks reference_fields looking up names in
# leaves_file (the service-objects from pass 6 above), then recurses into
# nested_reference_field for nested groups.
# ============================================================================
[pass.expand_service_groups]
description     = Recursively expand SonicWall service-groups into leaf
                  protocol/port lists, ready for WG merged-service emit.
kind            = merge
input_file      = service_groups.json
output_file     = service_groups.json
enabled         = true
strategy        = recursive_expand
# Where to find leaf service-objects (post TCP/UDP merge)
leaves_file     = service_objects.json
# Fields that hold direct leaf references (one or more)
reference_fields = service-object
# Field that holds nested-group references (recursive)
nested_reference_field = service-group
# What to carry from each leaf into the member record
member_carry_fields = protocol, port_low, port_high
# Use the same members_field name as merge_tcp_udp_twins for a uniform emit interface
members_field   = service_members
skip_empty_groups = true


# ============================================================================
# PASS 8 — Expand SonicWall schedules to WatchGuard day-of-week shape (Chad 3).
#
# SonicWall stores schedule lines as "HH:MM HH:MM <day-tokens>" (one or
# many lines). WatchGuard wants nested day-of-week + period blocks (one
# member per active day). We expand each SonicWall recurring line into a
# `wg_schedule` field on the entry: an array of {day_of_week, periods[]}
# records, ready for the emit rule to translate to XML.
#
# WatchGuard day-of-week mapping (cracked from real T-30 export):
#   0 = "every day"  (used by Always On)
#   1 = Monday  ... 5 = Friday
#   6 = Saturday    7 = Sunday  (typical ISO mapping)
# ============================================================================
[pass.expand_schedules]
description     = Expand SonicWall recurring schedule lines into WG-shaped
                  day-of-week member records (Chad 3).
kind            = expand_schedule
input_file      = schedules.json
output_file     = schedules.json
enabled         = true
# Source field: the SonicWall recurring spec, may be string or array of strings.
source_field    = occurs.recurring
# Output field: the WG-shaped day_periods array.
output_field    = wg_schedule
# Day-token mapping (declared here so it's never hardcoded in the engine)
day_tokens      = sun=0, mon=1, tue=2, wed=3, thu=4, fri=5, sat=6,
                  sunday=0, monday=1, tuesday=2, wednesday=3, thursday=4,
                  friday=5, saturday=6,
                  all=-1, daily=-1, everyday=-1,
                  all=0
# When all-day-on (00:00 24:00 all), use schedule_type "always_on" instead
# (WG sets type=0). Otherwise schedule_type "recurring" (type=2).
emit_type_field = wg_schedule_type
#
# Walks each vpn_policies entry's pivoted phase1/phase2, looks up each
# value in crypto_audit tables from concept_map.ini, attaches findings.
# ============================================================================
[pass.audit_vpn_crypto]
description     = Audit each VPN policy's IKE/IPsec crypto against modern
                  severity tables; flag deprecated algorithms.
kind            = audit
input_file      = vpn_policies.json
output_file     = vpn_policies.json
enabled         = true
audit_target    = phase1.encryption, phase1.authentication, phase1.dh_group,
                  phase2.encryption, phase2.authentication, phase2.pfs
audit_table     = (auto-derived from target field name)
findings_field  = crypto_findings
upgrade_table   = crypto_upgrade_recommendation
upgrade_field   = upgrade_recommendation

[pass.normalize_service_references]
description = Normalize SonicWall service reference syntax in access_rules.
    SonicWall stores `service name "X"` as the literal RHS of the
    directive. WatchGuard XML expects just the bare service name
    as the text of <service>. This pass strips the `name "..."`
    wrapper so the emitter produces clean <service>X</service>.
    Also handles `group "X"` to bare X (for service-group refs).
kind = transform
input_file = access_rules.json
output_file = access_rules.json
transform_fields = service
transform_pattern = ^(?:name|group)\s+"?([^"]*)"?\s*$
transform_replacement = \1

enabled = true
[pass.normalize_address_references]
description = Normalize SonicWall address reference syntax in access_rules.
    SonicWall stores `destination address group "X"` or
    `destination address any` as the literal directive text.
    Strip the `address` keyword and any `group` keyword and
    quotes so the emitter sees just the bare reference name.
kind = transform
input_file = access_rules.json
output_file = access_rules.json
transform_fields = source, destination
transform_pattern = ^address\s+(?:group\s+)?"?([^"]*)"?\s*$
transform_replacement = \1
enabled = true

[pass.drop_sonicwall_default_zone_rules]
description = SonicWall auto-generates a default access rule for every
    zone-pair (LAN->WAN, WAN->LAN, DMZ->WAN, etc.) for both IPv4 and
    IPv6. These rules have no name (the SonicOS config emits 'name
    False' for auto-generated rules) and a stock comment
    ('IPv4:From Any to Any for Any service' or the IPv6 equivalent).
    They're SonicWall's implicit zone-access matrix, not customer-
    meaningful rules.
    
    WatchGuard's policy model uses default-deny plus an Outgoing-00
    factory policy that already permits LAN->External, so these
    auto-generated rules add no information after migration. Filter
    them out so the WG Web UI Firewall Policies panel shows only the
    customer's substantive policies.
    
    Detection (both conditions must match):
      - 'comment' matches '^IPv[46]:From Any to Any for Any service$'
        (the exact SonicWall-generated stock comment)
      - 'name' equals 'False' (SonicWall's literal for no-name rules)
    
    A customer-authored rule with content 'any/any/any' would not
    match because it would have either a real name OR a different
    comment OR both.
kind = filter
input_file = access_rules.json
output_file = access_rules.json
regex_comment = ^IPv[46]:From Any to Any for Any service$
match_name = False
enabled = true
