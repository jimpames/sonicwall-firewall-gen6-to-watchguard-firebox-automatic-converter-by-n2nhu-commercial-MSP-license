# ============================================================================
# parser_schema.ini — Schema describing parser_config.ini.
#
# A GUI editor reads THIS file to render a form-based editor for
# parser_config.ini.  The schema defines:
#   - what field types exist (string / regex / enum / bool / int / csv-list / path)
#   - what widget renders each type
#   - what validation each type carries
#   - which sections of parser_config.ini are fixed vs repeatable
#   - which fields exist in each section, and their type
#
# Algebraic-design idea applied recursively:
#   The parser is data-driven by parser_config.ini.
#   parser_config.ini is data-driven by parser_schema.ini.
#   parser_schema.ini is the "physics" — fundamental, rarely changed.
#
# Object × Verb table (logical):
#   Object      Verb        Action
#   string      edit        text input box
#   regex       edit        regex-aware text box (syntax highlight + live test)
#   enum        edit        dropdown
#   bool        edit        checkbox
#   csv_list    edit        chip / tag editor
#   path        edit        relative path picker
#   integer     edit        number spinner with min/max
#   any-type    validate    run validator before save
#   any-type    default     fill from default if empty on creation
# 
#   (C) Copyright 2026, jim ames. all rights reserved. 
#   reverse engineering my system is prohibited.
#   license: closed source, commercial use license required.
#   no hobby or one-off use- MSP only
#
#   contact: jimpames@gmail.com for licensing
#
#   $10,000 per MSP one-time
# 
#  need something else other than sonicwall to watchguard?
#  translate most anything to sonicwall with THEIR universal translator
#  then use FESv11 algebraic to translate THAT to watchguard... 
# 
# 
# ============================================================================

[schema_meta]
name        = parser_config.ini schema
version     = 1.0.0
target      = parser_config.ini v1.0.x
description = Drives the GUI editor for parser_config.ini.
              Edit only when adding new field-types or restructuring sections.


# ============================================================================
# FIELD TYPES — the leaf widgets the GUI knows how to render
# ============================================================================

[type.string]
widget                 = text_input
multiline              = false
validate_regex         = ^.{0,1024}$
validation_message     = Up to 1024 characters.

[type.string_multiline]
widget                 = textarea
multiline              = true

[type.regex]
widget                 = regex_input
syntax_highlight       = python_re
live_test              = true
validate_python_regex  = true
validation_message     = Must compile with Python `re.compile(..., re.MULTILINE)`.

[type.enum]
widget                 = dropdown
# Allowed values are supplied per-field via the field's `values` key.

[type.bool]
widget                 = checkbox
true_values            = true, yes, 1, on
false_values           = false, no, 0, off

[type.integer]
widget                 = number_input
min                    = 0
step                   = 1

[type.csv_list]
widget                 = chip_list
delimiter              = ,
trim_whitespace        = true
allow_empty            = true

[type.path]
widget                 = path_input
relative_to            = output_directory
must_exist_on_save     = false


# ============================================================================
# TOP-LEVEL FIXED SECTIONS of parser_config.ini
#
# These appear exactly once. The schema enumerates their fields.
# The GUI renders one form per fixed section.
# ============================================================================

# ---- [meta] -----------------------------------------------------------------
[section_schema.meta]
ini_section_name = meta
cardinality      = single
order            = 10
title            = Parser Metadata
description      = Identifies this parser configuration.
fields           = name, version, target, description

[field_schema.meta.name]
type     = string
required = true
help     = Human-readable name for this parser configuration.

[field_schema.meta.version]
type     = string
required = true
help     = Semantic version (e.g. 1.0.0). Bump when you change patterns.

[field_schema.meta.target]
type     = string
required = false
help     = Which SonicOS version this configuration targets.

[field_schema.meta.description]
type     = string_multiline
required = false


# ---- [parser] ---------------------------------------------------------------
[section_schema.parser]
ini_section_name = parser
cardinality      = single
order            = 20
title            = Global Parsing Behavior
description      = How the engine walks the input file.
fields           = block_terminator, indent_style, indent_size, strip_quotes,
                   parse_no_negation, auto_collect_repeated, unmatched_body_action

[field_schema.parser.block_terminator]
type     = string
required = true
default  = exit
help     = Token that closes any open block. SonicOS uses 'exit'.

[field_schema.parser.indent_style]
type     = enum
values   = spaces, tabs
default  = spaces

[field_schema.parser.indent_size]
type     = integer
default  = 4
min      = 1
max      = 8

[field_schema.parser.strip_quotes]
type     = bool
default  = true
help     = Strip surrounding double-quotes from captured values.

[field_schema.parser.parse_no_negation]
type     = bool
default  = true
help     = Convert `no <key>` lines into `<key> = false`.

[field_schema.parser.auto_collect_repeated]
type     = bool
default  = true
help     = When the same body key appears multiple times, collect into a JSON array.

[field_schema.parser.unmatched_body_action]
type     = enum
values   = preserve, drop
default  = preserve
help     = What to do with body lines that don't match the simple key/value form.


# ---- [output] ---------------------------------------------------------------
[section_schema.output]
ini_section_name = output
cardinality      = single
order            = 30
title            = Output Behavior
description      = How JSON files are written.
fields           = directory, indent_json, envelope_id_field, envelope_source_lines,
                   envelope_section_name, list_wrapper_key, include_run_metadata

[field_schema.output.directory]
type     = path
required = true
default  = output

[field_schema.output.indent_json]
type     = integer
default  = 2
min      = 0
max      = 8

[field_schema.output.envelope_id_field]
type     = string
default  = _id
help     = Key under which each entry's ID is stored. Blank = disable.

[field_schema.output.envelope_source_lines]
type     = string
default  = _source_lines
help     = Key holding [start,end] line numbers from the source config. Blank = disable.

[field_schema.output.envelope_section_name]
type     = string
default  = _section
help     = Key holding the section name (for cross-file lookups). Blank = disable.

[field_schema.output.list_wrapper_key]
type     = string
default  = entries
help     = If set, each output JSON is `{ "<key>": [...] }`. Blank = bare list.

[field_schema.output.include_run_metadata]
type     = bool
default  = true
help     = Add a top-level _meta block to each JSON (parser version, timestamp, source file).


# ============================================================================
# REPEATABLE [section.<name>] SECTIONS
#
# These define one logical SonicWall config category each.
# Cardinality is 'multi' — the GUI shows an "+ Add Section" button and a list.
# Each instance is one [section.<name>] block in parser_config.ini.
# ============================================================================

[section_schema.parser_section]
ini_section_name_pattern = ^section\.[a-z_][a-z0-9_]*$
cardinality              = multi
order                    = 100
title                    = Config Sections (one per logical SonicWall area)
description              = Each entry declares one section we extract from the
                           SonicWall config and emit as its own JSON file.
                           Order matters: specific patterns must come BEFORE
                           general ones (e.g. `vpn policy ...` before bare `vpn`).
fields                   = description, match_regex, form, output_file, key_field,
                           list_fields, ignore_fields, priority

[field_schema.parser_section.description]
type     = string
required = true
help     = What this section captures. Shown as the entry heading in the GUI.

[field_schema.parser_section.match_regex]
type     = regex
required = true
help     = Python regex matching the START line at column 0.
           Named groups (?P<x>...) become top-level fields on the output entry.
           Test live in the editor against pasted sample config lines.

[field_schema.parser_section.form]
type     = enum
values   = block, single_line, block_or_single
default  = block
help     = `block` ends at `exit`. `single_line` = one entry per line.
           `block_or_single` = block if next line is indented, else single.

[field_schema.parser_section.output_file]
type     = path
required = true
help     = JSON output filename, relative to [output] directory.

[field_schema.parser_section.key_field]
type     = string
required = false
help     = Which captured field uniquely identifies this entry (e.g. `name`, `uuid`).
           Used to populate the envelope `_id` field.

[field_schema.parser_section.list_fields]
type     = csv_list
required = false
help     = Body keys that should always be JSON arrays, even with one occurrence.
           Example: address-group has `address-object` lines that are inherently a list.

[field_schema.parser_section.ignore_fields]
type     = csv_list
required = false
help     = Body keys to drop entirely from the JSON output.

[field_schema.parser_section.priority]
type     = integer
required = false
default  = 100
help     = Lower wins ties when two regexes both match a line. Rare.


# ============================================================================
# GUI HINTS — overall layout the editor should produce
# ============================================================================

[gui_layout]
window_title       = SonicWall Parser Configuration Editor
left_panel         = section_list      ; tree of sections in the INI
right_panel        = field_form        ; form for the selected section
top_toolbar        = save, validate, reload, run_parser, export_diff
status_bar         = unsaved_changes, last_validated
keyboard_shortcuts = save:Ctrl+S, validate:Ctrl+R, run:Ctrl+Enter

[gui_features]
live_regex_tester  = true   ; paste a sample line; see if the regex matches
section_drag_order = true   ; reorder sections by drag (matters for matching)
inline_run         = true   ; "Run parser on input/<file>" button
diff_view          = true   ; show diff against last saved config
import_export      = true   ; import/export .ini snapshots
