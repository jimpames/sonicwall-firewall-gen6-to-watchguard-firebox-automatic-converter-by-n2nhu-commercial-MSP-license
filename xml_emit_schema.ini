[schema_meta]
name        = xml_emit_config.ini schema
version     = 1.0.0
description = Drives the GUI editor for the XML emit rules.

[type.string]
widget = text_input
[type.string_multiline]
widget = textarea
[type.path]
widget = path_input
[type.xpath]
widget = xpath_input
help     = Path inside configuration.xml where children of this rule are written.
[type.enum]
widget = dropdown
[type.bool]
widget = checkbox
[type.csv_list]
widget = chip_list
[type.kv_list]
widget = key_value_editor
[type.regex]
widget = regex_input

# ============================================================================
# FIXED SECTIONS
# ============================================================================

[section_schema.io]
ini_section_name = io
cardinality      = single
fields           = enricher_output_dir, parser_output_dir,
                   concept_map_path, output_dir, root_element

[field_schema.io.enricher_output_dir]
type     = path
required = true
help     = Where Phase 1.5 wrote its enriched JSONs.

[field_schema.io.parser_output_dir]
type     = path
required = true
help     = Fallback for sections the enricher did not touch.

[field_schema.io.concept_map_path]
type     = path
required = true

[field_schema.io.output_dir]
type     = path
required = true
default  = dry_run
help     = Where to write the generated XML. dry_run/ by default.

[field_schema.io.root_element]
type     = string
default  = configuration
help     = Root element of the WatchGuard XML.


# ============================================================================
# REPEATABLE EMIT RULES
# ============================================================================

[section_schema.emit]
ini_section_name_pattern = ^emit\.[a-z_][a-z0-9_]*$
cardinality              = multi
order                    = 100
title                    = Emit rules (one per WatchGuard XML section)
fields                   = description, status,
                           input_file, input_filter,
                           xml_parent_xpath, xml_element_name,
                           name_attribute, child_map,
                           value_maps, conditional_children,
                           merge_implicit_addresses

[field_schema.emit.description]
type     = string_multiline
required = true

[field_schema.emit.status]
type     = enum
values   = confirmed, todo, partial, advisory_only
default  = todo
help     = 'confirmed' = XPath verified against a real WG export.
           'todo' = stubbed; needs T-30 export to fill in.

[field_schema.emit.input_file]
type     = path
required = false
help     = Source JSON filename. Empty = produce static/global elements.

[field_schema.emit.input_filter]
type     = string
required = false
help     = Boolean expression on entry fields, e.g. 'vpn_type == "site-to-site"'.

[field_schema.emit.xml_parent_xpath]
type     = xpath
required = true
help     = Parent element path. Created if missing. Example:
           "/configuration/address-group-list" -> children appear inside that list.

[field_schema.emit.xml_element_name]
type     = string
required = true
help     = Element name for each emitted entry, e.g. "address-group" or "alias".

[field_schema.emit.name_attribute]
type     = string
required = false
help     = If present, use this JSON field as the element's <name> child.

[field_schema.emit.child_map]
type     = kv_list
help     = JSON-field -> XML-child mapping. Special syntax:
             field_name = element_name                 (text content)
             field_name = element_name@attr_name       (as attribute)
             field_name = parent/child_element         (nested path)
             field_name = element_name | value_map_x   (transformed value)

[field_schema.emit.value_maps]
type     = csv_list
help     = Names of [value_map.X] tables in concept_map.ini to apply.

[field_schema.emit.conditional_children]
type     = kv_list
help     = condition = element_definition. Only emit child if condition true.

[field_schema.emit.merge_implicit_addresses]
type     = bool
default  = false
help     = If true, merge implicit_address_objects.json into this section's input.
