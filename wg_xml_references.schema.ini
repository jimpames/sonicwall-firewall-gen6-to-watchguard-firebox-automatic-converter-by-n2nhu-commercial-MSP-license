# =========================================================================
# wg_xml_references.schema.ini
#
# Meta-schema for wg_xml_references.ini.
# =========================================================================

[meta]
name        = wg_xml_references_schema
version     = 1.0.0
description = Meta-schema for wg_xml_references.ini.


[section.meta]
required = true

[section.meta.field.name]
type     = string
required = true

[section.meta.field.version]
type     = string
required = true

[section.meta.field.description]
type     = multiline_string
required = false


# -------------------------------------------------------------------------
# [reference.X] sections — each declares one cross-reference rule
# -------------------------------------------------------------------------
[section_pattern.reference]
match_pattern = ^reference\.[\w_-]+$
description   = One cross-reference rule. The X in [reference.X] is a
                short identifier; the rule itself is fully described
                by its from_xpath and to_xpath fields.

[section_pattern.reference.field.description]
type     = multiline_string
required = false

[section_pattern.reference.field.from_xpath]
type     = string
required = true
help     = XPath of elements whose text content is a name-reference.

[section_pattern.reference.field.to_xpath]
type     = string
required = true
help     = XPath of definition elements that the references resolve to.

[section_pattern.reference.field.to_field]
type     = string
required = true
help     = Name of the child element of definitions that holds the
              identifier (typically "name").

[section_pattern.reference.field.allow_empty]
type     = bool
required = false
help     = Whether empty text is acceptable (no reference made).

[section_pattern.reference.field.allow_builtin]
type     = string
required = false
help     = Name of a [builtin.X] section whose names list is also
              accepted as valid references.

[section_pattern.reference.field.severity]
type        = enum
enum_values = error, warning, info
required    = false


# -------------------------------------------------------------------------
# [builtin.X] sections — each is a category of allowed-but-undefined names
# -------------------------------------------------------------------------
[section_pattern.builtin]
match_pattern = ^builtin\.[\w_-]+$
description   = A category of names that don't need to be defined
                in the XML being validated. Used by [reference.X]
                rules via allow_builtin.

[section_pattern.builtin.field.description]
type     = multiline_string
required = false

[section_pattern.builtin.field.names]
type     = multiline_string
required = true
help     = Comma-separated list of names that are valid references
              even when not defined in the XML being validated.
