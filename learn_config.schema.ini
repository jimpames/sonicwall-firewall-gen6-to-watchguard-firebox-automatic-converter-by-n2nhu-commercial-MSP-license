; ===========================================================================
; learn_config.schema.ini — Meta-schema for learn_config.ini
; ===========================================================================
;
; Validation rules for the schema-learner driving config. Used by
; schema_lib.validate_config at engine startup. Catches typos,
; missing-required-field, type errors, and out-of-range values
; before the engine runs.

[meta]
schema_version = 1
description = Validates schema-learner driving config (learn_config.ini)

[section.meta]
required = true
[section.meta.field.config_version]
type = int
required = true
[section.meta.field.description]
type = multiline_string
required = true

[section.io]
required = true
[section.io.field.corpus_dir]
type = string
required = true
help = Path to corpus directory. Relative paths resolved against the
       schema_learner directory.
[section.io.field.existing_schema_path]
type = string
required = true
help = Path to wg_xml_schema.ini (or equivalent target schema).
[section.io.field.proposals_dir]
type = string
required = true
help = Path where dated proposal subdirectories will be written.
[section.io.field.findings_format]
type = enum
required = true
enum_values = markdown, json, both

[section.thresholds]
required = true
[section.thresholds.field.auto_propose_minimum]
type = string
required = true
help = Confidence below which engine produces no automatic structural
       placement. Float in [0, 1] expressed as string (schema_lib does
       not have a float type yet; engine parses with getfloat).
[section.thresholds.field.high_confidence]
type = string
required = true
[section.thresholds.field.medium_confidence]
type = string
required = true

[section.reporting]
required = true
[section.reporting.field.top_k_neighbors]
type = int
required = true
help = How many top-similarity neighbors to include in each finding.
[section.reporting.field.neighbor_minimum_similarity]
type = string
required = true

[section.auto_reuse]
required = true
[section.auto_reuse.field.similarity_threshold]
type = string
required = true
help = Aggregate structural similarity (>=) to trigger auto-reuse of
       a previously-classified surface from the approved corpus.
       0.85 baseline per Decision #1.
[section.auto_reuse.field.emit_provenance_comment]
type = bool
required = true
[section.auto_reuse.field.report_auto_reused_findings]
type = bool
required = true

[section.banned_suppression]
required = true
[section.banned_suppression.field.similarity_threshold]
type = string
required = true
help = Aggregate structural similarity (>=) to suppress a draft as
       matching a banned-corpus entry. 0.80 baseline per Decision #2.

[section.mcp]
required = true
[section.mcp.field.enabled]
type = bool
required = true
help = Phase 3 master switch. False keeps Phase 2 behavior (no LLM drafts).
[section.mcp.field.provider]
type = string
required = false
help = Provider selector: anthropic|gpt4all|stub. Defaults to anthropic.
       The principle binding (citation verification, confidence
       aggregation) is provider-agnostic.
[section.mcp.field.api_key_env_var]
type = string
required = true
help = Environment variable holding API key (anthropic provider).
[section.mcp.field.model]
type = string
required = true
help = Anthropic model name for drafting.
[section.mcp.field.gpt4all_host]
type = string
required = false
help = Hostname of GPT4All OpenAI-compatible server (default localhost).
[section.mcp.field.gpt4all_port]
type = int
required = false
help = Port of GPT4All OpenAI-compatible server (default 4891).
[section.mcp.field.gpt4all_model]
type = string
required = false
help = Model name as loaded in GPT4All (e.g. "Llama 3 8B Instruct").
[section.mcp.field.timeout_seconds]
type = int
required = true
[section.mcp.field.verify_citations]
type = bool
required = true
help = Whether to programmatically fetch+verify citation URLs.

[section.behavior]
required = true
[section.behavior.field.require_operator_approval]
type = bool
required = true
help = Must always be true. False would violate the founding principle.
[section.behavior.field.report_unplaceable_findings]
type = bool
required = true
[section.behavior.field.backup_before_merge]
type = bool
required = true
help = Must always be true. False would prevent rollback.
