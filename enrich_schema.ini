# ============================================================================
# enrich_schema.ini  —  Schema for enrich_config.ini.
#
# Phase 1.5 sits between the parser (Phase 1) and the XML emitter (Phase 2).
# Its job: take raw canonical JSON and DERIVE additional context — pivoted
# fields, synthesized objects, audit findings, upgrade recommendations.
#
# The enricher is a generic engine. It knows three kinds of pass:
#
#   pivot   - reshape an array of strings into a structured dict
#             (e.g. "ike encryption 3des" -> phase1.encryption=3des)
#   derive  - synthesize NEW entries from existing ones
#             (e.g. interfaces.json -> implicit_address_objects.json)
#   audit   - walk entries, apply a severity table, emit findings
#             (e.g. crypto_findings on each VPN policy)
#
# Each pass is declared as a section in enrich_config.ini. The engine reads
# the schema (this file) to render a GUI editor for the enrich_config.ini.
# ============================================================================

[schema_meta]
name        = enrich_config.ini schema
version     = 1.0.0
description = Schema for the Phase 1.5 enrichment configuration.

# ============================================================================
# FIELD TYPES
# ============================================================================

[type.string]
widget = text_input

[type.string_multiline]
widget = textarea

[type.path]
widget = path_input

[type.regex]
widget = regex_input

[type.enum]
widget = dropdown

[type.bool]
widget = checkbox

[type.csv_list]
widget = chip_list
delimiter = ,

[type.kv_list]
widget = key_value_editor
help     = One assignment per row: key on the left, value on the right.

# ============================================================================
# FIXED SECTIONS
# ============================================================================

[section_schema.io]
ini_section_name = io
cardinality      = single
title            = Input/Output paths
fields           = parser_output_dir, enricher_output_dir, concept_map_path

[field_schema.io.parser_output_dir]
type     = path
required = true
help     = Where Phase 1 wrote its JSONs.

[field_schema.io.enricher_output_dir]
type     = path
required = true
help     = Where Phase 1.5 writes its enriched JSONs.

[field_schema.io.concept_map_path]
type     = path
required = true
help     = Path to concept_map.ini (provides value-maps and audit tables).


# ============================================================================
# REPEATABLE PASSES
#
# Each [pass.<name>] declares one enrichment pass.
# ============================================================================

[section_schema.pass]
ini_section_name_pattern = ^pass\.[a-z_][a-z0-9_]*$
cardinality              = multi
order                    = 100
title                    = Enrichment passes (run in declaration order)
fields                   = description, kind, input_file, output_file, enabled,
                           pivot_array, pivot_rules, pivot_target, pivot_keep_raw,
                           derive_from, derive_template,
                           audit_target, audit_table, findings_field,
                           upgrade_table, upgrade_field

[field_schema.pass.description]
type     = string_multiline
required = true

[field_schema.pass.kind]
type     = enum
values   = pivot, derive, audit
required = true

[field_schema.pass.input_file]
type     = path
required = true
help     = Source JSON filename (relative to io.parser_output_dir).

[field_schema.pass.output_file]
type     = path
required = true
help     = Destination JSON filename (relative to io.enricher_output_dir).

[field_schema.pass.enabled]
type     = bool
default  = true

# --- Fields used only by 'pivot' passes -------------------------------------

[field_schema.pass.pivot_array]
type     = string
help     = Name of the array field to pivot (e.g. "proposal").

[field_schema.pass.pivot_rules]
type     = kv_list
help     = Pattern -> assignment. Pattern uses <var> placeholders.
           Example: "ike encryption <v>" = phase1.encryption=<v>

[field_schema.pass.pivot_target]
type     = string
help     = Name of the new field that holds the pivoted dict.

[field_schema.pass.pivot_keep_raw]
type     = bool
default  = true
help     = Keep the original array as _raw_<arrayname>.

# --- Fields used only by 'derive' passes ------------------------------------

[field_schema.pass.derive_from]
type     = string
help     = Section name to iterate over (e.g. "interfaces").

[field_schema.pass.derive_template]
type     = kv_list
help     = Per-input entry, emit one or more new entries using these
           templates. Placeholders: <id>, <ip>, <netmask>, <zone>, etc.

# --- Fields used only by 'audit' passes -------------------------------------

[field_schema.pass.audit_target]
type     = csv_list
help     = Dotted-path fields on each entry to audit (e.g. phase1.encryption).

[field_schema.pass.audit_table]
type     = string
help     = Name of the [crypto_audit.X] table in concept_map.ini.

[field_schema.pass.findings_field]
type     = string
default  = crypto_findings
help     = Field on each entry to write the array of findings to.

[field_schema.pass.upgrade_table]
type     = string
help     = Name of the [crypto_upgrade_recommendation] section to use.

[field_schema.pass.upgrade_field]
type     = string
default  = upgrade_recommendation
